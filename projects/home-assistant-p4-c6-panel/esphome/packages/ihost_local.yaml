# ─── iHost / eWeLink page ──────────────────────────────────────────────────────
# Displays live temp+humidity for up to 6 Zigbee sensors and toggles
# up to 2 switches — all via the panel-hub at /ihost/.
#
# Layout:
#   Row 1 (y=70, h=188): sensor cards 1-3
#   Row 2 (y=268, h=188): sensor cards 4-6
#   Switch row (y=466, h=94): sw1 (left half) + sw2 (right half, hidden if empty)
#
# Navigation: Dashboard → [swipe left] → iHost → [swipe left] → Tado
#
# Sensor cards auto-hide when their label is empty.
# Switch cards likewise. At least one serial must be set or polling does nothing.

globals:
  - id: g_ih_bridge_ok
    type: bool
    restore_value: false

  - id: g_ih_busy
    type: bool
    restore_value: false

  - id: g_ih_page_active
    type: bool
    restore_value: false

  # Temperature floats: -99 = unknown
  - id: g_ih_t1
    type: float
    restore_value: false
    initial_value: "-99"
  - id: g_ih_t2
    type: float
    restore_value: false
    initial_value: "-99"
  - id: g_ih_t3
    type: float
    restore_value: false
    initial_value: "-99"
  - id: g_ih_t4
    type: float
    restore_value: false
    initial_value: "-99"
  - id: g_ih_t5
    type: float
    restore_value: false
    initial_value: "-99"
  - id: g_ih_t6
    type: float
    restore_value: false
    initial_value: "-99"

  # Humidity floats: -1 = unknown
  - id: g_ih_h1
    type: float
    restore_value: false
    initial_value: "-1"
  - id: g_ih_h2
    type: float
    restore_value: false
    initial_value: "-1"
  - id: g_ih_h3
    type: float
    restore_value: false
    initial_value: "-1"
  - id: g_ih_h4
    type: float
    restore_value: false
    initial_value: "-1"
  - id: g_ih_h5
    type: float
    restore_value: false
    initial_value: "-1"
  - id: g_ih_h6
    type: float
    restore_value: false
    initial_value: "-1"

  # Sensor online flags
  - id: g_ih_ol1
    type: bool
    restore_value: false
  - id: g_ih_ol2
    type: bool
    restore_value: false
  - id: g_ih_ol3
    type: bool
    restore_value: false
  - id: g_ih_ol4
    type: bool
    restore_value: false
  - id: g_ih_ol5
    type: bool
    restore_value: false
  - id: g_ih_ol6
    type: bool
    restore_value: false

  # Switch states: -1 = unknown, 0 = off, 1 = on
  - id: g_ih_sw1
    type: int
    restore_value: false
    initial_value: "-1"
  - id: g_ih_sw2
    type: int
    restore_value: false
    initial_value: "-1"

script:
  # ── Bridge health ──────────────────────────────────────────────────────────
  - id: ih_poll_health
    mode: single
    then:
      - http_request.get:
          url: "${ihost_proxy_url}/health"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  id(g_ih_bridge_ok) = (response->status_code == 200);
                  if (id(g_ih_bridge_ok)) id(g_ih_last_ok) = millis();
                  id(ih_apply_ui).execute();
          on_error:
            then:
              - lambda: |-
                  id(g_ih_bridge_ok) = false;
                  id(ih_apply_ui).execute();

  # ── Refresh all sensors + switches sequentially ────────────────────────────
  - id: ih_refresh_all
    mode: restart
    then:
      # Always claim the lock first — on restart the old coroutine dies here,
      # so g_ih_busy is reset to true at the top of every run.
      - lambda: 'id(g_ih_busy) = true;'

      # Sensor 1
      - if:
          condition:
            lambda: 'return strlen("${ih_sensor1_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sensor1_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            id(g_ih_t1) = r["temperature"].isNull() ? -99.f : r["temperature"].as<float>();
                            id(g_ih_h1) = r["humidity"].isNull() ? -1.f  : r["humidity"].as<float>();
                            id(g_ih_ol1) = r["online"].as<bool>();
                            return true;
                          });
                        else { id(g_ih_t1) = -99; id(g_ih_h1) = -1; id(g_ih_ol1) = false; }
                on_error:
                  then:
                    - lambda: 'id(g_ih_t1) = -99; id(g_ih_h1) = -1; id(g_ih_ol1) = false;'
      - delay: 120ms

      # Sensor 2
      - if:
          condition:
            lambda: 'return strlen("${ih_sensor2_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sensor2_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            id(g_ih_t2) = r["temperature"].isNull() ? -99.f : r["temperature"].as<float>();
                            id(g_ih_h2) = r["humidity"].isNull() ? -1.f  : r["humidity"].as<float>();
                            id(g_ih_ol2) = r["online"].as<bool>();
                            return true;
                          });
                        else { id(g_ih_t2) = -99; id(g_ih_h2) = -1; id(g_ih_ol2) = false; }
                on_error:
                  then:
                    - lambda: 'id(g_ih_t2) = -99; id(g_ih_h2) = -1; id(g_ih_ol2) = false;'
      - delay: 120ms

      # Sensor 3
      - if:
          condition:
            lambda: 'return strlen("${ih_sensor3_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sensor3_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            id(g_ih_t3) = r["temperature"].isNull() ? -99.f : r["temperature"].as<float>();
                            id(g_ih_h3) = r["humidity"].isNull() ? -1.f  : r["humidity"].as<float>();
                            id(g_ih_ol3) = r["online"].as<bool>();
                            return true;
                          });
                        else { id(g_ih_t3) = -99; id(g_ih_h3) = -1; id(g_ih_ol3) = false; }
                on_error:
                  then:
                    - lambda: 'id(g_ih_t3) = -99; id(g_ih_h3) = -1; id(g_ih_ol3) = false;'
      - delay: 120ms

      # Sensor 4
      - if:
          condition:
            lambda: 'return strlen("${ih_sensor4_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sensor4_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            id(g_ih_t4) = r["temperature"].isNull() ? -99.f : r["temperature"].as<float>();
                            id(g_ih_h4) = r["humidity"].isNull() ? -1.f  : r["humidity"].as<float>();
                            id(g_ih_ol4) = r["online"].as<bool>();
                            return true;
                          });
                        else { id(g_ih_t4) = -99; id(g_ih_h4) = -1; id(g_ih_ol4) = false; }
                on_error:
                  then:
                    - lambda: 'id(g_ih_t4) = -99; id(g_ih_h4) = -1; id(g_ih_ol4) = false;'
      - delay: 120ms

      # Sensor 5
      - if:
          condition:
            lambda: 'return strlen("${ih_sensor5_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sensor5_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            id(g_ih_t5) = r["temperature"].isNull() ? -99.f : r["temperature"].as<float>();
                            id(g_ih_h5) = r["humidity"].isNull() ? -1.f  : r["humidity"].as<float>();
                            id(g_ih_ol5) = r["online"].as<bool>();
                            return true;
                          });
                        else { id(g_ih_t5) = -99; id(g_ih_h5) = -1; id(g_ih_ol5) = false; }
                on_error:
                  then:
                    - lambda: 'id(g_ih_t5) = -99; id(g_ih_h5) = -1; id(g_ih_ol5) = false;'
      - delay: 120ms

      # Sensor 6
      - if:
          condition:
            lambda: 'return strlen("${ih_sensor6_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sensor6_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            id(g_ih_t6) = r["temperature"].isNull() ? -99.f : r["temperature"].as<float>();
                            id(g_ih_h6) = r["humidity"].isNull() ? -1.f  : r["humidity"].as<float>();
                            id(g_ih_ol6) = r["online"].as<bool>();
                            return true;
                          });
                        else { id(g_ih_t6) = -99; id(g_ih_h6) = -1; id(g_ih_ol6) = false; }
                on_error:
                  then:
                    - lambda: 'id(g_ih_t6) = -99; id(g_ih_h6) = -1; id(g_ih_ol6) = false;'
      - delay: 120ms

      # Switch 1
      - if:
          condition:
            lambda: 'return strlen("${ih_sw1_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sw1_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            if (!r["on"].isNull())
                              id(g_ih_sw1) = r["on"].as<bool>() ? 1 : 0;
                            else id(g_ih_sw1) = -1;
                            return true;
                          });
                        else id(g_ih_sw1) = -1;
                on_error:
                  then:
                    - lambda: 'id(g_ih_sw1) = -1;'
      - delay: 120ms

      # Switch 2
      - if:
          condition:
            lambda: 'return strlen("${ih_sw2_serial}") > 0;'
          then:
            - http_request.get:
                url: "${ihost_proxy_url}/device/${ih_sw2_serial}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200)
                          json::parse_json(body, [](JsonObject r) -> bool {
                            if (!r["on"].isNull())
                              id(g_ih_sw2) = r["on"].as<bool>() ? 1 : 0;
                            else id(g_ih_sw2) = -1;
                            return true;
                          });
                        else id(g_ih_sw2) = -1;
                on_error:
                  then:
                    - lambda: 'id(g_ih_sw2) = -1;'

      - script.execute: ih_apply_ui
      - lambda: 'id(g_ih_busy) = false;'

  # ── UI apply ──────────────────────────────────────────────────────────────
  - id: ih_apply_ui
    mode: single
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          bool ok = id(g_ih_bridge_ok);

          // Bridge status badge
          lv_label_set_text(id(ih_status_lbl), ok ? "ONLINE" : "OFFLINE");
          lv_obj_set_style_text_color(id(ih_status_lbl),
            lv_color_hex(ok ? (uint32_t)id(g_theme_success) : (uint32_t)id(g_theme_warning)), 0);

          // Helper: format one sensor card
          auto upd_sensor = [&](float t, float h, bool online,
                                lv_obj_t *card, lv_obj_t *temp_lbl, lv_obj_t *hum_lbl) {
            char tb[12], hb[12];
            if (!ok || t <= -90.f) {
              lv_label_set_text(temp_lbl, "--");
              lv_label_set_text(hum_lbl,  "--");
              lv_obj_set_style_bg_color(card, lv_color_hex((uint32_t)id(g_theme_card_bg)), 0);
              lv_obj_set_style_text_color(temp_lbl, lv_color_hex((uint32_t)id(g_theme_text_muted)), 0);
              lv_obj_set_style_text_color(hum_lbl,  lv_color_hex((uint32_t)id(g_theme_text_muted)), 0);
            } else {
              snprintf(tb, sizeof(tb), "%.1f\xc2\xb0""C", t);
              snprintf(hb, sizeof(hb), "%.0f%%", h < 0 ? 0 : h);
              lv_label_set_text(temp_lbl, tb);
              lv_label_set_text(hum_lbl,  hb);
              uint32_t card_col = online ? (uint32_t)id(g_theme_card_bg) : 0x1A1020;
              lv_obj_set_style_bg_color(card, lv_color_hex(card_col), 0);
              // Temp colour: blue <16, green 16-24, orange 24-28, red >28
              uint32_t tc = t < 16.f ? 0x6BBBFF :
                            t < 24.f ? (uint32_t)id(g_theme_success) :
                            t < 28.f ? (uint32_t)id(g_theme_warning) :
                                       (uint32_t)id(g_theme_error);
              lv_obj_set_style_text_color(temp_lbl, lv_color_hex(tc), 0);
              lv_obj_set_style_text_color(hum_lbl,
                lv_color_hex((uint32_t)id(g_theme_text_muted)), 0);
            }
          };

          upd_sensor(id(g_ih_t1), id(g_ih_h1), id(g_ih_ol1),
                     id(ih_sc1), id(ih_temp1), id(ih_hum1));
          upd_sensor(id(g_ih_t2), id(g_ih_h2), id(g_ih_ol2),
                     id(ih_sc2), id(ih_temp2), id(ih_hum2));
          upd_sensor(id(g_ih_t3), id(g_ih_h3), id(g_ih_ol3),
                     id(ih_sc3), id(ih_temp3), id(ih_hum3));
          upd_sensor(id(g_ih_t4), id(g_ih_h4), id(g_ih_ol4),
                     id(ih_sc4), id(ih_temp4), id(ih_hum4));
          upd_sensor(id(g_ih_t5), id(g_ih_h5), id(g_ih_ol5),
                     id(ih_sc5), id(ih_temp5), id(ih_hum5));
          upd_sensor(id(g_ih_t6), id(g_ih_h6), id(g_ih_ol6),
                     id(ih_sc6), id(ih_temp6), id(ih_hum6));

          // Switch 1
          {
            int s = id(g_ih_sw1);
            uint32_t bg  = (!ok || s < 0) ? (uint32_t)id(g_theme_card_bg) :
                           (s ? (uint32_t)id(g_theme_accent_bg) : (uint32_t)id(g_theme_card_bg));
            const char* txt = (!ok) ? "--" : (s < 0 ? "---" : (s ? "ON" : "OFF"));
            uint32_t tc  = (!ok || s < 0) ? (uint32_t)id(g_theme_text_muted) :
                           (s ? (uint32_t)id(g_theme_success) : (uint32_t)id(g_theme_lamp_off));
            lv_obj_set_style_bg_color(id(ih_sw1_card), lv_color_hex(bg), 0);
            lv_label_set_text(id(ih_sw1_state), txt);
            lv_obj_set_style_text_color(id(ih_sw1_state), lv_color_hex(tc), 0);
          }

          // Switch 2
          {
            int s = id(g_ih_sw2);
            uint32_t bg  = (!ok || s < 0) ? (uint32_t)id(g_theme_card_bg) :
                           (s ? (uint32_t)id(g_theme_accent_bg) : (uint32_t)id(g_theme_card_bg));
            const char* txt = (!ok) ? "--" : (s < 0 ? "---" : (s ? "ON" : "OFF"));
            uint32_t tc  = (!ok || s < 0) ? (uint32_t)id(g_theme_text_muted) :
                           (s ? (uint32_t)id(g_theme_success) : (uint32_t)id(g_theme_lamp_off));
            lv_obj_set_style_bg_color(id(ih_sw2_card), lv_color_hex(bg), 0);
            lv_label_set_text(id(ih_sw2_state), txt);
            lv_obj_set_style_text_color(id(ih_sw2_state), lv_color_hex(tc), 0);
          }

  # ── Switch toggle scripts ─────────────────────────────────────────────────
  - id: ih_toggle_sw1
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(g_ih_busy) && id(g_ih_bridge_ok) && strlen("${ih_sw1_serial}") > 0;'
          then:
            - lambda: |-
                id(g_ih_busy) = true;
                id(g_ih_sw1) = (id(g_ih_sw1) == 1) ? 0 : 1;
            - script.execute: ih_apply_ui
            - if:
                condition:
                  lambda: 'return id(g_ih_sw1) == 1;'
                then:
                  - http_request.post:
                      url: "${ihost_proxy_url}/device/${ih_sw1_serial}/on"
                      body: ""
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code != 200) id(g_ih_sw1) = 0;
                              id(g_ih_busy) = false;
                              id(ih_apply_ui).execute();
                      on_error:
                        then:
                          - lambda: 'id(g_ih_sw1) = 0; id(g_ih_busy) = false; id(ih_apply_ui).execute();'
                else:
                  - http_request.post:
                      url: "${ihost_proxy_url}/device/${ih_sw1_serial}/off"
                      body: ""
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code != 200) id(g_ih_sw1) = 1;
                              id(g_ih_busy) = false;
                              id(ih_apply_ui).execute();
                      on_error:
                        then:
                          - lambda: 'id(g_ih_sw1) = 1; id(g_ih_busy) = false; id(ih_apply_ui).execute();'

  - id: ih_toggle_sw2
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(g_ih_busy) && id(g_ih_bridge_ok) && strlen("${ih_sw2_serial}") > 0;'
          then:
            - lambda: |-
                id(g_ih_busy) = true;
                id(g_ih_sw2) = (id(g_ih_sw2) == 1) ? 0 : 1;
            - script.execute: ih_apply_ui
            - if:
                condition:
                  lambda: 'return id(g_ih_sw2) == 1;'
                then:
                  - http_request.post:
                      url: "${ihost_proxy_url}/device/${ih_sw2_serial}/on"
                      body: ""
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code != 200) id(g_ih_sw2) = 0;
                              id(g_ih_busy) = false;
                              id(ih_apply_ui).execute();
                      on_error:
                        then:
                          - lambda: 'id(g_ih_sw2) = 0; id(g_ih_busy) = false; id(ih_apply_ui).execute();'
                else:
                  - http_request.post:
                      url: "${ihost_proxy_url}/device/${ih_sw2_serial}/off"
                      body: ""
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code != 200) id(g_ih_sw2) = 1;
                              id(g_ih_busy) = false;
                              id(ih_apply_ui).execute();
                      on_error:
                        then:
                          - lambda: 'id(g_ih_sw2) = 1; id(g_ih_busy) = false; id(ih_apply_ui).execute();'

# ── 60s auto-refresh while page is active ─────────────────────────────────────
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(g_ih_page_active);'
          then:
            - script.execute: ih_refresh_all

# ── LVGL page ─────────────────────────────────────────────────────────────────
lvgl:
  pages:
    - id: ihost_page
      bg_color: 0x071019
      on_load:
        - lambda: |-
            id(g_ih_page_active) = true;
            // Hide cards with no label (compile-time check)
            if (strlen("${ih_sensor1_label}") == 0) lv_obj_add_flag(id(ih_sc1), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_sensor2_label}") == 0) lv_obj_add_flag(id(ih_sc2), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_sensor3_label}") == 0) lv_obj_add_flag(id(ih_sc3), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_sensor4_label}") == 0) lv_obj_add_flag(id(ih_sc4), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_sensor5_label}") == 0) lv_obj_add_flag(id(ih_sc5), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_sensor6_label}") == 0) lv_obj_add_flag(id(ih_sc6), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_sw1_label}") == 0) lv_obj_add_flag(id(ih_sw1_card), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_sw2_label}") == 0) lv_obj_add_flag(id(ih_sw2_card), LV_OBJ_FLAG_HIDDEN);
        - script.execute: ih_poll_health
        - script.execute: ih_refresh_all
      on_unload:
        - lambda: |-
            id(g_ih_page_active) = false;
            id(g_ih_busy) = false;
      on_swipe_right:
        - lvgl.page.show: dashboard_page
      on_swipe_left:
        - lvgl.page.show: tado_page
      widgets:

        # ── Top bar ───────────────────────────────────────────────────────────
        - obj:
            id: ih_header_bar
            width: 1024
            height: 58
            align: TOP_LEFT
            bg_color: 0x0B1624
            bg_opa: 98%
            border_width: 0
            border_side: BOTTOM
            border_color: 0x263B55
            pad_all: 0
            widgets:
              - button:
                  align: LEFT_MID
                  x: 14
                  width: 52
                  height: 38
                  bg_color: 0x1A3552
                  radius: 9
                  border_width: 0
                  on_click:
                    - lvgl.page.show: slideshow_page
                  widgets:
                    - image: { align: CENTER, src: img_home }
              - label:
                  align: CENTER
                  x: -50
                  text: "iHost / Sonoff"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
              - label:
                  id: ih_status_lbl
                  align: CENTER
                  x: 108
                  text: "..."
                  text_font: montserrat_14
                  text_color: 0xFFAA00
              - button:
                  align: RIGHT_MID
                  x: -140
                  width: 52
                  height: 38
                  bg_color: 0x0D2540
                  radius: 9
                  border_width: 1
                  border_color: 0x263B55
                  on_click:
                    - script.execute: ih_poll_health
                    - script.execute: ih_refresh_all
                  widgets:
                    - label: { align: CENTER, text: "", text_font: montserrat_22, text_color: 0xAABBCC }
              - button:
                  align: RIGHT_MID
                  x: -78
                  width: 52
                  height: 38
                  bg_color: 0x1A3552
                  radius: 9
                  border_width: 0
                  on_click:
                    - lvgl.page.show: dashboard_page
                  widgets:
