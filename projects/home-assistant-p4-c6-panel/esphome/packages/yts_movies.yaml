# ─── Latest Movies page (YTS browse → Radarr grab) ────────────────────────────
# Poster-gallery layout: 5 columns x 2 rows = 10 tiles (poster + title below +
# status dot). Tap a tile to open the details popup (plot, language, genres,
# runtime, cast) which carries the Download action. Browses the YTS "latest
# movies" feed via panel-hub (:8768) and hands grabs to Radarr (→ Prowlarr →
# qBittorrent → Jellyfin import).
#
# Tiles are sized/positioned in PIXELS at runtime from the display resolution
# (yts_layout_tiles) — deliberately NOT LVGL flex+percent, which has a click
# hit-test bug on this hardware. Posters are baseline JPEG from the hub
# (JPEGDEC-safe). Row posters lazy-load one at a time (parallel online_image
# downloads are unreliable on the P4). Page size is 10 (hub `limit` param).

globals:
  - id: g_yts_bridge_ok
    type: bool
    restore_value: false
  - id: g_yts_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_yts_page_active
    type: bool
    restore_value: false
  - id: g_yts_page
    type: int
    restore_value: false
    initial_value: '1'
  - id: g_yts_total
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_yts_sort
    type: int
    restore_value: true
    initial_value: '0'   # 0 = latest added to YTS, 1 = newest release (year)
  - id: g_yts_selected_row
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_yts_movies_json
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_yts_selected_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_yts_selected_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_yts_selected_year
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_yts_selected_status
    type: std::string
    restore_value: no
    initial_value: '""'

# Number of tiles per page = 10 (5x2). Keep PAGE_SIZE in sync with the hub limit.
online_image:
  - id: yts_poster
    url: "${jellyfin_proxy_url}/yts/poster/0"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 200x300
    buffer_size: 65536
    update_interval: never
    request_headers: { Accept: image/jpeg }
    on_download_finished:
      - lambda: |-
          if (id(g_yts_page_active) && id(g_lvgl_ready)) {
            lv_img_set_src(id(yts_poster_widget), id(yts_poster).get_lv_img_dsc());
            lv_obj_invalidate(id(yts_poster_widget));
          }
  - id: yts_tile_img_0
    url: "${jellyfin_proxy_url}/yts/poster/0"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 150x210
    buffer_size: 49152
    update_interval: never
    request_headers: { Accept: image/jpeg }
    on_download_finished:
      - lambda: 'if (id(g_yts_page_active)) { lv_img_set_src(id(yts_tile_pic_0), id(yts_tile_img_0).get_lv_img_dsc()); lv_obj_invalidate(id(yts_tile_pic_0)); }'
