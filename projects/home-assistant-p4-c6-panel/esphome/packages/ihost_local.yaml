# ── 60s health ticker ─────────────────────────────────────────────────────────
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(g_ih_page_active);'
          then:
            - script.execute: ih_refresh_states

# ── LVGL page ─────────────────────────────────────────────────────────────────
lvgl:
  pages:
    - id: ihost_page
      bg_color: 0x071019
      on_load:
        - lambda: |-
            id(g_ih_page_active) = true;
            // Hide cards whose label is empty — compile-time strlen check.
            if (strlen("${ih_dev1_label}") == 0) lv_obj_add_flag(id(ih_card1), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_dev2_label}") == 0) lv_obj_add_flag(id(ih_card2), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_dev3_label}") == 0) lv_obj_add_flag(id(ih_card3), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_dev4_label}") == 0) lv_obj_add_flag(id(ih_card4), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_dev5_label}") == 0) lv_obj_add_flag(id(ih_card5), LV_OBJ_FLAG_HIDDEN);
            if (strlen("${ih_dev6_label}") == 0) lv_obj_add_flag(id(ih_card6), LV_OBJ_FLAG_HIDDEN);
        - script.execute: ih_poll_health
        - script.execute: ih_refresh_states
      on_unload:
        - lambda: |-
            id(g_ih_page_active) = false;
            id(g_ih_busy) = false;
      on_swipe_right:
        - lvgl.page.show: dashboard_page
      on_swipe_left:
        - lvgl.page.show: tado_page
      widgets:

        # ── Top bar ───────────────────────────────────────────────────────────
        - obj:
            id: ih_header_bar
            width: 1024
            height: 58
            align: TOP_LEFT
            bg_color: 0x0B1624
            bg_opa: 98%
            border_width: 0
            border_side: BOTTOM
            border_color: 0x263B55
            pad_all: 0
            widgets:
              - button:
                  align: LEFT_MID
                  x: 14
                  width: 52
                  height: 38
                  bg_color: 0x1A3552
                  radius: 9
                  border_width: 0
                  on_click:
                    - lvgl.page.show: slideshow_page
                  widgets:
                    - image:
                        align: CENTER
                        src: img_home
              - label:
                  align: CENTER
                  x: -50
                  text: "iHost / Sonoff"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
              - label:
                  id: ih_status_lbl
                  align: CENTER
                  x: 100
                  text: "..."
                  text_font: montserrat_14
                  text_color: 0xFFAA00
              - button:
                  align: RIGHT_MID
                  x: -78
                  width: 52
                  height: 38
                  bg_color: 0x1A3552
                  radius: 9
                  border_width: 0
                  on_click:
                    - lvgl.page.show: dashboard_page
                  widgets:
                    - label: { align: CENTER, text: "<", text_font: montserrat_24, text_color: 0xFFFFFF }
              - button:
                  align: RIGHT_MID
                  x: -16
                  width: 52
                  height: 38
                  bg_color: 0x1A3552
                  radius: 9
                  border_width: 0
                  on_click:
                    - lvgl.page.show: tado_page
                  widgets:
                    - label: { align: CENTER, text: ">", text_font: montserrat_24, text_color: 0xFFFFFF }
              - button:
                  align: RIGHT_MID
                  x: -140
                  width: 52
                  height: 38
                  bg_color: 0x0D2540
                  radius: 9
                  border_width: 1
                  border_color: 0x263B55
                  on_click:
                    - script.execute: ih_poll_health
                    - script.execute: ih_refresh_states
                  widgets:
                    - label: { align: CENTER, text: "R", text_font: montserrat_18, text_color: 0xAABBCC }

