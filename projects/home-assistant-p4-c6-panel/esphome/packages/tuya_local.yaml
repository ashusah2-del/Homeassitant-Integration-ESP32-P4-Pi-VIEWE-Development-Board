# ─── Tuya Local page ──────────────────────────────────────────────────────────
# Direct LAN control of Tuya devices via tuya-bridge (port 8766).
# No Home Assistant involvement — the bridge talks Tuya local protocol.
#
# Layout:
#   Row 1 (full width): Bedroom Power Strip | Power Switch  (both 4+1 Zigbee)
#   Row 2: Locks (Mukta + Bedroom Knob) | WiFi Plugs (Drawing Room + Garden)
#   Row 3: Safety Sensors (Smoke/CO/Water) | Alarm
#
# Strip buttons use optimistic toggle (immediate visual + revert on error).
# All other controls update on HTTP 200; show "---" on error.
# Navigation: Cameras → [swipe left] → Tuya → [swipe left] → Slideshow
#
# IMPORTANT: device polls run sequentially (one HTTP call at a time) and the
# UI is refreshed once at the end. Parallel polls + repeated apply_ui used to
# freeze/crash the panel. Full polling is intentionally manual/diagnostic only;
# page load only checks bridge health so controls remain tappable immediately.

globals:
  # ── Bedroom Power Strip (Zigbee sub via gateway at .60) ─────────────────────
  - id: g_strip_s1
    type: bool
    restore_value: false
  - id: g_strip_s2
    type: bool
    restore_value: false
  - id: g_strip_s3
    type: bool
    restore_value: false
  - id: g_strip_s4
    type: bool
    restore_value: false
  - id: g_strip_usb
    type: bool
    restore_value: false
  - id: g_strip_online
    type: bool
    restore_value: false

  # ── Power Switch (Zigbee sub via gateway at .60) ─────────────────────────────
  - id: g_switch_s1
    type: bool
    restore_value: false
  - id: g_switch_s2
    type: bool
    restore_value: false
  - id: g_switch_s3
    type: bool
    restore_value: false
  - id: g_switch_s4
    type: bool
    restore_value: false
  - id: g_switch_usb
    type: bool
    restore_value: false
  - id: g_switch_online
    type: bool
    restore_value: false

  # ── WiFi Plugs ───────────────────────────────────────────────────────────────
  - id: g_tuya_dr_on
    type: bool
    restore_value: false
  - id: g_tuya_dr_online
    type: bool
    restore_value: false
  - id: g_tuya_garden_on
    type: bool
    restore_value: false
  - id: g_tuya_garden_online
    type: bool
    restore_value: false

  # ── Mukta Lock (BLE via BT gateway at .66) ───────────────────────────────────
  - id: g_mukta_locked
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: g_mukta_online
    type: bool
    restore_value: false

  # ── Bedroom Knob (BLE via BT gateway at .66, simple on/off) ──────────────────
  - id: g_bedroom_on
    type: bool
    restore_value: false
  - id: g_bedroom_online
    type: bool
    restore_value: false

  # ── Safety sensors: -1 = no data yet, 0 = clear, 1 = alarm ──────────────────
  - id: g_smoke_state
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_co_state
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_water_state
    type: int
    restore_value: false
    initial_value: '-1'

  # ── Multifunction alarm: -1 = no data, 0 = ok, 1 = alarm ────────────────────
  - id: g_alarm_state
    type: int
    restore_value: false
    initial_value: '-1'

  # ── Page gate ────────────────────────────────────────────────────────────────
  - id: g_tuya_page_active
    type: bool
    restore_value: false

  # Blocks overlapping HTTP + LVGL refresh (prevents page freeze/crash).
  - id: g_tuya_busy
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: tuya_apply_ui
    mode: single
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          if (id(g_tuya_busy) || !id(g_tuya_bridge_ok)) {
            lv_label_set_text(id(tuya_loading_title), id(g_tuya_busy) ? "Controls are not ready" : "Tuya bridge offline");
            lv_label_set_text(id(tuya_loading_hint), id(g_tuya_busy) ? "Waiting for Tuya request to finish..." : "Check tuya-bridge on port 8766");
            lv_obj_clear_flag(id(tuya_loading_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(tuya_loading_overlay));
          } else {
            lv_obj_add_flag(id(tuya_loading_overlay), LV_OBJ_FLAG_HIDDEN);
          }
          // Bedroom power strip
          lv_obj_set_style_bg_color(id(strip_s1_btn), lv_color_hex(!id(g_strip_online) ? 0x181818U : (id(g_strip_s1) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(strip_s1_lbl), id(g_strip_online) ? (id(g_strip_s1) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(strip_s1_lbl), lv_color_hex(!id(g_strip_online) ? 0x333333U : (id(g_strip_s1) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(strip_s2_btn), lv_color_hex(!id(g_strip_online) ? 0x181818U : (id(g_strip_s2) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(strip_s2_lbl), id(g_strip_online) ? (id(g_strip_s2) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(strip_s2_lbl), lv_color_hex(!id(g_strip_online) ? 0x333333U : (id(g_strip_s2) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(strip_s3_btn), lv_color_hex(!id(g_strip_online) ? 0x181818U : (id(g_strip_s3) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(strip_s3_lbl), id(g_strip_online) ? (id(g_strip_s3) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(strip_s3_lbl), lv_color_hex(!id(g_strip_online) ? 0x333333U : (id(g_strip_s3) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(strip_s4_btn), lv_color_hex(!id(g_strip_online) ? 0x181818U : (id(g_strip_s4) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(strip_s4_lbl), id(g_strip_online) ? (id(g_strip_s4) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(strip_s4_lbl), lv_color_hex(!id(g_strip_online) ? 0x333333U : (id(g_strip_s4) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(strip_usb_btn), lv_color_hex(!id(g_strip_online) ? 0x181818U : (id(g_strip_usb) ? 0x1A3A7EU : 0x212121U)), 0);
          lv_label_set_text(id(strip_usb_lbl), id(g_strip_online) ? (id(g_strip_usb) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(strip_usb_lbl), lv_color_hex(!id(g_strip_online) ? 0x333333U : (id(g_strip_usb) ? 0xAABBFFU : 0x666666U)), 0);
          lv_label_set_text(id(strip_status_lbl), id(g_strip_online) ? "ONLINE" : "OFFLINE");
          lv_obj_set_style_text_color(id(strip_status_lbl), lv_color_hex(id(g_strip_online) ? 0x69F0AEU : 0xFF8F00U), 0);
          // Power switch strip
          lv_obj_set_style_bg_color(id(switch_s1_btn), lv_color_hex(!id(g_switch_online) ? 0x181818U : (id(g_switch_s1) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(switch_s1_lbl), id(g_switch_online) ? (id(g_switch_s1) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(switch_s1_lbl), lv_color_hex(!id(g_switch_online) ? 0x333333U : (id(g_switch_s1) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(switch_s2_btn), lv_color_hex(!id(g_switch_online) ? 0x181818U : (id(g_switch_s2) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(switch_s2_lbl), id(g_switch_online) ? (id(g_switch_s2) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(switch_s2_lbl), lv_color_hex(!id(g_switch_online) ? 0x333333U : (id(g_switch_s2) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(switch_s3_btn), lv_color_hex(!id(g_switch_online) ? 0x181818U : (id(g_switch_s3) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(switch_s3_lbl), id(g_switch_online) ? (id(g_switch_s3) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(switch_s3_lbl), lv_color_hex(!id(g_switch_online) ? 0x333333U : (id(g_switch_s3) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(switch_s4_btn), lv_color_hex(!id(g_switch_online) ? 0x181818U : (id(g_switch_s4) ? 0x1B5E20U : 0x212121U)), 0);
          lv_label_set_text(id(switch_s4_lbl), id(g_switch_online) ? (id(g_switch_s4) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(switch_s4_lbl), lv_color_hex(!id(g_switch_online) ? 0x333333U : (id(g_switch_s4) ? 0x69F0AEU : 0x666666U)), 0);
          lv_obj_set_style_bg_color(id(switch_usb_btn), lv_color_hex(!id(g_switch_online) ? 0x181818U : (id(g_switch_usb) ? 0x1A3A7EU : 0x212121U)), 0);
          lv_label_set_text(id(switch_usb_lbl), id(g_switch_online) ? (id(g_switch_usb) ? "ON" : "OFF") : "--");
          lv_obj_set_style_text_color(id(switch_usb_lbl), lv_color_hex(!id(g_switch_online) ? 0x333333U : (id(g_switch_usb) ? 0xAABBFFU : 0x666666U)), 0);
          lv_label_set_text(id(switch_status_lbl), id(g_switch_online) ? "ONLINE" : "OFFLINE");
          lv_obj_set_style_text_color(id(switch_status_lbl), lv_color_hex(id(g_switch_online) ? 0x69F0AEU : 0xFF8F00U), 0);
          // Locks + plugs
          lv_label_set_text(id(mukta_lock_lbl), id(g_mukta_online) ? (id(g_mukta_locked) ? "LOCKED" : "UNLOCKED") : "---");
          lv_obj_set_style_text_color(id(mukta_lock_lbl), lv_color_hex(id(g_mukta_online) ? (id(g_mukta_locked) ? 0xFF5252U : 0x69F0AEU) : 0xFF8F00U), 0);
          lv_label_set_text(id(bedroom_lbl), id(g_bedroom_online) ? (id(g_bedroom_on) ? "UNLOCKED" : "LOCKED") : "---");
          lv_obj_set_style_text_color(id(bedroom_lbl), lv_color_hex(id(g_bedroom_online) ? (id(g_bedroom_on) ? 0x69F0AEU : 0xFF5252U) : 0xFF8F00U), 0);
          lv_label_set_text(id(tuya_dr_lbl), id(g_tuya_dr_online) ? (id(g_tuya_dr_on) ? "ON" : "OFF") : "---");
          lv_obj_set_style_text_color(id(tuya_dr_lbl), lv_color_hex(id(g_tuya_dr_online) ? (id(g_tuya_dr_on) ? 0x69F0AEU : 0x666666U) : 0xFF8F00U), 0);
          lv_label_set_text(id(tuya_garden_lbl), id(g_tuya_garden_online) ? (id(g_tuya_garden_on) ? "ON" : "OFF") : "---");
          lv_obj_set_style_text_color(id(tuya_garden_lbl), lv_color_hex(id(g_tuya_garden_online) ? (id(g_tuya_garden_on) ? 0x69F0AEU : 0x666666U) : 0xFF8F00U), 0);
          // Safety sensors
          lv_label_set_text(id(smoke_state_lbl), id(g_smoke_state) < 0 ? "?" : (id(g_smoke_state) ? "! SMOKE !" : "CLEAR"));
          lv_obj_set_style_text_color(id(smoke_state_lbl), lv_color_hex(id(g_smoke_state) < 0 ? 0xFF8F00U : (id(g_smoke_state) ? 0xFF5252U : 0x69F0AEU)), 0);
          lv_label_set_text(id(co_state_lbl), id(g_co_state) < 0 ? "?" : (id(g_co_state) ? "! CO !" : "CLEAR"));
          lv_obj_set_style_text_color(id(co_state_lbl), lv_color_hex(id(g_co_state) < 0 ? 0xFF8F00U : (id(g_co_state) ? 0xFF5252U : 0x69F0AEU)), 0);
          lv_label_set_text(id(water_state_lbl), id(g_water_state) < 0 ? "?" : (id(g_water_state) ? "! WATER !" : "CLEAR"));
          lv_obj_set_style_text_color(id(water_state_lbl), lv_color_hex(id(g_water_state) < 0 ? 0xFF8F00U : (id(g_water_state) ? 0xFF5252U : 0x69F0AEU)), 0);
          lv_label_set_text(id(alarm_state_lbl), id(g_alarm_state) < 0 ? "?" : (id(g_alarm_state) ? "! ALARM !" : "OK"));
          lv_obj_set_style_text_color(id(alarm_state_lbl), lv_color_hex(id(g_alarm_state) < 0 ? 0xFF8F00U : (id(g_alarm_state) ? 0xFF5252U : 0x69F0AEU)), 0);

  - id: tuya_refresh_all
    mode: restart
    then:
      - lambda: 'id(g_tuya_busy) = true;'
      - http_request.get:

          url: "${tuya_bridge_url}/strip/bfaf38ec9b4b8efbd3dedy"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_strip_s1)  = (bool)root["s1"];
                      id(g_strip_s2)  = (bool)root["s2"];
                      id(g_strip_s3)  = (bool)root["s3"];
                      id(g_strip_s4)  = (bool)root["s4"];
                      id(g_strip_usb) = (bool)root["usb"];
                      id(g_strip_online) = true;
                      return true;
                    });
                  } else { id(g_strip_online) = false; }
          on_error:
            then:
              - lambda: |-
                  id(g_strip_online) = false;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/strip/bf03612cd9b0910bdclaob"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_switch_s1)  = (bool)root["s1"];
                      id(g_switch_s2)  = (bool)root["s2"];
                      id(g_switch_s3)  = (bool)root["s3"];
                      id(g_switch_s4)  = (bool)root["s4"];
                      id(g_switch_usb) = (bool)root["usb"];
                      id(g_switch_online) = true;
                      return true;
                    });
                  } else { id(g_switch_online) = false; }
          on_error:
            then:
              - lambda: |-
                  id(g_switch_online) = false;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/simple/1571285310521cd5c87c"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_tuya_dr_on) = (bool)root["on"];
                      id(g_tuya_dr_online) = true;
                      return true;
                    });
                  } else { id(g_tuya_dr_online) = false; }
          on_error:
            then:
              - lambda: |-
                  id(g_tuya_dr_online) = false;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/simple/1571285350029127c9f3"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_tuya_garden_on) = (bool)root["on"];
                      id(g_tuya_garden_online) = true;
                      return true;
                    });
                  } else { id(g_tuya_garden_online) = false; }
          on_error:
            then:
              - lambda: |-
                  id(g_tuya_garden_online) = false;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/lock/bf86f41ytmtjjm5t"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_mukta_locked) = (bool)root["locked"];
                      id(g_mukta_online) = true;
                      return true;
                    });
                  } else { id(g_mukta_online) = false; }
          on_error:
            then:
              - lambda: |-
                  id(g_mukta_online) = false;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/simple/bfaf99ydtny1wmyh"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_bedroom_on) = (bool)root["on"];
                      id(g_bedroom_online) = true;
                      return true;
                    });
                  } else { id(g_bedroom_online) = false; }
          on_error:
            then:
              - lambda: |-
                  id(g_bedroom_online) = false;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/alarm/bf504b80ba9e1483b07vzc"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_alarm_state) = root["alarm"].as<bool>() ? 1 : 0;
                      return true;
                    });
                  } else { id(g_alarm_state) = -1; }
          on_error:
            then:
              - lambda: |-
                  id(g_alarm_state) = -1;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/sensor/bfd389d3ddd79b5678utvs"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_smoke_state) = root["state"].as<bool>() ? 1 : 0;
                      return true;
                    });
                  } else { id(g_smoke_state) = -1; }
          on_error:
            then:
              - lambda: |-
                  id(g_smoke_state) = -1;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/sensor/bff359c0e1a9090ad4ehuk"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_co_state) = root["state"].as<bool>() ? 1 : 0;
                      return true;
                    });
                  } else { id(g_co_state) = -1; }
          on_error:
            then:
              - lambda: |-
                  id(g_co_state) = -1;
      - delay: 150ms
      - http_request.get:

          url: "${tuya_bridge_url}/sensor/bf8c8b69c7a5212d95lgfa"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(g_water_state) = root["state"].as<bool>() ? 1 : 0;
                      return true;
                    });
                  } else { id(g_water_state) = -1; }
          on_error:
            then:
              - lambda: |-
                  id(g_water_state) = -1;
      - delay: 150ms
      - script.execute: tuya_apply_ui
      - lambda: 'id(g_tuya_busy) = false;'

  - id: tuya_refresh_sensors
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(g_tuya_busy);'
          then:
            - lambda: 'id(g_tuya_busy) = true;'
            - http_request.get:
                url: "${tuya_bridge_url}/alarm/bf504b80ba9e1483b07vzc"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            id(g_alarm_state) = root["alarm"].as<bool>() ? 1 : 0;
                            return true;
                          });
                        } else { id(g_alarm_state) = -1; }
                on_error:
                  then:
                    - lambda: 'id(g_alarm_state) = -1;'
            - delay: 150ms
            - http_request.get:
                url: "${tuya_bridge_url}/sensor/bfd389d3ddd79b5678utvs"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            id(g_smoke_state) = root["state"].as<bool>() ? 1 : 0;
                            return true;
                          });
                        } else { id(g_smoke_state) = -1; }
                on_error:
                  then:
                    - lambda: 'id(g_smoke_state) = -1;'
            - delay: 150ms
            - http_request.get:
                url: "${tuya_bridge_url}/sensor/bff359c0e1a9090ad4ehuk"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            id(g_co_state) = root["state"].as<bool>() ? 1 : 0;
                            return true;
                          });
                        } else { id(g_co_state) = -1; }
                on_error:
                  then:
                    - lambda: 'id(g_co_state) = -1;'
            - delay: 150ms
            - http_request.get:
                url: "${tuya_bridge_url}/sensor/bf8c8b69c7a5212d95lgfa"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            id(g_water_state) = root["state"].as<bool>() ? 1 : 0;
                            return true;
                          });
                        } else { id(g_water_state) = -1; }
                on_error:
                  then:
                    - lambda: 'id(g_water_state) = -1;'
            - script.execute: tuya_apply_ui
            - lambda: 'id(g_tuya_busy) = false;'

  - id: tuya_poll_health
    mode: single
    then:
      - http_request.get:

          url: "${tuya_bridge_url}/health"
          capture_response: true
          on_response:
            then:
              - lambda: 'id(g_tuya_bridge_ok) = (response->status_code == 200);'
          on_error:
