            if (obj == nullptr) return;
            if (lv_obj_check_type(obj, &lv_img_class)) {
              const void *src = lv_img_get_src(obj);
              if (src == home_dsc || src == settings_dsc) {
                lv_obj_set_style_img_recolor(obj, lv_color_hex(t.accent), 0);
                lv_obj_set_style_img_recolor_opa(obj, LV_OPA_COVER, 0);
              }
            }
            uint32_t cc = lv_obj_get_child_cnt(obj);
            for (uint32_t i = 0; i < cc; i++) {
              style_nav_icons(lv_obj_get_child(obj, i));
