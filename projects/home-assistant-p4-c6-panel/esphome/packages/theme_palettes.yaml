# ═══════════════════════════════════════════════════════════════════════════
# PANEL THEME SYSTEM — end goal (keep this block updated as phases land)
# ═══════════════════════════════════════════════════════════════════════════
# GOAL: Five switchable palettes that unify the ENTIRE panel at runtime:
#   Midnight | Graphite | Warm Home | Nord | High Contrast
# Every surface pulls from semantic tokens (not scattered hex literals):
#   page/header/footer/card/overlay/nav/text/accent/success/warning/error/voice
# Switch from Settings or HA input_select.panel_theme (bidirectional sync).
#
# PHASES (status):
#   [x] 1 — Theme engine + 2 palettes; headers + Settings chrome
#   [x] 2 — All 5 palettes; slideshow overlays + dashboard/Tado cards + layout bar
#   [x] 3 — Presence, Energy, Camera, Tuya pages; HA disconnect/crash overlays
#   [x] 4 — Voice/wake pill + mic overlay state colours tied to theme
#   [x] 5 — Replace remaining inline hex in lambdas; HA helper sync; README
# ═══════════════════════════════════════════════════════════════════════════

globals:
  - id: g_panel_theme
    type: int
    restore_value: yes
    initial_value: '0'
  # Cached token values for lambdas elsewhere (set on every apply_panel_theme).
  - id: g_theme_accent
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_overlay_bg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_ready_border
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_accent_bg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_listen_bg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_listen_fg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_think_bg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_think_fg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_speak_bg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_speak_fg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_speak_text
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_offline_bg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_offline_fg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_va_offline_text
    type: int
    restore_value: no
    initial_value: '0'
  # Voice UI state for theme re-apply: 0 ready 1 offline 2 listening 3 thinking
  # 4 speaking 5 error 6 heard (pill flash before Assist starts)
  - id: g_va_ui_state
    type: int
    restore_value: no
    initial_value: '1'
  - id: g_theme_text_muted
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_text_secondary
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_card_bg
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_error
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_success
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_warning
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_info
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_lamp_on
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_lamp_off
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_theme_push_to_ha
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: apply_panel_theme
    mode: restart
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;

          static const int PANEL_THEME_COUNT = 6;

          struct PanelTheme {
            const char *name;
            uint32_t page_bg;
            uint32_t page_scrim;
            uint32_t header_bg;
            uint32_t header_border;
            uint32_t nav_btn_bg;
            uint32_t text_primary;
            uint32_t text_secondary;
            uint32_t text_muted;
            uint32_t accent;
            uint32_t accent_bg;
            uint32_t accent_border;
            uint32_t card_bg;
            uint32_t card_border;
            uint32_t footer_bg;
            uint32_t footer_border;
            uint32_t footer_text;
            uint32_t divider;
            uint32_t overlay_bg;
            uint32_t clock_pill_bg;
            uint32_t layout_bar_bg;
            uint32_t va_ready_border;
            uint32_t crash_bg;
            uint32_t crash_title;
            uint32_t crash_body;
            uint32_t crash_hint;
            uint32_t disconnect_bg;
            uint32_t disconnect_title;
            uint32_t disconnect_accent;
            uint32_t disconnect_muted;
            uint32_t error_bar_bg;
            uint32_t error_bar_text;
            uint32_t va_listen_bg;
            uint32_t va_listen_fg;
            uint32_t va_think_bg;
            uint32_t va_think_fg;
            uint32_t va_speak_bg;
            uint32_t va_speak_fg;
            uint32_t va_speak_text;
            uint32_t va_offline_bg;
            uint32_t va_offline_fg;
            uint32_t va_offline_text;
            uint32_t success;
            uint32_t warning;
            uint32_t info;
            uint32_t lamp_on;
            uint32_t lamp_off;
          };

          static const PanelTheme THEMES[] = {
            // 0 Midnight — current production look
            {"Midnight", 0x071019, 0x050A12, 0x0B1624, 0x263B55, 0x1A3552,
             0xFFFFFF, 0xEEEEEE, 0xAAAAAA, 0x69F0AE, 0x113225, 0x69F0AE,
             0x0D1624, 0x243B55, 0x08111D, 0x263B55, 0x9FB3C8, 0x1A3552,
             0x050510, 0x000000, 0x071118, 0x1B5E20,
             0x300505, 0xFF8888, 0xDDDDDD, 0xFFAAAA,
             0x0A0005, 0xFFFFFF, 0xFF5252, 0x777777,
             0x7B0000, 0xFFCDD2,
             0x003300, 0x00EE00,
             0x332200, 0xFFAA00,
             0x000D33, 0x4488FF, 0xAACCFF,
             0x220808, 0xFF5252, 0xFFCDD2,
             0x10D080, 0xFF8F00, 0xAACCFF, 0xFFD700, 0x666666},
            // 1 Graphite — neutral Material dark
            {"Graphite", 0x121212, 0x1A1A1A, 0x1E1E1E, 0x3A3A3A, 0x2A2A2A,
             0xF5F5F5, 0xE0E0E0, 0xB0B0B0, 0x90CAF9, 0x1A2332, 0x90CAF9,
             0x2A2A2A, 0x404040, 0x1E1E1E, 0x3A3A3A, 0xB0B0B0, 0x333333,
             0x1A1A1A, 0x0D0D0D, 0x1E1E1E, 0x1565C0,
             0x3A2020, 0xEF9A9A, 0xE0E0E0, 0xFFAB91,
             0x121212, 0xF5F5F5, 0xEF5350, 0x9E9E9E,
             0x5C1A1A, 0xFFCDD2,
             0x1B3320, 0x66BB6A,
             0x332A10, 0xFFCA28,
             0x0D1A33, 0x90CAF9, 0xBBDEFB,
             0x2A1515, 0xEF5350, 0xFFCDD2,
             0x66BB6A, 0xFFCA28, 0x90CAF9, 0xFFD54F, 0x9E9E9E},
            // 2 Warm Home — amber accent, cozy tones
            {"Warm Home", 0x1A1410, 0x241C16, 0x2C2218, 0x5C4A3A, 0x3E2723,
             0xFFF8E1, 0xD7CCC8, 0xA1887F, 0xFFB74D, 0x3E2723, 0xFFB74D,
             0x3E2723, 0x6D4C41, 0x2C2218, 0x5C4A3A, 0xD7CCC8, 0x4E342E,
             0x2C2218, 0x1A1410, 0x2C2218, 0xE65100,
             0x3A1810, 0xFFAB91, 0xD7CCC8, 0xFFCC80,
             0x1A1410, 0xFFF8E1, 0xFF7043, 0xA1887F,
             0x4E1A10, 0xFFCCBC,
             0x1B3A1A, 0x81C784,
             0x3E2723, 0xFFB74D,
             0x1A2332, 0x64B5F6, 0x90CAF9,
             0x3A1810, 0xFF7043, 0xFFCCBC,
             0x81C784, 0xFFB74D, 0x64B5F6, 0xFFB74D, 0xA1887F},
            // 3 Nord — frost palette
            {"Nord", 0x2E3440, 0x3B4252, 0x3B4252, 0x4C566A, 0x434C5E,
             0xECEFF4, 0xD8DEE9, 0x81A1C1, 0x88C0D0, 0x2E4A52, 0x88C0D0,
             0x3B4252, 0x4C566A, 0x3B4252, 0x4C566A, 0xD8DEE9, 0x434C5E,
             0x3B4252, 0x2E3440, 0x3B4252, 0x5E81AC,
             0x4C2F34, 0xBF616A, 0xD8DEE9, 0xEBCB8B,
             0x2E3440, 0xECEFF4, 0xBF616A, 0x81A1C1,
             0x5C2328, 0xECEFF4,
             0x2E4A3E, 0xA3BE8C,
             0x4C3A2E, 0xEBCB8B,
             0x2E3A52, 0x81A1C1, 0xD8DEE9,
             0x4C2F34, 0xBF616A, 0xECEFF4,
             0xA3BE8C, 0xEBCB8B, 0x88C0D0, 0xEBCB8B, 0x81A1C1},
            // 4 High Contrast — accessibility
            {"High Contrast", 0x000000, 0x111111, 0x000000, 0xFFFFFF, 0x111111,
             0xFFFFFF, 0xFFFFFF, 0xCCCCCC, 0xFFFF00, 0x111111, 0xFFFFFF,
             0x111111, 0xFFFFFF, 0x000000, 0xFFFFFF, 0xFFFFFF, 0x333333,
             0x111111, 0x000000, 0x111111, 0xFFFF00,
             0x330000, 0xFFFF00, 0xFFFFFF, 0xFFFF00,
             0x000000, 0xFFFFFF, 0xFFFF00, 0xCCCCCC,
             0x660000, 0xFFFFFF,
             0x003300, 0x00FF00,
             0x333300, 0xFFFF00,
             0x000033, 0x00FFFF, 0xFFFFFF,
             0x330000, 0xFF0000, 0xFFFFFF,
             0x00FF00, 0xFFFF00, 0x00FFFF, 0xFFFF00, 0xCCCCCC},
            // 5 Home Assistant — matches HA's own default dark frontend theme
            // (near-black surfaces, signature #03A9F4 blue, Material state
            // colors for success/warning/error).
            {"Home Assistant", 0x111111, 0x0A0A0A, 0x1C1C1C, 0x333333, 0x2C2C2C,
             0xE1E1E1, 0xC8C8C8, 0x9B9B9B, 0x03A9F4, 0x0D3A52, 0x03A9F4,
             0x1C1C1C, 0x333333, 0x1C1C1C, 0x333333, 0xA1A1A1, 0x333333,
             0x1C1C1C, 0x000000, 0x1C1C1C, 0x03A9F4,
             0x2C0000, 0xFF8A80, 0xE1E1E1, 0xFFAB91,
             0x111111, 0xFFFFFF, 0xF44336, 0x9E9E9E,
             0xB71C1C, 0xFFFFFF,
             0x0D3A20, 0x4CAF50,
             0x332B00, 0xFF9800,
             0x0D2A3D, 0x03A9F4, 0xB3E5FC,
             0x2C0F0F, 0xF44336, 0xFFCDD2,
             0x4CAF50, 0xFF9800, 0x03A9F4, 0xFFD54F, 0x757575},
          };

          int ti = id(g_panel_theme);
          if (ti < 0) ti = 0;
          if (ti >= PANEL_THEME_COUNT) ti = 0;
          id(g_panel_theme) = ti;
          const PanelTheme &t = THEMES[ti];

          id(g_theme_accent) = (int) t.accent;
          id(g_theme_overlay_bg) = (int) t.overlay_bg;
          id(g_theme_va_ready_border) = (int) t.va_ready_border;
          id(g_theme_accent_bg) = (int) t.accent_bg;
          id(g_theme_va_listen_bg) = (int) t.va_listen_bg;
          id(g_theme_va_listen_fg) = (int) t.va_listen_fg;
          id(g_theme_va_think_bg) = (int) t.va_think_bg;
          id(g_theme_va_think_fg) = (int) t.va_think_fg;
          id(g_theme_va_speak_bg) = (int) t.va_speak_bg;
          id(g_theme_va_speak_fg) = (int) t.va_speak_fg;
          id(g_theme_va_speak_text) = (int) t.va_speak_text;
          id(g_theme_va_offline_bg) = (int) t.va_offline_bg;
          id(g_theme_va_offline_fg) = (int) t.va_offline_fg;
          id(g_theme_va_offline_text) = (int) t.va_offline_text;
          id(g_theme_text_muted) = (int) t.text_muted;
          id(g_theme_text_secondary) = (int) t.text_secondary;
          id(g_theme_card_bg) = (int) t.card_bg;
          id(g_theme_error) = (int) t.disconnect_accent;
          id(g_theme_success) = (int) t.success;
          id(g_theme_warning) = (int) t.warning;
          id(g_theme_info) = (int) t.info;
          id(g_theme_lamp_on) = (int) t.lamp_on;
          id(g_theme_lamp_off) = (int) t.lamp_off;

          auto style_header = [&](lv_obj_t *bar) {
            if (bar == nullptr) return;
            lv_obj_set_style_bg_color(bar, lv_color_hex(t.header_bg), 0);
            lv_obj_set_style_border_color(bar, lv_color_hex(t.header_border), 0);
            uint32_t n = lv_obj_get_child_cnt(bar);
            for (uint32_t i = 0; i < n; i++) {
              lv_obj_t *ch = lv_obj_get_child(bar, i);
              if (lv_obj_check_type(ch, &lv_btn_class)) {
                lv_obj_set_style_bg_color(ch, lv_color_hex(t.nav_btn_bg), 0);
                uint32_t bn = lv_obj_get_child_cnt(ch);
                for (uint32_t j = 0; j < bn; j++) {
                  lv_obj_t *bch = lv_obj_get_child(ch, j);
                  if (lv_obj_check_type(bch, &lv_label_class)) {
                    lv_obj_set_style_text_color(bch, lv_color_hex(t.text_primary), 0);
                  }
                }
              } else if (lv_obj_check_type(ch, &lv_label_class)) {
                lv_obj_set_style_text_color(ch, lv_color_hex(t.text_primary), 0);
              }
            }
          };

          auto style_card = [&](lv_obj_t *card) {
            if (card == nullptr) return;
            lv_obj_set_style_bg_color(card, lv_color_hex(t.card_bg), 0);
            lv_obj_set_style_border_color(card, lv_color_hex(t.card_border), 0);
            uint32_t n = lv_obj_get_child_cnt(card);
            for (uint32_t i = 0; i < n; i++) {
              lv_obj_t *ch = lv_obj_get_child(card, i);
              if (lv_obj_check_type(ch, &lv_btn_class)) {
                lv_obj_set_style_bg_color(ch, lv_color_hex(t.nav_btn_bg), 0);
                uint32_t bn = lv_obj_get_child_cnt(ch);
                for (uint32_t j = 0; j < bn; j++) {
                  lv_obj_t *bch = lv_obj_get_child(ch, j);
                  if (lv_obj_check_type(bch, &lv_label_class)) {
                    lv_obj_set_style_text_color(bch, lv_color_hex(t.text_primary), 0);
                  }
                }
              } else if (lv_obj_check_type(ch, &lv_label_class)) {
                lv_obj_set_style_text_color(ch, lv_color_hex(t.text_primary), 0);
              } else if (lv_obj_check_type(ch, &lv_obj_class) && lv_obj_get_height(ch) <= 3) {
                lv_obj_set_style_bg_color(ch, lv_color_hex(t.divider), 0);
              }
            }
          };

          auto style_page_footer = [&](lv_obj_t *footer) {
            if (footer == nullptr) return;
            lv_obj_set_style_bg_color(footer, lv_color_hex(t.footer_bg), 0);
            lv_obj_set_style_border_color(footer, lv_color_hex(t.footer_border), 0);
            uint32_t n = lv_obj_get_child_cnt(footer);
            for (uint32_t i = 0; i < n; i++) {
              lv_obj_t *ch = lv_obj_get_child(footer, i);
              if (lv_obj_check_type(ch, &lv_label_class)) {
                lv_obj_set_style_text_color(ch, lv_color_hex(t.footer_text), 0);
              } else if (lv_obj_check_type(ch, &lv_btn_class)) {
                lv_obj_set_style_bg_color(ch, lv_color_hex(t.nav_btn_bg), 0);
              }
            }
          };

          auto style_tuya_panel = [&](lv_obj_t *panel) {
            style_card(panel);
            if (panel == nullptr) return;
            lv_obj_set_style_border_color(panel, lv_color_hex(t.accent_border), 0);
          };

          auto style_tuya_socket = [&](lv_obj_t *btn) {
            if (btn == nullptr) return;
            lv_obj_set_style_bg_color(btn, lv_color_hex(t.card_bg), 0);
            lv_obj_set_style_border_color(btn, lv_color_hex(t.accent_border), 0);
            uint32_t n = lv_obj_get_child_cnt(btn);
            for (uint32_t i = 0; i < n; i++) {
              lv_obj_t *ch = lv_obj_get_child(btn, i);
              if (lv_obj_check_type(ch, &lv_label_class)) {
                lv_obj_set_style_text_color(ch, lv_color_hex(t.text_secondary), 0);
              }
            }
          };

          // ── Phase 1: global chrome ───────────────────────────────────────
          style_header(id(dash_header_bar));
          style_header(id(tado_header_bar));
          style_header(id(pres_header_bar));
          style_header(id(energy_header_bar));
          style_header(id(cam_header_bar));
          style_header(id(cam_view_header_bar));
          style_header(id(settings_header_bar));
          style_header(id(layout_hdr_bar));
          style_header(id(tuya_header_bar));
          style_header(id(jf_header_bar));
          style_header(id(diag_hdr_bar));
          style_header(id(ih_header_bar));

          lv_obj_set_style_bg_color(id(slideshow_page).obj, lv_color_hex(0x000000), 0);
          lv_obj_set_style_bg_color(id(settings_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(dashboard_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(tado_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(presence_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(energy_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(camera_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(camera_view_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(layout_settings_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(tuya_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(jellyfin_page).obj, lv_color_hex(t.page_bg), 0);
          lv_obj_set_style_bg_color(id(diagnostics_page).obj, lv_color_hex(t.page_bg), 0);
          style_card(id(jf_list_panel));
          style_card(id(jf_detail_panel));
          lv_obj_set_style_bg_color(id(jf_play_btn), lv_color_hex(t.success), 0);
          lv_obj_set_style_bg_color(id(jf_cast_prev_btn), lv_color_hex(t.nav_btn_bg), 0);
          lv_obj_set_style_bg_color(id(jf_cast_next_btn), lv_color_hex(t.nav_btn_bg), 0);
          lv_obj_set_style_text_color(id(jf_cast_lbl), lv_color_hex(t.text_secondary), 0);
          lv_obj_set_style_bg_color(id(jf_refresh_btn), lv_color_hex(t.nav_btn_bg), 0);
          lv_obj_set_style_bg_color(id(jf_prev_btn), lv_color_hex(t.nav_btn_bg), 0);
          lv_obj_set_style_bg_color(id(jf_next_btn), lv_color_hex(t.nav_btn_bg), 0);
          lv_obj_set_style_text_color(id(jf_page_lbl), lv_color_hex(t.text_muted), 0);
          lv_obj_set_style_text_color(id(jf_detail_title), lv_color_hex(t.text_primary), 0);
          lv_obj_set_style_bg_color(id(dash_page_scrim), lv_color_hex(t.page_scrim), 0);

          style_card(id(settings_left_panel));
          style_card(id(settings_right_panel));

          // Diagnostics page — cards, footer, then re-accent the section
          // headings style_card just flattened to text_primary.
          style_card(id(diag_left_panel));
          style_card(id(diag_right_panel));
          style_page_footer(id(diag_footer));
          lv_obj_set_style_text_color(id(diag_sec_conn_lbl), lv_color_hex(t.accent), 0);
          lv_obj_set_style_text_color(id(diag_sec_sys_lbl), lv_color_hex(t.accent), 0);
          lv_obj_set_style_text_color(id(diag_sec_int_lbl), lv_color_hex(t.accent), 0);
          style_card(id(settings_diagnostics_banner));

          lv_obj_set_style_bg_color(id(settings_footer), lv_color_hex(t.footer_bg), 0);
          lv_obj_set_style_border_color(id(settings_footer), lv_color_hex(t.footer_border), 0);
          uint32_t fn = lv_obj_get_child_cnt(id(settings_footer));
          for (uint32_t i = 0; i < fn; i++) {
            lv_obj_t *ch = lv_obj_get_child(id(settings_footer), i);
            if (lv_obj_check_type(ch, &lv_label_class)) {
              lv_obj_set_style_text_color(ch, lv_color_hex(t.footer_text), 0);
            } else if (lv_obj_check_type(ch, &lv_btn_class)) {
              lv_obj_set_style_bg_color(ch, lv_color_hex(t.nav_btn_bg), 0);
            }
          }

          lv_obj_set_style_bg_color(id(settings_layout_banner), lv_color_hex(t.accent_bg), 0);
          lv_obj_set_style_border_color(id(settings_layout_banner), lv_color_hex(t.accent_border), 0);
          lv_obj_set_style_text_color(id(settings_layout_banner_title), lv_color_hex(t.accent), 0);

          lv_obj_set_style_text_color(id(settings_sec_status_lbl), lv_color_hex(t.accent), 0);
          lv_obj_set_style_text_color(id(settings_sec_config_lbl), lv_color_hex(t.accent), 0);
