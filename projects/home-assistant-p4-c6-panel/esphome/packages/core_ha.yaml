logger:
  level: DEBUG
  logs:
    micro_wake_word: DEBUG
    voice_assistant: DEBUG
    i2s_audio.microphone: DEBUG

json:

# Runtime health metrics — free heap/PSRAM and loop time let the settings
# diagnostics panel show memory pressure before it becomes a crash.
debug:
  update_interval: 30s

http_request:
  # Tuya + Jellyfin pages use http_request; keep timeout short so a dead
  # bridge/proxy fails fast instead of freezing the LVGL loop for 15s per call.
  timeout: 5s
  follow_redirects: true
  verify_ssl: false
  useragent: GuitionP4Panel/1.0

i2c:
  sda: GPIO7
  scl: GPIO8
  scan: true
  frequency: 400kHz
  id: bus_a

api:
  encryption:
    key: !secret api_encryption_key
  # Default reboots the panel after 15 min with no API client. The panel
  # is fully usable standalone (Tuya/Jellyfin/iHost/slideshow), so a long
  # HA outage must not power-cycle it.
  reboot_timeout: 0s
  # ESPHome dashboard log-subscriber threads accumulate as zombie connections
  # (they stay alive in the container even after browser tabs close). With 12
  # slots they can easily fill up and lock HA out. 6 is enough for HA + a few
  # simultaneous debug sessions; restart esphome container to clear zombies.
  max_connections: 6
  # Only run setup/teardown on first-connect / last-disconnect.
  # Multiple clients connect (HA, log streams, etc.) — only run setup on the
  # first active client so debug log sessions do not restart voice handling.
  on_client_connected:
    - globals.set:
        id: g_ha_client_count
        value: !lambda 'return id(g_ha_client_count) + 1;'
    - if:
        condition:
          lambda: 'return id(g_ha_client_count) == 1;'
        then:
          - globals.set:
              id: g_ha_connected
              value: 'true'
          - script.execute: update_status_pill
          - lvgl.widget.hide: ha_disconnected_overlay
          - script.execute: refresh_immich_slideshow
          - script.execute: refresh_weather_widget
          - script.execute: ensure_assist_streaming
          - script.execute: va_ui_set_ready
          # If on_boot stashed a crash reason, push it to HA as a
          # persistent notification so the user can review it the next
          # time they look at HA. Cleared after sending so each crash
          # reports exactly once per boot.
          - if:
              condition:
                lambda: 'return !id(g_crash_report).empty();'
              then:
                - homeassistant.service:
                    service: persistent_notification.create
                    data:
                      title: "Mangalam Panel — Recovered From Crash"
                      notification_id: "mangalam_panel_crash"
                      message: !lambda |-
                        return std::string("Reason: ") + id(g_crash_report) +
                               "\n\nThe firmware caught the fault and "
                               "rebooted. The on-screen banner shows the same "
                               "info and auto-dismisses after 20 seconds. "
                               "If this keeps happening, check the latest "
                               "esphome logs for the crash backtrace.";
                - globals.set:
                    id: g_crash_report
                    value: '""'
  on_client_disconnected:
    - globals.set:
        id: g_ha_client_count
        value: !lambda |-
          int c = id(g_ha_client_count) - 1;
          return c < 0 ? 0 : c;
    - if:
        condition:
          lambda: 'return id(g_ha_client_count) == 0;'
        then:
          - globals.set:
              id: g_ha_connected
              value: 'false'
          - script.execute: update_status_pill
          # Show the small offline pill (slideshow page) but do NOT force a
          # page change or block navigation — local integrations keep
          # working without HA; header status pills flag the state on
          # every other page.
          - lvgl.widget.show: ha_disconnected_overlay
          - script.execute: va_ui_set_offline
          - voice_assistant.stop:

ota:
  - platform: esphome
    password: !secret ota_password

# After repeated boot crashes the device enters safe mode (OTA-only, no user
# code) for 1 minute — gives a reliable window to OTA-flash a fixed firmware
# even if normal boot crashes immediately.
safe_mode:
  boot_is_good_after: 60s
  reboot_timeout: 1min
  num_attempts: 5

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/London

script:
  # Redraws the Energy page battery card from the two cached Hypon globals
  # (SOC + power magnitude). Called from both energy_battery_soc_s and
  # energy_battery_power_s so either one arriving redraws with the latest
  # of both — the Hypon proxy updates both from the same poll anyway.
  - id: update_hypon_battery_card
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          float soc = id(g_hypon_battery_soc);
          float power = id(g_hypon_battery_power);
          float prev = id(g_hypon_prev_soc);
          char b[40];
          snprintf(b, sizeof(b), "%.0f%%", soc);
          lv_label_set_text(id(energy_battery_soc_val), b);

          uint32_t c;
          if (prev < 0.0f) {
            lv_label_set_text(id(energy_battery_flow_val), "--");
            c = 0xB388FF;
          } else if (soc > prev + 0.4f) {
            snprintf(b, sizeof(b), "charging %.0f W", power);
            lv_label_set_text(id(energy_battery_flow_val), b);
            c = 0x69F0AE;
          } else if (soc < prev - 0.4f) {
            snprintf(b, sizeof(b), "discharging %.0f W", power);
            lv_label_set_text(id(energy_battery_flow_val), b);
            c = 0xFFB74D;
          } else {
            lv_label_set_text(id(energy_battery_flow_val), "steady");
            c = 0xB388FF;
          }
          lv_obj_set_style_border_color(id(energy_battery_card), lv_color_hex(c), 0);
          lv_obj_set_style_text_color(id(energy_arrow_battery), lv_color_hex(c), 0);
          id(g_hypon_prev_soc) = soc;

  # Re-apply cached HA weather values to the slideshow widget. Needed because
  # weather updates often arrive before g_lvgl_ready, so the first push is dropped.
  - id: refresh_weather_widget
    mode: restart
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          if (id(ha_weather_city).has_state()) {
            std::string loc = id(ha_weather_city).get_state();
            if (!loc.empty()) {
              lv_label_set_text(id(wx_location_lbl), loc.c_str());
            }
          }
          if (id(ha_weather_state).has_state()) {
            std::string x = id(ha_weather_state).get_state();
            if (x.empty() || x == "unknown" || x == "unavailable") {
              lv_obj_t* all_icons[] = {
                id(wx_sunny), id(wx_night), id(wx_cloudy), id(wx_partlycloudy),
                id(wx_rainy), id(wx_snowy), id(wx_fog), id(wx_lightning), id(wx_windy)
              };
              for (auto* w : all_icons) lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(wx_cond_lbl), "Weather offline");
              lv_obj_set_style_text_color(id(wx_cond_lbl), lv_color_hex((uint32_t) id(g_theme_error)), 0);
            } else {
            struct WxRow { const char* state; lv_obj_t* widget; uint32_t color; const char* label; };
            WxRow rows[] = {
              {"sunny",            id(wx_sunny),        0xFFD700, "Sunny"},
              {"clear",            id(wx_sunny),        0xFFD700, "Clear"},
              {"clear-night",      id(wx_night),        0xAACCFF, "Clear night"},
              {"cloudy",           id(wx_cloudy),       0xCCCCCC, "Cloudy"},
              {"partlycloudy",     id(wx_partlycloudy), 0xDDDDDD, "Partly cloudy"},
              {"partly-cloudy",    id(wx_partlycloudy), 0xDDDDDD, "Partly cloudy"},
              {"rainy",            id(wx_rainy),        0x66BBFF, "Rainy"},
              {"pouring",          id(wx_rainy),        0x4499FF, "Pouring"},
              {"snowy",            id(wx_snowy),        0xEEFFFF, "Snowy"},
              {"snowy-rainy",      id(wx_snowy),        0xCCDDFF, "Sleet"},
              {"hail",             id(wx_snowy),        0xCCDDFF, "Hail"},
              {"fog",              id(wx_fog),          0xBBBBBB, "Fog"},
              {"lightning",        id(wx_lightning),    0xFFCC44, "Lightning"},
              {"lightning-rainy",  id(wx_lightning),    0xFFAA00, "Storm"},
              {"windy",            id(wx_windy),        0xAACCDD, "Windy"},
              {"windy-variant",    id(wx_windy),        0xAACCDD, "Windy"},
              {"exceptional",      id(wx_lightning),    0xFF6644, "Extreme"},
            };
            lv_obj_t* all_icons[] = {
              id(wx_sunny), id(wx_night), id(wx_cloudy), id(wx_partlycloudy),
              id(wx_rainy), id(wx_snowy), id(wx_fog), id(wx_lightning), id(wx_windy)
            };
            for (auto* w : all_icons) lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);
            const char* label = "-";
            uint32_t color = 0xCCCCCC;
            lv_obj_t* show = id(wx_cloudy);
            for (auto& row : rows) {
              if (x == row.state) {
                show = row.widget;
                color = row.color;
                label = row.label;
                break;
              }
            }
            lv_obj_clear_flag(show, LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_img_recolor(show, lv_color_hex(color), 0);
            lv_obj_set_style_img_recolor_opa(show, LV_OPA_COVER, 0);
            lv_label_set_text(id(wx_cond_lbl), label);
            lv_obj_set_style_text_color(id(wx_cond_lbl), lv_color_hex(color), 0);
            }
          }
          bool ha_temp_ok = false;
          if (id(ha_weather_temp).has_state()) {
            std::string x = id(ha_weather_temp).get_state();
            if (!x.empty() && x != "unknown" && x != "unavailable") {
              float t = atof(x.c_str());
              char b[12];
              snprintf(b, sizeof(b), "%d\xC2\xB0", (int)(t + (t >= 0 ? 0.5f : -0.5f)));
              lv_label_set_text(id(wx_temp_lbl), b);
              ha_temp_ok = true;
            }
          }
          bool ha_hum_ok = false;
          if (id(ha_weather_humidity).has_state()) {
            std::string x = id(ha_weather_humidity).get_state();
            if (!x.empty() && x != "unknown" && x != "unavailable") {
              float h = atof(x.c_str());
              char b[12];
              snprintf(b, sizeof(b), "%d%% RH", (int)(h + 0.5f));
              lv_label_set_text(id(wx_humidity_lbl), b);
              ha_hum_ok = true;
            }
          }
          bool ha_state_ok = id(ha_weather_state).has_state()
            && id(ha_weather_state).get_state() != "unavailable"
            && id(ha_weather_state).get_state() != "unknown"
            && !id(ha_weather_state).get_state().empty();
          if (!ha_state_ok) {
            lv_obj_t* all_icons[] = {
              id(wx_sunny), id(wx_night), id(wx_cloudy), id(wx_partlycloudy),
              id(wx_rainy), id(wx_snowy), id(wx_fog), id(wx_lightning), id(wx_windy)
            };
            for (auto* w : all_icons) lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(wx_partlycloudy), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_img_recolor(id(wx_partlycloudy), lv_color_hex((uint32_t) id(g_theme_text_secondary)), 0);
            lv_obj_set_style_img_recolor_opa(id(wx_partlycloudy), LV_OPA_COVER, 0);
            lv_label_set_text(id(wx_cond_lbl), "Drawing room");
            lv_obj_set_style_text_color(id(wx_cond_lbl), lv_color_hex((uint32_t) id(g_theme_text_secondary)), 0);
            if (!ha_temp_ok && id(room1_temp_s).has_state()) {
              std::string t = id(room1_temp_s).get_state();
              if (!t.empty() && t != "unknown" && t != "unavailable") {
                lv_label_set_text(id(wx_temp_lbl), (t + "\xC2\xB0").c_str());
              }
            }
            if (!ha_hum_ok && id(room1_hum_s).has_state()) {
              std::string h = id(room1_hum_s).get_state();
              if (!h.empty() && h != "unknown" && h != "unavailable") {
                char b[16];
                snprintf(b, sizeof(b), "%s%% RH", h.c_str());
                lv_label_set_text(id(wx_humidity_lbl), b);
              }
            }
          }
          lv_obj_set_style_opa(id(weather_widget), LV_OPA_COVER, 0);

  # Drives the header status_pill's dot colour + label from current
  # connectivity/integration state. Deliberately uses the *current* ok
  # flags (not staleness) so a page nobody has opened recently doesn't
  # falsely show as degraded.
  - id: update_status_pill
    mode: single
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          uint32_t color = 0x69F0AE;
          const char *txt = "OK";
          if (!id(g_wifi_connected)) {
            color = 0xFF5252; txt = "WIFI";
          } else if (!id(g_ha_connected)) {
            color = 0xFF5252; txt = "HA";
          } else if (!id(g_immich_ok) || !id(g_tuya_bridge_ok) ||
                     !id(g_jf_bridge_ok) || !id(g_ih_bridge_ok)) {
            color = 0xFFC107; txt = "WARN";
          }
          // One pill instance per carousel page header (no shared-widget
          // mechanism in ESPHome LVGL, so each page carries its own copy).
          lv_obj_t *dots[] = {
            id(status_pill_dot), id(status_pill_dot_ihost),
            id(status_pill_dot_tado), id(status_pill_dot_pres),
            id(status_pill_dot_energy), id(status_pill_dot_cam),
            id(status_pill_dot_tuya), id(status_pill_dot_jf),
          };
          lv_obj_t *lbls[] = {
            id(status_pill_lbl), id(status_pill_lbl_ihost),
            id(status_pill_lbl_tado), id(status_pill_lbl_pres),
            id(status_pill_lbl_energy), id(status_pill_lbl_cam),
            id(status_pill_lbl_tuya), id(status_pill_lbl_jf),
          };
          for (size_t i = 0; i < 8; i++) {
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(color), 0);
            lv_label_set_text(lbls[i], txt);
          }

  # Populates the Diagnostics page (packages/display_touch_board.yaml,
  # diagnostics_page). Runs on page load, on refresh-button tap, and on
  # the 5s interval below — cheap enough to not bother gating further.
  - id: refresh_diagnostics_labels
    mode: single
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          auto age_str = [](uint32_t last_ok) -> std::string {
            if (last_ok == 0) return "never";
            uint32_t age_s = (millis() - last_ok) / 1000;
            char b[24];
            if (age_s < 90) snprintf(b, sizeof(b), "%lus ago", (unsigned long) age_s);
            else snprintf(b, sizeof(b), "%lum ago", (unsigned long) (age_s / 60));
            return std::string(b);
          };
          char b[64];

          lv_label_set_text(id(diag_wifi_lbl),
            (std::string("WiFi: ") + (id(g_wifi_connected) ? "Connected" : "Disconnected")).c_str());
          snprintf(b, sizeof(b), "Signal: %.0f dBm", id(panel_wifi_rssi).state);
          lv_label_set_text(id(diag_rssi_lbl), b);
          lv_label_set_text(id(diag_ip_lbl),
            (std::string("IP: ") + (id(wifi_ip_addr).state.empty() ? "--" : id(wifi_ip_addr).state)).c_str());
          snprintf(b, sizeof(b), "Home Assistant API: %s (%d client%s)",
            id(g_ha_connected) ? "Connected" : "Disconnected",
            id(g_ha_client_count), id(g_ha_client_count) == 1 ? "" : "s");
          lv_label_set_text(id(diag_ha_lbl), b);

          snprintf(b, sizeof(b), "Heap free: %.0f KB", id(panel_heap_free).state / 1024.0f);
          lv_label_set_text(id(diag_heap_lbl), b);
          snprintf(b, sizeof(b), "PSRAM free: %.0f KB", id(panel_psram_free).state / 1024.0f);
          lv_label_set_text(id(diag_psram_lbl), b);
          snprintf(b, sizeof(b), "Loop time: %.0f ms", id(panel_loop_time).state);
          lv_label_set_text(id(diag_loop_lbl), b);
          int s = (int) id(panel_uptime).state;
          snprintf(b, sizeof(b), "Uptime: %dh %02dm", s / 3600, (s % 3600) / 60);
          lv_label_set_text(id(diag_uptime_lbl), b);
          lv_label_set_text(id(diag_reset_lbl),
            (std::string("Last reset: ") + (id(panel_reset_reason).state.empty() ? "--" : id(panel_reset_reason).state)).c_str());

          lv_label_set_text(id(diag_immich_lbl),
            (std::string("Immich: ") + (id(g_immich_ok) ? "Online" : "Offline") +
             " (" + age_str(id(g_immich_last_ok)) + ")").c_str());
          lv_label_set_text(id(diag_tuya_lbl),
            (std::string("Tuya bridge: ") + (id(g_tuya_bridge_ok) ? "Online" : "Offline") +
             " (" + age_str(id(g_tuya_last_ok)) + ")").c_str());
          lv_label_set_text(id(diag_jf_lbl),
            (std::string("Jellyfin proxy: ") + (id(g_jf_bridge_ok) ? "Online" : "Offline") +
             " (" + age_str(id(g_jf_last_ok)) + ")").c_str());
          lv_label_set_text(id(diag_ih_lbl),
            (std::string("iHost bridge: ") + (id(g_ih_bridge_ok) ? "Online" : "Offline") +
             " (" + age_str(id(g_ih_last_ok)) + ")").c_str());
      - script.execute: update_status_pill

# Keeps the header status pill and (if open) the diagnostics page current
# even when nothing else triggers an update — e.g. an integration flips
# offline mid-poll with no user interaction to hook into.
interval:
  - interval: 5s
    then:
      - script.execute: refresh_diagnostics_labels

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Panel IP Address"
      id: wifi_ip_addr
    ssid:
      name: "Panel Wi-Fi SSID"
  - platform: debug
    reset_reason:
      name: "Panel Last Reset Reason"
      id: panel_reset_reason

  # Displays proxy URL in settings; no auto-refresh on change to avoid
  # cascading download attempts every time HA pushes a state update.
  - platform: homeassistant
    id: ha_immich_url_sensor
    entity_id: input_text.panel_immich_url
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!x.empty()) id(immich_base_url) = x.c_str();

  # Slideshow refresh interval, in minutes. Reads from HA helper
  # input_number.panel_slideshow_interval (recommended range 1–1440 minutes;
  # create with min=1, max=1440, step=1 mode=box). Clamped here so a bad
  # value in HA can't break the timer logic. The 1-minute interval block
  # in display_touch_board.yaml reads g_slideshow_interval_min on every tick.
  - platform: homeassistant
    id: ha_slideshow_interval
    entity_id: input_number.panel_slideshow_interval
    internal: true
    on_value:
      then:
        - lambda: |-
            int v = (int)atof(x.c_str());
            if (v < 1) v = 1;
            if (v > 1440) v = 1440;
            id(g_slideshow_interval_min) = v;
            id(g_slideshow_counter_min) = 0;
            // Keep the settings-page spinner label in sync with whatever
            // value HA pushes (e.g. somebody nudges the helper in HA UI).
            char b[12];
            snprintf(b, sizeof(b), "%d min", v);
            lv_label_set_text(id(settings_interval_val), b);

  # Weather location label — text driven by HA helper
  # input_text.panel_weather_city. The weather entity's friendly_name is
  # "Forecast Home" and it has no city attribute, so a dedicated HA helper
  # is the cleanest source. Create:
  #   Settings → Devices & Services → Helpers → Text
  #   Name "Panel Weather City", entity_id input_text.panel_weather_city
  - platform: homeassistant
    id: ha_weather_city
    entity_id: input_text.panel_weather_city
    internal: true
    on_value:
      then:
        - script.execute: refresh_weather_widget

  # ─── Weather widget — state drives which mdi:weather-* icon is visible
  # and its tint; temperature attribute fills the big number.
  - platform: homeassistant
    id: ha_weather_state
    entity_id: "${weather_entity}"
    internal: true
    on_value:
      then:
        - script.execute: refresh_weather_widget

  - platform: homeassistant
    id: ha_weather_temp
    entity_id: "${weather_entity}"
    attribute: temperature
    internal: true
    on_value:
      then:
        - script.execute: refresh_weather_widget

  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: "${weather_entity}"
    attribute: humidity
    internal: true
    on_value:
      then:
        - script.execute: refresh_weather_widget

  # Slideshow transition effect, paired with HA helper
  # input_number.panel_transition_effect (recommended range 0–5 step 1
  # mode=Box). Values: 0=Fade, 1=SlideLeft, 2=SlideRight, 3=SlideUp,
  # 4=SlideDown, 5=Zoom. Drives the exit/entry animations in
  # refresh_immich_slideshow + on_download_finished.
  - platform: homeassistant
    id: ha_transition_effect
    entity_id: input_number.panel_transition_effect
    internal: true
    on_value:
      then:
        - lambda: |-
            int v = (int)atof(x.c_str());
            if (v < 0) v = 0;
            if (v > 5) v = 0;
            id(g_transition_effect) = v;
            if (id(g_lvgl_ready)) {
              static const char* names[6] = {
                "Crossfade", "Slide Left", "Slide Right",
                "Slide Up", "Slide Down", "Zoom"
              };
              lv_label_set_text(id(settings_effect_val), names[v]);
            }


  # Panel colour theme — bidirectional sync with g_panel_theme (0–4).
  # Create in HA: Settings → Helpers → Dropdown
  #   Name: Panel Theme, entity_id input_select.panel_theme
  #   Options: Midnight, Graphite, Warm Home, Nord, High Contrast
  - platform: homeassistant
    id: ha_panel_theme
    entity_id: input_select.panel_theme
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(g_theme_push_to_ha);'
            then: []
            else:
              - script.execute: panel_theme_from_ha

  # Calendar overlay opacity in %, paired with HA helper
  # input_number.panel_calendar_opacity (recommended range 0–100 step 5
  # mode=Box). Drives the bg_opa of calendar_panel on the slideshow page.
  - platform: homeassistant
    id: ha_calendar_opacity
    entity_id: input_number.panel_calendar_opacity
    internal: true
    on_value:
      then:
        - lambda: |-
            int v = (int)atof(x.c_str());
            if (v < 0) v = 0;
            if (v > 100) v = 100;
            id(g_calendar_opa_pct) = v;
            if (id(g_lvgl_ready)) {
              uint32_t opa = (uint32_t)((v * 255) / 100);
              lv_obj_set_style_opa(id(calendar_panel),     opa, 0);
              lv_obj_set_style_opa(id(clock_pill_obj),     opa, 0);
              lv_obj_set_style_opa(id(slideshow_clock),    opa, 0);
              lv_obj_set_style_opa(id(slideshow_date_lbl), opa, 0);
            }
            char b[12];
            snprintf(b, sizeof(b), "%d %%", v);
            lv_label_set_text(id(settings_calopa_val), b);

  # Calendar rendering style, paired with HA helper
  # input_number.panel_calendar_style (recommended range 0–3 step 1
  # mode=Box). Values: 0=Ribbon, 1=Agenda, 2=Compact, 3=Timeline.
  - platform: homeassistant
    id: ha_calendar_style
    entity_id: input_number.panel_calendar_style
    internal: true
    on_value:
      then:
        - lambda: |-
