  # Energy page values. These are text_sensor subscriptions because Home
  # Assistant entity states may arrive as strings with decimals, units, or
  # unavailable; the page only needs display text.
  - platform: homeassistant
    id: energy_grid_power_s
    entity_id: "${energy_grid_power}"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(g_lvgl_ready)) return;
            if (x.empty() || x == "unknown" || x == "unavailable") {
              lv_label_set_text(id(energy_grid_val), "--");
              return;
            }
            // Bi-directional meter: negative = exporting to grid. Flip the
            // card's title/colour so the direction is readable at a glance
            // instead of a bare signed number.
            float w = atof(x.c_str());
            bool exporting = w < 0.0f;
            char b[32];
            snprintf(b, sizeof(b), "%.0f ${energy_grid_power_unit}", exporting ? -w : w);
            lv_label_set_text(id(energy_grid_val), b);
            lv_label_set_text(id(energy_grid_title), exporting ? "GRID EXPORT" : "GRID IMPORT");
            uint32_t c = exporting ? 0x69F0AE : 0x44AAFF;
            lv_obj_set_style_text_color(id(energy_grid_title), lv_color_hex(c), 0);
            lv_obj_set_style_border_color(id(energy_grid_card), lv_color_hex(c), 0);
            lv_obj_set_style_text_color(id(energy_arrow_grid), lv_color_hex(c), 0);
  - platform: homeassistant
    id: energy_solar_power_s
    entity_id: "${energy_solar_power}"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(g_lvgl_ready)) return;
            std::string v = x.empty() || x == "unknown" || x == "unavailable" ? "--" : x + " ${energy_solar_power_unit}";
            lv_label_set_text(id(energy_solar_val), v.c_str());
  - platform: homeassistant
    id: energy_solar_energy_s
    entity_id: "${energy_solar_energy}"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(g_lvgl_ready)) return;
            std::string v = x.empty() || x == "unknown" || x == "unavailable" ? "today: --" : "today: " + x + " ${energy_solar_energy_unit}";
            lv_label_set_text(id(energy_solar_today_val), v.c_str());
