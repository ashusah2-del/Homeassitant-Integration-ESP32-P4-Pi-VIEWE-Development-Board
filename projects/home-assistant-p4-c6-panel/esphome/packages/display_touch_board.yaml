          // Same bug, one level deeper: the individual dashboard/tado room
          // cards are themselves plain lv_obj widgets with on_click, and
          // never had SCROLLABLE cleared either — only their parent grid
          // container did. A page-level fix doesn't help a card-level
          // scrollable flag. This is what was actually eating the Drawing
          // Room tile's tap: touch coordinates land correctly on the card
