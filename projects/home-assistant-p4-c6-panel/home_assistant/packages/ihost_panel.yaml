# ── Switches ──────────────────────────────────────────────────────────────────
switch:
  - platform: rest
    name: "iHost Drawing Room"
    unique_id: ihost_drawing_room
    resource: "http://192.168.55.59:8768/ihost/device/00124b0024c30e72"
    body_on: '{"on": true}'
    body_off: '{"on": false}'
    is_on_template: "{{ value_json.on }}"
    headers:
      Content-Type: application/json
    method: POST
    scan_interval: 30
    device_class: outlet
    icon: mdi:power-socket
