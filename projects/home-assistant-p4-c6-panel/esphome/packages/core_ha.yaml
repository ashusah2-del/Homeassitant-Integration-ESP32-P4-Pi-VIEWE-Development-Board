        - script.execute: render_calendar

  # Calendar events pushed from HA automation into input_text.panel_calendar_events.
  # The string is cached into g_calendar_events_full; the render_calendar
  # script does the splitting and paginates onto 8-event pages that cycle
  # every 30 s (interval block in display_touch_board.yaml).
  - platform: homeassistant
    id: ha_calendar_events
    entity_id: input_text.panel_calendar_events
    internal: true
    on_value:
      then:
        - lambda: |-
            id(g_calendar_events_full) = x;
            id(g_calendar_page) = 0;  // jump back to page 1 on every fresh push
        - script.execute: render_calendar

  # ─── Room dashboard: light state + brightness + temp/humidity ─────────
  # Each room card subscribes to light state ("on"/"off"), updates the bulb
  # tint and ON/OFF label. Dimmable rooms (2-5) also subscribe to brightness
  # and drive the arc. Temp/humidity update text labels.
  - platform: homeassistant
    id: room1_state
    entity_id: "${room1_light}"
    internal: true
    on_value:
      then:
        - lambda: |-
            bool on = (x == "on");
            lv_label_set_text(id(room1_state_lbl), on ? "ON" : "OFF");
            lv_obj_set_style_text_color(id(room1_state_lbl), on ? lv_color_hex((uint32_t) id(g_theme_lamp_on)) : lv_color_hex((uint32_t) id(g_theme_lamp_off)), 0);
            lv_obj_set_style_img_recolor(id(room1_icon), on ? lv_color_hex((uint32_t) id(g_theme_lamp_on)) : lv_color_hex((uint32_t) id(g_theme_lamp_off)), 0);
            lv_obj_set_style_img_recolor_opa(id(room1_icon), LV_OPA_COVER, 0);
            // Maintain the all-lights bitmask + refresh the master button label.
            if (on) id(g_lights_on_mask) |= (1 << 0);
            else    id(g_lights_on_mask) &= ~(1 << 0);
            bool any = id(g_lights_on_mask) != 0;
            lv_label_set_text(id(all_lights_lbl), any ? "All Lights Off" : "All Lights On");
            lv_obj_set_style_text_color(id(all_lights_lbl), any ? lv_color_hex((uint32_t) id(g_theme_accent)) : lv_color_hex((uint32_t) id(g_theme_lamp_on)), 0);
