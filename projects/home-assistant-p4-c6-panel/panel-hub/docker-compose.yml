services:
  adb-server:
    image: sorccu/adb:latest
    container_name: adb-server
    network_mode: host
    restart: unless-stopped

  panel-hub:
    depends_on:
      - adb-server
    build: .
    restart: unless-stopped
    ports:
      - "8768:8768"
    volumes:
      - ./hub.env:/app/hub.env:ro
      - ./devices.json:/app/devices.json
      - ./panel_config.json:/app/panel_config.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - hub.env
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8768/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
