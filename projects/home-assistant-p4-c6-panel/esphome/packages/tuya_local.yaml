    - id: tuya_page
      bg_color: 0x060C08
      on_load:
        - lambda: |-
            id(g_tuya_page_active) = true;
        # Keep page entry responsive. Full Tuya LAN polling can take tens of
        # seconds when battery sensors or gateways are asleep/offline.
        - script.execute: tuya_poll_health
        - script.execute: tuya_apply_ui
      on_unload:
        - lambda: |-
