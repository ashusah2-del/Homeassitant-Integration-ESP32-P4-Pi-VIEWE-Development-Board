image:
  - file: mdi:image-outline
    id: img_no_photo
    type: grayscale
    resize: 128x128
    transparency: alpha_channel
  - file: mdi:home-off
    id: img_ha_offline
    type: grayscale
    resize: 128x128
    transparency: alpha_channel
  # Room-card icon — single 48x48 light bulb, recoloured at runtime via
  # lv_obj_set_style_img_recolor depending on the light state (gold = on,
  # grey = off). Single source so the binary doesn't carry both variants.
  - file: mdi:lightbulb
    id: img_lightbulb
    type: grayscale
    resize: 48x48
    transparency: alpha_channel
  # Presence indicator — recoloured per state (green=ACTIVE, grey=CLEAR).
  # House icon makes it obvious which sensors track motion in the house.
  - file: mdi:home
    id: img_dot
    type: grayscale
    resize: 80x80
    transparency: alpha_channel
  # Weather widget icons — one per HA `weather` state. All start hidden;
  # the on_value lambda below reveals the matching one and hides the rest.
  - file: mdi:weather-sunny
    id: img_wx_sunny
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-night
    id: img_wx_night
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-cloudy
    id: img_wx_cloudy
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-partly-cloudy
    id: img_wx_partlycloudy
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-rainy
    id: img_wx_rainy
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-snowy
    id: img_wx_snowy
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-fog
    id: img_wx_fog
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-lightning
    id: img_wx_lightning
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:weather-windy
    id: img_wx_windy
    type: grayscale
    resize: 96x96
    transparency: alpha_channel
  - file: mdi:microphone
    id: img_mic
    type: grayscale
    resize: 32x32
    transparency: alpha_channel
  - file: mdi:cog
    id: img_settings
    type: grayscale
    resize: 24x24
    transparency: alpha_channel
  - file: mdi:home
    id: img_home
    type: grayscale
    resize: 24x24
    transparency: alpha_channel
  # Stock fallback images — downloaded once at build time, stored in flash.
  # Shown when Immich is unavailable; cycles on each slideshow tick.
  # 1024x600 = full screen (overlaps calendar; calendar panel has bg_opa: 70%
  # so the image still shows through behind the calendar text).
  # No LVGL zoom — zoom on flash-based static images crashes the ESP32-P4
  # under PSRAM XIP, so the source size IS the displayed size.
  # 2 images at 1.23MB each = 2.46MB total embedded, well within OTA budget.
  - file: https://picsum.photos/id/10/1024/600
    id: stock_img_0
    type: RGB565
    resize: 1024x600
    byte_order: LITTLE_ENDIAN
  - file: https://picsum.photos/id/28/1024/600
    id: stock_img_1
    type: RGB565
    resize: 1024x600
    byte_order: LITTLE_ENDIAN

globals:
  - id: immich_base_url
    type: std::string
    restore_value: no
    initial_value: '"${proxy_url}"'
  - id: g_immich_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  # Tracks active API clients so refresh+VA actions only run on first-connect /
  # last-disconnect rather than on every client transition.
  - id: g_ha_client_count
    type: int
    restore_value: no
    initial_value: '0'
  # Raw WiFi link state, distinct from g_ha_connected (which tracks the
  # ESPHome API socket and lags a WiFi drop until the API times out).
  # Set from wifi.on_connect/on_disconnect in mangalam-panel.yaml.
  - { id: g_wifi_connected, type: bool, restore_value: no, initial_value: 'false' }
  # millis() timestamp of the last successful health/data poll per
  # integration. 0 = never succeeded since boot. Read by the status pill /
  # diagnostics panel to flag an integration as stale.
  - { id: g_immich_last_ok, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: g_tuya_last_ok,   type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: g_jf_last_ok,     type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: g_ih_last_ok,     type: uint32_t, restore_value: no, initial_value: '0' }
  # true = currently displaying an embedded stock image, not Immich
  - id: g_using_fallback
    type: bool
    restore_value: no
    initial_value: 'false'
  # Retry counter for Immich download errors (reset on success, max 3 attempts)
  - id: g_immich_retry
    type: int
    restore_value: no
    initial_value: '0'
  # Hypon battery has no separate charge/discharge sign in the cloud API —
  # only a magnitude. Direction is inferred from the SOC trend between
  # consecutive polls (-1 = unknown/first reading, so no arrow is drawn).
  - id: g_hypon_prev_soc
    type: float
    restore_value: no
    initial_value: '-1.0'
  - id: g_hypon_battery_soc
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: g_hypon_battery_power
    type: float
    restore_value: no
    initial_value: '0.0'
  # Cycles through embedded stock images (0–3)
  - id: g_stock_idx
    type: int
    restore_value: no
    initial_value: '0'
  # Tado page — current target temperature per zone (updated from HA's
  # climate.X "temperature" attribute). The +/− buttons mutate these and
  # call climate.set_temperature with the new value.
  - { id: g_tado1_target, type: float, restore_value: no, initial_value: '20.0' }
  - { id: g_tado2_target, type: float, restore_value: no, initial_value: '20.0' }
  - { id: g_tado3_target, type: float, restore_value: no, initial_value: '20.0' }
  - { id: g_tado4_target, type: float, restore_value: no, initial_value: '20.0' }
  - { id: g_tado5_target, type: float, restore_value: no, initial_value: '20.0' }
  - { id: g_tado6_target, type: float, restore_value: no, initial_value: '20.0' }
  # True while the camera_view_page is foregrounded. Used to gate any
  # camera-specific logic; live view is refreshed manually (open tile or
  # Refresh button) — no auto-polling timer.
  - { id: g_on_camera_view, type: bool, restore_value: no, initial_value: 'false' }
  # Proxy camera entity slug for the live-view page (e.g. "front_door").
  - { id: g_camera_live_entity, type: std::string, restore_value: no, initial_value: '""' }
  # Camera entity slugs for thumbnail refresh. Initialized from compile-time
  # substitutions; overridable at runtime by panel_hub_config.yaml on_boot fetch.
  # Devices that don't define cam subs get "" (empty = slot skipped in refresh).
  - { id: g_cam1_entity, type: std::string, restore_value: no, initial_value: '"${cam1_entity}"' }
  - { id: g_cam2_entity, type: std::string, restore_value: no, initial_value: '"${cam2_entity}"' }
  - { id: g_cam3_entity, type: std::string, restore_value: no, initial_value: '"${cam3_entity}"' }
  - { id: g_cam4_entity, type: std::string, restore_value: no, initial_value: '"${cam4_entity}"' }
  # Panel backlight brightness 10–100 %, editable on the settings page.
  - { id: g_backlight_pct, type: int, restore_value: yes, initial_value: '80' }
  # Tuya bridge reachability — updated by tuya_local health poll when included.
  - { id: g_tuya_bridge_ok, type: bool, restore_value: no, initial_value: 'false' }
  # Bitmask of which dashboard lights are currently on. Bit i is for room i+1
  # (so bit 0 = Drawing, bit 1 = Office, …, bit 5 = Conservatory). The
  # all-lights toggle button uses this to decide whether tapping should
  # turn everything off or turn everything on.
  - { id: g_lights_on_mask, type: uint8_t, restore_value: no, initial_value: '0' }
  # Slideshow refresh interval in minutes. Sourced from HA's
  # input_number.panel_slideshow_interval helper; the 1-minute interval
  # bumps the counter and fires the refresh script when it crosses the
  # threshold. restore_value: yes so a non-default tuning survives reboot.
  - { id: g_slideshow_interval_min, type: int, restore_value: yes, initial_value: '10' }
  - { id: g_slideshow_counter_min,  type: int, restore_value: no,  initial_value: '0' }
  # Calendar overlay opacity, 0–100 %. Mirrors HA's
  # input_number.panel_calendar_opacity and is editable on the settings
  # page. restore_value: yes so a tuning sticks across reboots.
  - { id: g_calendar_opa_pct, type: int, restore_value: yes, initial_value: '70' }
  # Calendar rendering style: 0=Ribbon 1=Agenda 2=Compact 3=Timeline. Mirrors
  # HA's input_number.panel_calendar_style helper and is editable on the
  # settings page. restore_value: yes so the choice sticks across reboots.
  - { id: g_calendar_style, type: int, restore_value: yes, initial_value: '0' }
  # Slideshow transition effect: 0=Fade 1=SlideLeft 2=SlideRight
  # 3=SlideUp 4=SlideDown 5=Zoom. Mirrors HA's
  # input_number.panel_transition_effect helper (if it exists; setting
  # is panel-local without it). The exit animation runs in
  # refresh_immich_slideshow before the download starts; the entry
  # animation runs from on_download_finished after the new image is
  # decoded and positioned.
  - { id: g_transition_effect, type: int, restore_value: yes, initial_value: '0' }
  # Slideshow double-buffer slot index: 0 = slideshow_img / immich_photo
  # currently visible, 1 = slideshow_img_b / immich_photo_b currently
  # visible. refresh_immich_slideshow downloads into the inactive slot
  # so the visible image is never disturbed mid-fetch; on_download_finished
  # then crossfades old → new with no blank moment.
  - { id: g_slideshow_slot, type: int, restore_value: no, initial_value: '0' }
  # True once the on_boot lambda has run — every multi-widget opacity cascade,
  # the weather-state lambda, and the weather attribute label-update lambdas
  # gate themselves on this so a HA push that arrives at boot before LVGL is
  # fully constructed can't trigger an Instruction-address-misaligned crash.
  # Flipped to true in the on_boot lambda after a 2-second delay.
  - { id: g_lvgl_ready, type: bool, restore_value: no, initial_value: 'false' }
  # Small wake-word status pill on the slideshow page. The 1-second interval
  # toggles the dot opacity while this is true, proving the local wake engine
  # is armed even before a wake word is detected.
  - { id: g_va_indicator_pulse, type: bool, restore_value: no, initial_value: 'false' }
  - { id: g_va_indicator_phase, type: bool, restore_value: no, initial_value: 'false' }
  # Slideshow layout edit mode. The position globals are LVGL x/y offsets for
  # the draggable overlays and are restored on boot so custom placement sticks.
  - { id: g_layout_edit_mode, type: bool, restore_value: no, initial_value: 'false' }
  # Once true, g_layout_*_x/y are absolute TOP_LEFT coords (legacy saves used anchor offsets).
  - { id: g_layout_use_absolute, type: bool, restore_value: yes, initial_value: 'false' }
  - { id: g_layout_calendar_x, type: int, restore_value: yes, initial_value: '0' }
  - { id: g_layout_calendar_y, type: int, restore_value: yes, initial_value: '0' }
  - { id: g_layout_weather_x, type: int, restore_value: yes, initial_value: '-14' }
  - { id: g_layout_weather_y, type: int, restore_value: yes, initial_value: '-14' }
  - { id: g_layout_clock_x, type: int, restore_value: yes, initial_value: '-10' }
  - { id: g_layout_clock_y, type: int, restore_value: yes, initial_value: '8' }
  - { id: g_layout_wake_x, type: int, restore_value: yes, initial_value: '-18' }
  - { id: g_layout_wake_y, type: int, restore_value: yes, initial_value: '126' }
  - { id: g_layout_calendar_visible, type: bool, restore_value: yes, initial_value: 'true' }
  - { id: g_layout_weather_visible, type: bool, restore_value: yes, initial_value: 'true' }
  - { id: g_layout_clock_visible, type: bool, restore_value: yes, initial_value: 'true' }
  - { id: g_layout_wake_visible, type: bool, restore_value: yes, initial_value: 'true' }
  - { id: g_layout_bubble_visible, type: bool, restore_value: yes, initial_value: 'true' }
  # If the previous boot was a real fault, on_boot writes the human-
  # readable reason here. on_client_connected fires a persistent
  # notification into HA the first time HA reconnects and clears the
  # string, so each crash produces exactly one HA-side notification.
  - { id: g_crash_report, type: std::string, restore_value: no, initial_value: '""' }
  # Calendar pagination — the HA helper pushes a single newline-separated
  # string; we cache it here and the render_calendar script splits it into
  # 8-event pages that cycle every 30 s.
  - { id: g_calendar_events_full, type: std::string, restore_value: no, initial_value: '""' }
  - { id: g_calendar_page,         type: int, restore_value: no, initial_value: '0' }
  # TEMPORARY — touch-jitter diagnostic. Tracks how far the reported touch
  # coordinate drifts between the first sample of a press and every
  # subsequent sample of the same gesture, to check whether panel 2's
  # GSL3680 driver is noisy enough while a finger is held still that LVGL
  # mistakes it for the start of a drag and cancels the click. Remove once
  # the tap-doesn't-click investigation is resolved.
  - { id: g_touch_active,     type: bool,   restore_value: no, initial_value: 'false' }
  - { id: g_touch_start_x,    type: int,    restore_value: no, initial_value: '0' }
  - { id: g_touch_start_y,    type: int,    restore_value: no, initial_value: '0' }
  - { id: g_touch_max_delta,  type: int,    restore_value: no, initial_value: '0' }
  - { id: g_touch_samples,    type: int,    restore_value: no, initial_value: '0' }

# Shared online_image component used for both Immich photos and stock fallback images.
# URL points to the local baseline-JPEG proxy (re-encodes Immich previews as guaranteed SOF0).
online_image:
  # Eufy camera thumbnails — small (300x180) JPEGs from the proxy's /camera
  # endpoint, refreshed every 60 seconds on the camera grid page.
  - id: cam1_thumb
    url: "${proxy_url}/camera/${cam1_entity}?size=thumb"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 240x144
    buffer_size: 24576
    update_interval: never
    request_headers: { Accept: image/jpeg }
    on_download_finished:
      - lambda: |-
          // Refresh widget src after each download so the new frame paints
          // (compile-time src: binding points at an empty buffer at boot).
          lv_img_set_src(id(cam1_widget), id(cam1_thumb).get_lv_img_dsc());
          lv_obj_invalidate(id(cam1_widget));
  - id: cam2_thumb
    url: "${proxy_url}/camera/${cam2_entity}?size=thumb"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 240x144
    buffer_size: 24576
    update_interval: never
    request_headers: { Accept: image/jpeg }
    on_download_finished:
      - lambda: |-
          // Refresh widget src after each download so the new frame paints
          // (compile-time src: binding points at an empty buffer at boot).
          lv_img_set_src(id(cam2_widget), id(cam2_thumb).get_lv_img_dsc());
          lv_obj_invalidate(id(cam2_widget));
  - id: cam3_thumb
    url: "${proxy_url}/camera/${cam3_entity}?size=thumb"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 240x144
    buffer_size: 24576
    update_interval: never
    request_headers: { Accept: image/jpeg }
    on_download_finished:
      - lambda: |-
          // Refresh widget src after each download so the new frame paints
          // (compile-time src: binding points at an empty buffer at boot).
          lv_img_set_src(id(cam3_widget), id(cam3_thumb).get_lv_img_dsc());
          lv_obj_invalidate(id(cam3_widget));
  - id: cam4_thumb
    url: "${proxy_url}/camera/${cam4_entity}?size=thumb"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 240x144
    buffer_size: 24576
    update_interval: never
    request_headers: { Accept: image/jpeg }
    on_download_finished:
      - lambda: |-
          // Refresh widget src after each download so the new frame paints
          // (compile-time src: binding points at an empty buffer at boot).
          lv_img_set_src(id(cam4_widget), id(cam4_thumb).get_lv_img_dsc());
          lv_obj_invalidate(id(cam4_widget));
  # Live view — single component, URL is swapped per camera on tap. Refreshed
  # manually when a tile is opened or when the user taps Refresh on the
  # live-view page (no timer — aggressive polling crashed the panel).
  - id: camera_live_img
    url: "${proxy_url}/camera/${cam1_entity}?size=full"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 600x340
    buffer_size: 65536
    update_interval: never
    request_headers: { Accept: image/jpeg }
    on_download_finished:
      - lambda: |-
          lv_img_set_src(id(camera_live_widget), id(camera_live_img).get_lv_img_dsc());
          lv_obj_invalidate(id(camera_live_widget));

  # Slideshow uses two online_image components (immich_photo and
  # immich_photo_b) as a double-buffer. While slot A is on screen, slot
  # B downloads the next photo. When slot B's decode finishes,
  # crossfade_to_active_slot brings it forward while the old A fades/
  # slides out — so the previous image is always visible *during* the
  # transition. PSRAM cost depends on slideshow_canvas_w x _h x 2 bytes/px.
  #
  # The request only carries this panel's own slideshow canvas size
  # (slideshow_canvas_w/h — NOT screen_w/screen_h: on a rotated board
  # those can differ from what main_display.get_width()/get_height()
  # actually report, see mangalam-panel-2.yaml) — no fill/crop flag. The
  # proxy decides letterbox vs crop-to-fill itself, keyed off that
  # resolution, so this file doesn't need to know or duplicate that
  # decision. `resize:` must match exactly since it's a fixed decode
  # buffer, not derived at runtime — refresh_immich_slideshow's own
  # requests (below) instead call get_width()/get_height() directly,
  # so they always self-correct even if these tokens are ever wrong.
  - id: immich_photo
    url: "${proxy_url}/random-photo?w=${slideshow_canvas_w}&h=${slideshow_canvas_h}"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: ${slideshow_canvas_w}x${slideshow_canvas_h}
    # 65536 is ESPHome's hard cap for online_image (cv.int_range(256, 65536)
    # in the component schema) — it cannot go higher. The proxy's
    # _to_baseline_jpeg() guarantees its JPEG output stays under this via
    # a quality/geometry step-down (ported from panel-hub/hub.py's
    # size-ceiling retry) — a large crop-to-fill canvas could otherwise
    # return 100-170 KB JPEGs that blow this buffer on every fetch and
    # silently fall back to the stock image.
    buffer_size: 65536
    update_interval: never
    request_headers:
      Accept: image/jpeg
    # Success/failure paths are shared with slot B via the parameterized
    # slideshow_loaded / slideshow_failed scripts below.
    on_download_finished:
      - script.execute: { id: slideshow_loaded, slot: 0 }
    on_error:
      - script.execute: { id: slideshow_failed, slot: 0 }

  - id: immich_photo_b
    url: "${proxy_url}/random-photo?w=${slideshow_canvas_w}&h=${slideshow_canvas_h}"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: ${slideshow_canvas_w}x${slideshow_canvas_h}
    buffer_size: 65536
    update_interval: never
    request_headers:
      Accept: image/jpeg
    on_download_finished:
      - script.execute: { id: slideshow_loaded, slot: 1 }
    on_error:
      - script.execute: { id: slideshow_failed, slot: 1 }

script:
  # ═══════════════════════════════════════════════════════════════════
  # CENTRAL STATUS / ERROR SYSTEM
  # panel_toast is the single user-visible error surface: every
  # integration reports failures through it instead of maintaining its
  # own labels. The toast floats on the LVGL top layer (visible on any
  # page), auto-hides after 8 s and can be dismissed with a tap.
  # ═══════════════════════════════════════════════════════════════════
  - id: panel_toast
    mode: restart
    parameters:
      msg: string
    then:
      - lvgl.label.update:
          id: error_lbl
          text: !lambda 'return msg;'
      - lvgl.widget.show: error_bar
      - delay: 8s
      - lvgl.widget.hide: error_bar

  # Shared success path for both slideshow slots.
  - id: slideshow_loaded
    mode: restart
    parameters:
      slot: int
    then:
      - lambda: |-
          id(g_using_fallback) = false;
          id(g_immich_ok) = true;
          id(g_immich_last_ok) = millis();
          id(g_immich_retry) = 0;
          id(g_slideshow_slot) = slot;
          auto dsc = (slot == 0) ? id(immich_photo).get_lv_img_dsc()
                                 : id(immich_photo_b).get_lv_img_dsc();
          lv_img_set_src(id(dash_bg_img), dsc);
      - script.execute: crossfade_to_active_slot
      - lvgl.widget.hide: stock_fallback_img
      - lvgl.widget.hide: slideshow_placeholder_obj
      - lvgl.widget.hide: error_bar

  # Shared failure path: up to 3 cache-busted retries into the SAME slot
  # (g_slideshow_slot hasn't advanced on a failed load), then fall back
  # to the embedded stock images and surface one toast.
  - id: slideshow_failed
    mode: restart
    parameters:
      slot: int
    then:
      - globals.set: { id: g_immich_ok, value: 'false' }
      - if:
          condition:
            lambda: return !id(g_using_fallback) && id(g_immich_retry) < 3;
          then:
            - lambda: |-
                id(g_immich_retry) += 1;
                char t[16];
                snprintf(t, sizeof(t), "%lu", (unsigned long) millis());
                // Request the SAME dimensions as the online_image decode
                // buffer (slideshow_canvas_w/h, matching the `resize:`
                // above) — NOT main_display.get_width()/get_height(),
                // which return the PHYSICAL pre-rotation panel size
                // (800x1280 on panel 2's rotate:90 board) and would ask
                // the proxy for a portrait photo that then decodes into
                // the landscape 1280x800 buffer sideways. The post-
                // rotation LVGL canvas is slideshow_canvas_w x _h.
                std::string url = id(immich_base_url) + "/random-photo?t=" + t +
                    "&w=${slideshow_canvas_w}&h=${slideshow_canvas_h}";
                auto *img = (slot == 0) ? id(immich_photo) : id(immich_photo_b);
                img->set_url(url);
                img->update();
          else:
            - globals.set: { id: g_immich_retry, value: '0' }
            - script.execute: { id: panel_toast, msg: "Immich unavailable - showing stock photos" }
            - script.execute: try_fallback_image

  - id: prepare_settings_page
    mode: restart
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          lv_obj_clear_flag(id(settings_page).obj, LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_scroll_to(id(settings_page).obj, 0, 0, LV_ANIM_OFF);
          lv_obj_add_flag(id(settings_footer), LV_OBJ_FLAG_FLOATING);
          lv_obj_move_foreground(id(settings_footer));
          lv_obj_add_flag(id(settings_left_panel), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_add_flag(id(settings_right_panel), LV_OBJ_FLAG_SCROLLABLE);

  - id: prepare_layout_settings_page
    mode: restart
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          lv_obj_clear_flag(id(layout_settings_page).obj, LV_OBJ_FLAG_SCROLLABLE);
