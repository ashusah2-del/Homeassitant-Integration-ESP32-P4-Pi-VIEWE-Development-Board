script:
  - id: yts_poll_health
    mode: restart
    then:
      - http_request.get:
          url: !lambda 'return id(immich_base_url) + "/health";'
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  bool was_ok = id(g_yts_bridge_ok);
                  id(g_yts_bridge_ok) = (response->status_code == 200);
                  if (id(g_yts_bridge_ok)) id(g_jf_last_ok) = millis();
                  else if (was_ok) id(panel_toast).execute("Movie hub offline");
          on_error:
            then:
              - lambda: |-
                  if (id(g_yts_bridge_ok)) id(panel_toast).execute("Movie hub offline");
                  id(g_yts_bridge_ok) = false;

  # Map a status string to a dot colour: library=green, downloading=amber,
  # available=muted grey. Returned as a 0xRRGGBB value for lv_color_hex.
  - id: yts_apply_ui
    mode: single
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;

          lv_label_set_text(id(yts_status_lbl),
            !id(g_yts_bridge_ok) ? "Movie hub offline" :
            id(g_yts_busy) ? "Loading latest movies..." :
            id(g_yts_total) == 0 ? "No movies found" : "Tap a movie, then Download");

          lv_obj_t *rows[]   = { id(yts_row_0), id(yts_row_1), id(yts_row_2), id(yts_row_3),
                                 id(yts_row_4), id(yts_row_5), id(yts_row_6), id(yts_row_7) };
          lv_obj_t *labels[] = { id(yts_row_lbl_0), id(yts_row_lbl_1), id(yts_row_lbl_2), id(yts_row_lbl_3),
                                 id(yts_row_lbl_4), id(yts_row_lbl_5), id(yts_row_lbl_6), id(yts_row_lbl_7) };
          lv_obj_t *dots[]   = { id(yts_row_dot_0), id(yts_row_dot_1), id(yts_row_dot_2), id(yts_row_dot_3),
                                 id(yts_row_dot_4), id(yts_row_dot_5), id(yts_row_dot_6), id(yts_row_dot_7) };

          int count = 0;
          if (!id(g_yts_movies_json).empty()) {
            json::parse_json(id(g_yts_movies_json), [&](JsonObject root) -> bool {
              JsonArray arr = root["movies"];
              count = arr.size();
              for (int i = 0; i < 8; i++) {
                if (i < count) {
                  JsonObject m = arr[i];
                  const char *name = m["title"] | "?";
                  int year = m["year"] | 0;
                  float rating = m["rating"] | 0.0f;
                  const char *status = m["status"] | "available";
                  char line[112];
                  if (year > 0 && rating > 0.0f)
                    snprintf(line, sizeof(line), "%s (%d)  %.1f", name, year, rating);
                  else if (year > 0)
                    snprintf(line, sizeof(line), "%s (%d)", name, year);
                  else
                    snprintf(line, sizeof(line), "%s", name);
                  lv_label_set_text(labels[i], line);
                  uint32_t dc = (uint32_t) id(g_theme_text_muted);
                  if (!strcmp(status, "library")) dc = (uint32_t) id(g_theme_success);
                  else if (!strcmp(status, "downloading")) dc = (uint32_t) id(g_theme_warning);
                  lv_obj_set_style_bg_color(dots[i], lv_color_hex(dc), 0);
                  lv_obj_clear_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
                  bool sel = (i == id(g_yts_selected_row));
                  lv_obj_set_style_bg_color(rows[i], lv_color_hex(sel ? (uint32_t) id(g_theme_accent_bg) : (uint32_t) id(g_theme_card_bg)), 0);
                  lv_obj_set_style_border_color(rows[i], lv_color_hex(sel ? (uint32_t) id(g_theme_accent) : 0x243B55), 0);
                  lv_obj_set_style_text_color(labels[i], lv_color_hex(sel ? (uint32_t) id(g_theme_accent) : 0xFFFFFF), 0);
                } else {
                  lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
                }
              }
              return true;
            });
          } else {
            for (int i = 0; i < 8; i++) lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
          }

          char page_buf[48];
          int start = (id(g_yts_page) - 1) * 8;
          int end = start + count;
          if (id(g_yts_total) > 0)
            snprintf(page_buf, sizeof(page_buf), "%d-%d of %d", start + 1, end, id(g_yts_total));
          else
            snprintf(page_buf, sizeof(page_buf), "--");
          lv_label_set_text(id(yts_page_lbl), page_buf);

          if (!id(g_yts_selected_name).empty()) {
            char title[128];
            if (id(g_yts_selected_year) > 0)
              snprintf(title, sizeof(title), "%s (%d)", id(g_yts_selected_name).c_str(), id(g_yts_selected_year));
            else
              snprintf(title, sizeof(title), "%s", id(g_yts_selected_name).c_str());
            lv_label_set_text(id(yts_detail_title), title);
          } else {
            lv_label_set_text(id(yts_detail_title), id(g_yts_bridge_ok) ? "Select a movie" : "Movie hub unavailable");
          }

          lv_obj_set_style_text_color(id(yts_status_lbl),
            lv_color_hex(!id(g_yts_bridge_ok) ? (uint32_t) id(g_theme_warning) : (uint32_t) id(g_theme_text_muted)), 0);

          // Download button reflects the selected movie's status: an in-library
          // or already-downloading movie has nothing to grab.
          const std::string &st = id(g_yts_selected_status);
          bool grabbable = id(g_yts_selected_id).empty() ? true : (st != "library" && st != "downloading");
          lv_label_set_text(id(yts_download_lbl),
            id(g_yts_selected_id).empty() ? "Download" :
            st == "library" ? "In Library" :
            st == "downloading" ? "Downloading" : "Download");
          lv_obj_set_style_bg_color(id(yts_download_btn),
            lv_color_hex(grabbable ? (uint32_t) id(g_theme_success) : (uint32_t) id(g_theme_text_muted)), 0);

  - id: yts_fetch_movies
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(g_yts_busy);'
          then: []
          else:
            - lambda: 'id(g_yts_busy) = true;'
            - script.execute: yts_apply_ui
            - http_request.get:
                url: !lambda |-
                  char url[180];
                  const char *s = id(g_yts_sort) ? "year" : "date_added";
                  snprintf(url, sizeof(url), "%s/yts/movies?page=%d&sort=%s",
                           id(immich_base_url).c_str(), id(g_yts_page), s);
                  return std::string(url);
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        id(g_yts_busy) = false;
                        if (response->status_code != 200) {
                          id(g_yts_movies_json) = "";
                          id(g_yts_total) = 0;
                          id(g_yts_bridge_ok) = false;
                        } else {
                          id(g_yts_bridge_ok) = true;
                          id(g_yts_movies_json) = body;
                          json::parse_json(body, [](JsonObject root) -> bool {
                            id(g_yts_total) = root["movie_count"] | 0;
                            return true;
                          });
                          if (id(g_yts_selected_row) < 0) {
                            id(yts_select_row).execute(0);
                          } else {
                            id(yts_load_row_posters).execute();
                          }
                        }
                        id(yts_apply_ui).execute();
                on_error:
                  then:
                    - lambda: |-
                        id(g_yts_busy) = false;
                        id(g_yts_bridge_ok) = false;
                        id(yts_apply_ui).execute();

  - id: yts_load_one_row_poster
    mode: single
    parameters:
      row: int
    then:
      - lambda: |-
          if (id(g_yts_movies_json).empty()) return;
          json::parse_json(id(g_yts_movies_json), [&](JsonObject root) -> bool {
            JsonArray arr = root["movies"];
            int r = row;
            if (r < 0 || r >= (int) arr.size()) return true;
            const char *mid = arr[r]["id"] | "";
            if (!mid[0]) return true;
            std::string url = id(immich_base_url) + "/yts/poster/" + mid;
            switch (r) {
              case 0: id(yts_row_img_0).set_url(url); id(yts_row_img_0).update(); break;
              case 1: id(yts_row_img_1).set_url(url); id(yts_row_img_1).update(); break;
              case 2: id(yts_row_img_2).set_url(url); id(yts_row_img_2).update(); break;
              case 3: id(yts_row_img_3).set_url(url); id(yts_row_img_3).update(); break;
              case 4: id(yts_row_img_4).set_url(url); id(yts_row_img_4).update(); break;
              case 5: id(yts_row_img_5).set_url(url); id(yts_row_img_5).update(); break;
              case 6: id(yts_row_img_6).set_url(url); id(yts_row_img_6).update(); break;
              case 7: id(yts_row_img_7).set_url(url); id(yts_row_img_7).update(); break;
            }
            return true;
          });

  # Lazy: one thumbnail at a time — parallel online_image downloads fail on P4.
  - id: yts_load_row_posters
    mode: restart
    then:
      - script.execute: { id: yts_load_one_row_poster, row: 0 }
      - delay: 300ms
      - script.execute: { id: yts_load_one_row_poster, row: 1 }
      - delay: 300ms
      - script.execute: { id: yts_load_one_row_poster, row: 2 }
      - delay: 300ms
      - script.execute: { id: yts_load_one_row_poster, row: 3 }
      - delay: 300ms
      - script.execute: { id: yts_load_one_row_poster, row: 4 }
      - delay: 300ms
      - script.execute: { id: yts_load_one_row_poster, row: 5 }
      - delay: 300ms
      - script.execute: { id: yts_load_one_row_poster, row: 6 }
      - delay: 300ms
      - script.execute: { id: yts_load_one_row_poster, row: 7 }

  - id: yts_select_row
    mode: restart
    parameters:
      row: int
    then:
      - lambda: |-
          id(g_yts_selected_row) = row;
          id(g_yts_selected_id) = "";
          id(g_yts_selected_name) = "";
          id(g_yts_selected_year) = 0;
          id(g_yts_selected_status) = "";
          if (!id(g_yts_movies_json).empty()) {
            json::parse_json(id(g_yts_movies_json), [&](JsonObject root) -> bool {
              JsonArray arr = root["movies"];
              if (row >= 0 && row < (int) arr.size()) {
                JsonObject m = arr[row];
                id(g_yts_selected_id) = m["id"] | "";
                id(g_yts_selected_name) = m["title"] | "";
                id(g_yts_selected_year) = m["year"] | 0;
                id(g_yts_selected_status) = m["status"] | "available";
              }
              return true;
            });
          }
      - if:
          condition:
            lambda: 'return !id(g_yts_selected_id).empty();'
          then:
            - online_image.set_url:
                id: yts_poster
                url: !lambda 'return id(immich_base_url) + "/yts/poster/" + id(g_yts_selected_id);'
                update: true
      - script.execute: yts_apply_ui

  - id: yts_download_selected
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              const std::string &st = id(g_yts_selected_status);
              return (st == "library" || st == "downloading");
          then:
            - lambda: |-
                id(panel_toast).execute(id(g_yts_selected_status) == "library"
                  ? "Already in library" : "Already downloading");
          else:
            - if:
                condition:
                  lambda: 'return !id(g_yts_selected_id).empty() && id(g_yts_bridge_ok);'
                then:
                  - lvgl.label.update:
                      id: yts_status_lbl
                      text: "Adding to Radarr..."
                  - http_request.post:
                      url: !lambda 'return id(immich_base_url) + "/yts/download/" + id(g_yts_selected_id);'
                      capture_response: true
                      on_response:
                        then:
                          - lambda: |-
                              const char *msg = "Added to Radarr";
                              if (response->status_code == 200) {
                                json::parse_json(body, [&](JsonObject root) -> bool {
                                  const char *st = root["status"] | "";
                                  if (!strcmp(st, "library")) msg = "Already in library";
                                  else if (!strcmp(st, "exists")) msg = "Search triggered";
                                  else if (!strcmp(st, "qbittorrent")) msg = "Sent to qBittorrent";
                                  return true;
                                });
                              } else {
                                msg = "Radarr request failed";
                              }
                              id(panel_toast).execute(msg);
                              lv_label_set_text(id(yts_status_lbl), msg);
                      on_error:
                        then:
                          - lambda: |-
                              id(panel_toast).execute("Radarr request failed");
                              lv_label_set_text(id(yts_status_lbl), "Radarr request failed");
                else:
                  - lvgl.label.update:
                      id: yts_status_lbl
                      text: !lambda |-
                        if (!id(g_yts_bridge_ok)) return std::string("Movie hub offline");
                        return std::string("Select a movie first");

  - id: yts_show_details
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(g_yts_selected_id).empty() && id(g_yts_bridge_ok);'
          then:
            - lambda: |-
                lv_label_set_text(id(yts_info_title), "Loading...");
                lv_label_set_text(id(yts_info_tags), "");
                lv_label_set_text(id(yts_info_plot), "");
                lv_obj_clear_flag(id(yts_info_overlay), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground(id(yts_info_overlay));
            - http_request.get:
                url: !lambda 'return id(immich_base_url) + "/yts/details/" + id(g_yts_selected_id);'
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          lv_label_set_text(id(yts_info_plot), "Failed to load details.");
                          return;
                        }
                        json::parse_json(body, [](JsonObject root) -> bool {
                          const char *title = root["title"] | "Unknown";
                          int year = root["year"] | 0;
                          float rating = root["rating"] | 0.0f;
                          int runtime = root["runtime"] | 0;
                          const char *lang = root["language"] | "";
                          const char *plot = root["plot"] | "";
                          char tbuf[160];
                          if (year > 0) snprintf(tbuf, sizeof(tbuf), "%s (%d)", title, year);
                          else snprintf(tbuf, sizeof(tbuf), "%s", title);
                          lv_label_set_text(id(yts_info_title), tbuf);
                          std::string tags; char nb[32];
                          if (rating > 0) { snprintf(nb, sizeof(nb), "Rating %.1f", rating); tags += nb; }
                          if (runtime > 0) { snprintf(nb, sizeof(nb), "%d min", runtime); if(!tags.empty()) tags += "   |   "; tags += nb; }
                          if (lang[0]) { if(!tags.empty()) tags += "   |   "; tags += "Lang "; tags += lang; }
                          std::string g;
                          for (JsonVariant v : root["genres"].as<JsonArray>()) {
                            const char *gn = v.as<const char*>();
                            if (gn && gn[0]) { if(!g.empty()) g += ", "; g += gn; }
                          }
                          if (!g.empty()) { if(!tags.empty()) tags += "   |   "; tags += g; }
                          lv_label_set_text(id(yts_info_tags), tags.c_str());
                          std::string cast;
                          for (JsonVariant v : root["cast"].as<JsonArray>()) {
                            const char *nm = v["name"] | "";
                            if (nm[0]) { if(!cast.empty()) cast += ", "; cast += nm; }
                          }
                          std::string body_txt;
                          if (!cast.empty()) { body_txt = "Cast: "; body_txt += cast; body_txt += "\n\n"; }
                          body_txt += (plot[0] ? plot : "No plot available.");
                          lv_label_set_text(id(yts_info_plot), body_txt.c_str());
                          return true;
                        });
                on_error:
                  then:
                    - lambda: 'lv_label_set_text(id(yts_info_plot), "Failed to load details.");'

  - id: yts_toggle_sort
    mode: single
    then:
      - lambda: |-
          id(g_yts_sort) = id(g_yts_sort) ? 0 : 1;
          id(g_yts_page) = 1;
          id(g_yts_selected_row) = -1;
          id(g_yts_selected_id) = "";
          lv_label_set_text(id(yts_sort_lbl), id(g_yts_sort) ? "Sort: Release" : "Sort: Latest");
      - script.execute: yts_fetch_movies

  - id: yts_page_prev
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(g_yts_page) > 1 && !id(g_yts_busy);'
          then:
            - lambda: |-
                id(g_yts_page) -= 1;
                id(g_yts_selected_row) = -1;
                id(g_yts_selected_id) = "";
            - script.execute: yts_fetch_movies

  - id: yts_page_next
    mode: single
    then:
      - if:
          condition:
            lambda: 'return (id(g_yts_page) * 8) < id(g_yts_total) && !id(g_yts_busy);'
          then:
            - lambda: |-
                id(g_yts_page) += 1;
                id(g_yts_selected_row) = -1;
                id(g_yts_selected_id) = "";
            - script.execute: yts_fetch_movies

interval:
  - interval: 120s
    then:
      - if:
          condition:
            lambda: 'return id(g_yts_page_active);'
          then:
            - script.execute: yts_poll_health

lvgl:
  pages:
    - id: yts_page
      bg_color: "${c_page_bg}"
      on_load:
        - lambda: |-
            id(g_yts_page_active) = true;
            if (id(g_lvgl_ready))
              lv_label_set_text(id(yts_sort_lbl), id(g_yts_sort) ? "Sort: Release" : "Sort: Latest");
        - script.execute: yts_fetch_movies
      on_unload:
        - lambda: |-
            id(g_yts_page_active) = false;
            id(g_yts_busy) = false;
            if (id(g_lvgl_ready)) lv_obj_add_flag(id(yts_info_overlay), LV_OBJ_FLAG_HIDDEN);
