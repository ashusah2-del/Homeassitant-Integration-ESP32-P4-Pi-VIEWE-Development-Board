          if (!id(g_lvgl_ready)) return;
          // Every LVGL page is scrollable by default. A tap with a little
          // finger jitter on a scrollable object can get read as the start
          // of a scroll gesture instead of a click, which silently
          // swallows the tap — no visible feedback, the button just
          // doesn't fire. slideshow_page had its own dedicated fix
          // (apply_slideshow_layout_positions, for a different visible
