# ── Audio hardware (verified against the vendor BSP for this exact board:
# examples/esp-idf/10_7inch_lvgl_demo_v9/components/esp32_p4_ultra) ──
#
# The original config used GPIO9-13/48 on one shared bus — pins from some
# other board entirely. The mic delivered pure digital zeros (verified by
# capturing the raw voice stream: peak=0, rms=0.0 over 13 s), so no wake
# word engine anywhere ever had a chance. The real hardware is:
#   * MSM261D PDM microphone: CLK GPIO26, DATA GPIO27 (PDM RX on I2S0 —
#     needs the my_components/i2s_audio PDM-on-P4 validation patch)
#   * NS4168 I2S amp: LRCLK GPIO32, BCLK GPIO33, SDATA GPIO34, 48 kHz mono
#     MSB slot format, CTRL pin GPIO31 held high
# Separate controllers, so mic and speaker never contend for a bus.
i2s_audio:
  # Mic bus first so it claims I2S_NUM_0 (the PDM-RX-capable controller).
  # In PDM mode the lrclk pin is the PDM clock.
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO26
  - id: i2s_spk_bus
    i2s_lrclk_pin: GPIO32
    i2s_bclk_pin: GPIO33

# TEMPORARY — gates the one-shot mic hardware test below. Remove once
# the mic test is confirmed and torn down.
globals:
  - id: g_mic_test_started
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: gpio
    name: "Speaker Enable"
    icon: mdi:speaker
    pin: GPIO31
    restore_mode: ALWAYS_ON

microphone:
  - platform: i2s_audio
    id: panel_mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO27
    pdm: true
    # channel: left — matches the vendor BSP, whose PDM mic init uses
    # I2S_PDM_RX_SLOT_DEFAULT_CONFIG(16BIT, MONO) → default slot_mask
    # I2S_PDM_SLOT_LEFT (esp32_p4_ultra/bsp_audio_codec_microphone_init and
    # examples/esp-idf/04-mic_msm261d). So this is the BSP-correct slot.
    #
    # STATUS 2026-08-05: even at FULL BSP parity — pins GPIO26/27,
    # I2S_ROLE_MASTER, I2S_PDM_RX_CLK_DEFAULT_CONFIG (bclk_div=8, fixed in
    # my_components/i2s_audio; the struct-literal previously left bclk_div=0),
    # MONO/LEFT slot — the mic_test still reads peak=0 rms=0 with samples
    # flowing (16128/s). Config now identical to the known-good BSP, so the
    # remaining suspects are hardware (this unit's MSM261D) or an ESPHome
    # DMA-read-path difference vs raw i2s_channel_read. Next isolation step:
    # flash the raw BSP mic example (04-mic_msm261d) to confirm hardware, or
    # test the OTHER panel to see if it's unit-specific.
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    # TEMPORARY mic hardware test — independent of voice_assistant/HA, so
    # it works even while HA is unreachable. Logs peak amplitude and RMS
    # of the raw PCM stream once per second. Remove once confirmed.
    on_data:
      - lambda: |-
          static uint32_t last_log = 0;
          static int32_t peak = 0;
          static int64_t sumsq = 0;
          static int count = 0;
          const int16_t *samples = reinterpret_cast<const int16_t *>(x.data());
          size_t n = x.size() / 2;
          for (size_t i = 0; i < n; i++) {
            int16_t s = samples[i];
            int32_t a = s < 0 ? -s : s;
            if (a > peak) peak = a;
            sumsq += (int64_t) s * s;
            count++;
          }
          uint32_t now = millis();
          if (now - last_log > 1000) {
            double rms = count > 0 ? sqrt((double) sumsq / (double) count) : 0.0;
            ESP_LOGW("mic_test", "peak=%d rms=%.1f samples=%d", (int) peak, rms, count);
            peak = 0;
            sumsq = 0;
            count = 0;
            last_log = now;
          }

speaker:
  - platform: i2s_audio
    id: panel_spk
    i2s_audio_id: i2s_spk_bus
    i2s_dout_pin: GPIO34
    dac_type: external
    # stand_msb → the new driver's "msb" slot config, matching the vendor's
    # I2S_STD_MSB_SLOT_DEFAULT_CONFIG for the NS4168.
    i2s_comm_fmt: stand_msb
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000

media_player:
  - platform: speaker
    name: "Speaker"
    id: panel_media_player
    announcement_pipeline:
      speaker: panel_spk
      format: FLAC

# ── Wake word architecture: HA-side streaming (openwakeword on the Pi) ──
#
# The panel streams mic audio continuously to HA; the pipeline's
# wake_word_entity (wake_word.openwakeword, model okay_nabu) does the
# detection. This is the architecture that worked until 2026-06-12.
#
# Do NOT go back to on-device micro_wake_word without re-testing hard:
#  * mWW's TFLite inference starves on this P4 next to the LVGL UI
#    (loop times of 800 ms – 5 s) — it never detected a single wake word
#    in a month of the June/July configs.
#  * voice_assistant's `micro_wake_word:` link does NOT start the pipeline
#    on detection (it only reports wake-word config to HA); the handoff
#    needs an explicit voice_assistant.start.
#  * mWW holds the mic open, and mic+speaker share one exclusive-lock I2S
#    bus — any media_player playback deadlocks unless mWW is stopped first.
# With VA as the SOLE mic consumer, its own state machine releases the mic
# before TTS/announcement playback (State::STOP_MICROPHONE), so no manual
# bus handoff is needed anywhere.
#
# NOTE for future debugging: never call get_voice_assistant_configuration
# from an API client that hasn't subscribed as the voice client — the
# device firmware answers it with a null active_wake_words pointer and
# CRASHES (Load access fault in VoiceAssistantConfigurationResponse).
script:
  - id: ensure_assist_streaming
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(g_ha_connected);'
              - not:
                  voice_assistant.is_running:
                    id: panel_va
          then:
            - voice_assistant.start_continuous:
                id: panel_va
            - logger.log:
                level: INFO
                tag: wake_word
                format: "Assist mic streaming to HA (openwakeword) started"

voice_assistant:
  id: panel_va
  microphone: panel_mic
  media_player: panel_media_player
  use_wake_word: true
  on_client_connected:
    - script.execute: ensure_assist_streaming
    - script.execute: va_ui_set_ready
  on_client_disconnected:
    # Assist pipeline can reconnect independently of the ESPHome API. Keep
    # streaming armed while HA is still connected.
    - if:
        condition:
          lambda: 'return id(g_ha_connected);'
        then:
          - script.execute: ensure_assist_streaming
          - script.execute: va_ui_set_ready
        else:
          - voice_assistant.stop:
              id: panel_va
          - script.execute: va_ui_set_offline
  # Fired by HA when openwakeword spots "Okay Nabu" in the stream.
  on_wake_word_detected:
    - logger.log:
        level: INFO
        tag: wake_word
        format: "Okay Nabu heard — Assist listening"
    - script.execute: va_ui_set_listening
  on_stt_end:
    - script.execute: va_ui_set_thinking
  # TTS responses play on the panel's own media player (configured above).
  on_tts_start:
    - script.execute: va_ui_set_speaking
  on_end:
    - script.execute: va_ui_set_ready
    - script.execute: ensure_assist_streaming
  on_error:
    - script.execute: va_ui_set_error
    - delay: 3s
    - script.execute: ensure_assist_streaming
    - script.execute: va_ui_set_ready

# Safety net: if streaming stops while HA is up (failed session, pipeline
# reconnect), restart it.
interval:
  - interval: 15s
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(g_ha_connected);'
              - not:
                  voice_assistant.is_running:
                    id: panel_va
          then:
            - logger.log:
                level: WARN
                tag: wake_word
                format: "Assist streaming idle while HA up — restarting"
            - script.execute: ensure_assist_streaming
            - script.execute: va_ui_set_ready
  # TEMPORARY mic hardware test — starts raw capture directly, independent
  # of voice_assistant/HA connectivity, so it works even while HA is down.
  # Fires once, ~2s after boot. Remove once confirmed working (along with
  # the on_data lambda on panel_mic and g_mic_test_started global).
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return !id(g_mic_test_started);'
          then:
            - globals.set: { id: g_mic_test_started, value: 'true' }
            - logger.log:
                level: WARN
                tag: mic_test
                format: "Starting mic capture test (independent of HA)"
            - microphone.capture: panel_mic

sensor:
  - platform: adc
    pin: GPIO53
    name: "Battery Voltage"
    id: panel_battery_voltage
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 15s
    unit_of_measurement: "V"
    filters:
      - multiply: 2.0
