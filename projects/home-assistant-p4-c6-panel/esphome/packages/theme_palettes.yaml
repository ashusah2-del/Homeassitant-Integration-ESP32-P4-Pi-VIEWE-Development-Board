      - script.execute: va_apply_current
      - lambda: |-
          if (!id(g_lvgl_ready) || !id(g_layout_edit_mode)) return;
          lv_obj_set_style_border_width(id(va_state_pill), 2, 0);
          lv_obj_set_style_border_color(id(va_state_pill), lv_color_hex((uint32_t) id(g_theme_accent)), 0);
      # Agenda's day-header rows derive their colors from g_theme_accent /
      # g_theme_accent_bg / g_theme_text_secondary at render time rather than
      # being statically themed above (their role changes every render), so
      # a fresh render is needed whenever the theme changes.
      - script.execute: render_calendar

  - id: va_apply_current
    mode: restart
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;

          uint32_t ready_bg = (uint32_t) id(g_theme_accent_bg);
          uint32_t ready_border = (uint32_t) id(g_theme_va_ready_border);
          uint32_t ready_fg = (uint32_t) id(g_theme_accent);
          uint32_t listen_bg = (uint32_t) id(g_theme_va_listen_bg);
          uint32_t listen_fg = (uint32_t) id(g_theme_va_listen_fg);
          uint32_t think_bg = (uint32_t) id(g_theme_va_think_bg);
          uint32_t think_fg = (uint32_t) id(g_theme_va_think_fg);
          uint32_t speak_bg = (uint32_t) id(g_theme_va_speak_bg);
          uint32_t speak_fg = (uint32_t) id(g_theme_va_speak_fg);
          uint32_t speak_text = (uint32_t) id(g_theme_va_speak_text);
          uint32_t offline_bg = (uint32_t) id(g_theme_va_offline_bg);
          uint32_t offline_fg = (uint32_t) id(g_theme_va_offline_fg);
          uint32_t offline_text = (uint32_t) id(g_theme_va_offline_text);

          auto style_pill = [&](uint32_t bg, uint32_t border, uint32_t dot, uint32_t text, const char *label) {
            lv_obj_set_style_bg_color(id(va_state_pill), lv_color_hex(bg), 0);
            lv_obj_set_style_border_color(id(va_state_pill), lv_color_hex(border), 0);
            lv_obj_set_style_bg_color(id(va_state_dot), lv_color_hex(dot), 0);
            lv_obj_set_style_bg_opa(id(va_state_dot), LV_OPA_COVER, 0);
            lv_label_set_text(id(va_state_label), label);
            lv_obj_set_style_text_color(id(va_state_label), lv_color_hex(text), 0);
          };

          auto show_mic = [&](uint32_t bg, uint32_t fg, const char *label) {
            lv_obj_set_style_bg_color(id(va_mic_overlay), lv_color_hex(bg), 0);
            lv_obj_set_style_border_color(id(va_mic_overlay), lv_color_hex(fg), 0);
            lv_obj_set_style_img_recolor(id(va_mic_icon), lv_color_hex(fg), 0);
            lv_obj_set_style_img_recolor_opa(id(va_mic_icon), LV_OPA_COVER, 0);
            lv_label_set_text(id(va_mic_label), label);
            lv_obj_set_style_text_color(id(va_mic_label), lv_color_hex(fg), 0);
            lv_obj_clear_flag(id(va_mic_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(va_mic_overlay));
          };

          switch (id(g_va_ui_state)) {
            default:
            case 0:
              style_pill(ready_bg, ready_border, ready_fg, ready_fg, "Wake: Ready");
              lv_obj_add_flag(id(va_mic_overlay), LV_OBJ_FLAG_HIDDEN);
              break;
            case 1:
              style_pill(offline_bg, offline_fg, offline_fg, offline_text, "Wake: HA Offline");
              lv_obj_add_flag(id(va_mic_overlay), LV_OBJ_FLAG_HIDDEN);
              break;
            case 6:
              style_pill(listen_bg, listen_fg, listen_fg, listen_fg, "Wake: Heard");
              lv_obj_add_flag(id(va_mic_overlay), LV_OBJ_FLAG_HIDDEN);
              break;
            case 2:
              style_pill(listen_bg, listen_fg, listen_fg, listen_fg, "Wake: Listening");
              show_mic(listen_bg, listen_fg, "Listening...");
              break;
            case 3:
              style_pill(think_bg, think_fg, think_fg, think_fg, "Wake: Thinking");
              show_mic(think_bg, think_fg, "Thinking...");
              break;
            case 4:
              style_pill(speak_bg, speak_fg, speak_fg, speak_text, "Wake: Speaking");
              show_mic(speak_bg, speak_fg, "Responding...");
              break;
            case 5:
              style_pill(offline_bg, offline_fg, offline_fg, offline_text, "Wake: Error");
              lv_obj_add_flag(id(va_mic_overlay), LV_OBJ_FLAG_HIDDEN);
              break;
          }

          if (id(g_va_ui_state) == 0 && id(g_va_indicator_pulse)) {
            lv_obj_set_style_bg_opa(
              id(va_state_dot),
              id(g_va_indicator_phase) ? LV_OPA_COVER : LV_OPA_40,
              0
            );
          }

  - id: va_ui_set_ready
    mode: restart
    then:
      - lambda: |-
          id(g_va_ui_state) = 0;
          id(g_va_indicator_pulse) = true;
          id(g_va_indicator_phase) = false;
      - script.execute: va_apply_current

  - id: va_ui_set_offline
    mode: restart
    then:
      - lambda: |-
          id(g_va_ui_state) = 1;
          id(g_va_indicator_pulse) = false;
      - script.execute: va_apply_current

  - id: va_ui_set_heard
    mode: restart
    then:
      - lambda: |-
          id(g_va_ui_state) = 6;
          id(g_va_indicator_pulse) = false;
      - script.execute: va_apply_current

  - id: va_ui_set_listening
    mode: restart
    then:
      - lambda: |-
