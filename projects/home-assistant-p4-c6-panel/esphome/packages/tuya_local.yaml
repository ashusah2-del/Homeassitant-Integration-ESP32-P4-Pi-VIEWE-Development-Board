                id(g_tuya_garden_on) = false; id(g_tuya_garden_online) = true;
            - script.execute: tuya_apply_ui
            - http_request.post:

                url: "${tuya_bridge_url}/simple/1571285350029127c9f3/off"
                body: ""
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) { id(g_tuya_garden_online) = false; }
                        id(g_tuya_busy) = false;
                        id(tuya_apply_ui).execute();
                on_error:
                  then:
                    - lambda: |-
                        id(g_tuya_garden_online) = false;
                        id(g_tuya_busy) = false;
                        id(tuya_apply_ui).execute();


interval:
  - interval: 60s
    then:
      - script.execute: tuya_poll_health

