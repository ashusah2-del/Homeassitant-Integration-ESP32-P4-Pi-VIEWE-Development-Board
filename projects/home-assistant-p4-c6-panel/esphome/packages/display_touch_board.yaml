  - id: apply_slideshow_layout_visibility
    mode: restart
    then:
      - lambda: |-
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            if (hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };
          set_hidden(id(calendar_panel), !id(g_layout_calendar_visible));
          set_hidden(id(weather_widget), !id(g_layout_weather_visible));
          set_hidden(id(clock_pill_obj), !id(g_layout_clock_visible));
          set_hidden(id(va_state_pill), !id(g_layout_wake_visible));
          set_hidden(id(slideshow_layout_btn),
            !id(g_layout_bubble_visible) || id(g_layout_edit_mode));

          lv_label_set_text(id(layout_calendar_toggle_lbl), id(g_layout_calendar_visible) ? "Hide" : "Show");
          lv_label_set_text(id(layout_weather_toggle_lbl), id(g_layout_weather_visible) ? "Hide" : "Show");
          lv_label_set_text(id(layout_clock_toggle_lbl), id(g_layout_clock_visible) ? "Hide" : "Show");
          lv_label_set_text(id(layout_wake_toggle_lbl), id(g_layout_wake_visible) ? "Hide" : "Show");
          lv_label_set_text(id(layout_bubble_toggle_lbl), id(g_layout_bubble_visible) ? "Hide" : "Show");

  # Renders the current "page" of calendar events into whichever of the 4
  # style subtrees (cal_rows_box/cal_agenda_box/cal_compact_box/
  # cal_timeline_box) is selected by g_calendar_style — the other 3 are
  # hidden. The HA on_value handler caches the full string in
  # g_calendar_events_full and zeroes the page; the 30-second cycle
  # interval increments g_calendar_page and re-calls this script so the
  # user sees later events without having to interact with the panel.
  - id: render_calendar
    mode: single
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;

          lv_obj_add_flag(id(cal_rows_box),     LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(cal_agenda_box),   LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(cal_compact_box),  LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(cal_timeline_box), LV_OBJ_FLAG_HIDDEN);

          int style = id(g_calendar_style);
          if (style < 0 || style > 3) style = 0;

          // Split the cached events string into a vector of non-empty,
          // dash-cleaned lines. Every event line's first whitespace token is
          // always a 3-letter weekday abbreviation (Mon..Sun); everything
          // after it is an opaque display string whose exact shape differs
          // slightly between the two upstream producers.
          std::vector<std::string> events;
          const std::string& full = id(g_calendar_events_full);
          size_t pos = 0;
          while (pos < full.size()) {
            size_t nl = full.find('\n', pos);
            size_t end = (nl == std::string::npos) ? full.size() : nl;
            if (end > pos) {
              std::string ev = full.substr(pos, end - pos);
              // Replace en-dash (U+2013, UTF-8: E2 80 93) and em-dash (U+2014, UTF-8: E2 80 94)
              // with ASCII hyphen — LVGL built-in fonts don't include these glyphs.
              for (size_t p = 0; p + 2 < ev.size(); ) {
                if ((unsigned char)ev[p] == 0xE2 && (unsigned char)ev[p+1] == 0x80 &&
                    ((unsigned char)ev[p+2] == 0x93 || (unsigned char)ev[p+2] == 0x94)) {
                  ev.replace(p, 3, "-");
                } else { p++; }
              }
              events.push_back(ev);
            }
            pos = (nl == std::string::npos) ? full.size() : nl + 1;
          }
          int total = (int)events.size();

          auto split_wd = [](const std::string& line, std::string& wd, std::string& rest) {
            size_t sp = line.find(' ');
            if (sp == std::string::npos) { wd = line; rest = ""; }
            else { wd = line.substr(0, sp); rest = line.substr(sp + 1); }
          };
          auto upper = [](std::string s) {
            for (auto& c : s) c = (char) toupper((unsigned char) c);
            return s;
          };

          char pagebuf[16] = "";

          if (style == 0 || style == 2) {
            // Ribbon (N=8) and Compact (N=12) — identical flat-list logic,
            // 1 slot = 1 event.
            const int N = (style == 0) ? 8 : 12;
            lv_obj_t* ribbon_labels[8] = {
              id(cal_evt_0), id(cal_evt_1), id(cal_evt_2), id(cal_evt_3),
              id(cal_evt_4), id(cal_evt_5), id(cal_evt_6), id(cal_evt_7)
            };
            lv_obj_t* ribbon_rows[8] = {
              id(cal_row_0), id(cal_row_1), id(cal_row_2), id(cal_row_3),
              id(cal_row_4), id(cal_row_5), id(cal_row_6), id(cal_row_7)
            };
            lv_obj_t* compact_labels[12] = {
              id(cal_cm_lbl_0), id(cal_cm_lbl_1), id(cal_cm_lbl_2), id(cal_cm_lbl_3),
              id(cal_cm_lbl_4), id(cal_cm_lbl_5), id(cal_cm_lbl_6), id(cal_cm_lbl_7),
              id(cal_cm_lbl_8), id(cal_cm_lbl_9), id(cal_cm_lbl_10), id(cal_cm_lbl_11)
            };
            lv_obj_t* compact_rows[12] = {
              id(cal_cm_row_0), id(cal_cm_row_1), id(cal_cm_row_2), id(cal_cm_row_3),
              id(cal_cm_row_4), id(cal_cm_row_5), id(cal_cm_row_6), id(cal_cm_row_7),
              id(cal_cm_row_8), id(cal_cm_row_9), id(cal_cm_row_10), id(cal_cm_row_11)
            };
            lv_obj_t** labels = (style == 0) ? ribbon_labels : compact_labels;
            lv_obj_t** rows   = (style == 0) ? ribbon_rows   : compact_rows;

            int pages = (total + N - 1) / N;
            if (pages <= 0) pages = 1;
            if (id(g_calendar_page) >= pages) id(g_calendar_page) = 0;
            if (id(g_calendar_page) < 0)      id(g_calendar_page) = 0;
            int page = id(g_calendar_page);

            for (int i = 0; i < N; i++) {
              int idx = page * N + i;
              if (total == 0 && i == 0) {
                lv_label_set_text(labels[i], "No events this week");
                lv_obj_clear_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              } else if (idx < total) {
                lv_label_set_text(labels[i], events[idx].c_str());
                lv_obj_clear_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_label_set_text(labels[i], "");
                lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              }
            }
            if (pages > 1) snprintf(pagebuf, sizeof(pagebuf), "%d/%d", page + 1, pages);
            lv_obj_clear_flag(style == 0 ? id(cal_rows_box) : id(cal_compact_box), LV_OBJ_FLAG_HIDDEN);

          } else if (style == 3) {
            // Timeline — 4 cards, 1 slot = 1 event.
            const int N = 4;
            lv_obj_t* cards[4] = { id(cal_tl_card_0), id(cal_tl_card_1), id(cal_tl_card_2), id(cal_tl_card_3) };
            lv_obj_t* times[4] = { id(cal_tl_time_0), id(cal_tl_time_1), id(cal_tl_time_2), id(cal_tl_time_3) };
            lv_obj_t* sums[4]  = { id(cal_tl_sum_0),  id(cal_tl_sum_1),  id(cal_tl_sum_2),  id(cal_tl_sum_3)  };

            int pages = (total + N - 1) / N;
            if (pages <= 0) pages = 1;
            if (id(g_calendar_page) >= pages) id(g_calendar_page) = 0;
            if (id(g_calendar_page) < 0)      id(g_calendar_page) = 0;
            int page = id(g_calendar_page);

            for (int i = 0; i < N; i++) {
              int idx = page * N + i;
              if (total == 0 && i == 0) {
                lv_label_set_text(times[i], "");
                lv_label_set_text(sums[i], "No events this week");
                lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
              } else if (idx < total) {
                std::string wd, rest;
                split_wd(events[idx], wd, rest);
                lv_label_set_text(times[i], upper(wd).c_str());
                lv_label_set_text(sums[i], rest.empty() ? events[idx].c_str() : rest.c_str());
                lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_label_set_text(times[i], "");
                lv_label_set_text(sums[i], "");
                lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
              }
            }
            if (pages > 1) snprintf(pagebuf, sizeof(pagebuf), "%d/%d", page + 1, pages);
            lv_obj_clear_flag(id(cal_timeline_box), LV_OBJ_FLAG_HIDDEN);

          } else {
            // Agenda (style 1) — a pool of 10 generic rows shared between
            // day-header entries and event entries. Build a flat list first
            // (header inserted whenever the weekday token changes going down
            // the already-sorted list), then greedily fill pages of 10 slots
            // with 1-slot look-ahead so a header is never stranded alone at
            // the bottom of a page.
            const int AGENDA_SLOTS = 10;
            lv_obj_t* rows[AGENDA_SLOTS] = {
              id(cal_ag_row_0), id(cal_ag_row_1), id(cal_ag_row_2), id(cal_ag_row_3), id(cal_ag_row_4),
              id(cal_ag_row_5), id(cal_ag_row_6), id(cal_ag_row_7), id(cal_ag_row_8), id(cal_ag_row_9)
            };
            lv_obj_t* labels[AGENDA_SLOTS] = {
              id(cal_ag_lbl_0), id(cal_ag_lbl_1), id(cal_ag_lbl_2), id(cal_ag_lbl_3), id(cal_ag_lbl_4),
              id(cal_ag_lbl_5), id(cal_ag_lbl_6), id(cal_ag_lbl_7), id(cal_ag_lbl_8), id(cal_ag_lbl_9)
            };

            struct AgendaItem { bool isHeader; std::string text; };
            std::vector<AgendaItem> items;
            std::string prevWd;
            for (int i = 0; i < total; i++) {
              std::string wd, rest;
              split_wd(events[i], wd, rest);
              if (i == 0 || wd != prevWd) {
                items.push_back(AgendaItem{true, upper(wd)});
                prevWd = wd;
              }
              items.push_back(AgendaItem{false, events[i]});
            }
            if (items.empty()) items.push_back(AgendaItem{false, "No events this week"});

            std::vector<int> pageStarts{0};
            int slot = 0;
            for (int idx = 0; idx < (int)items.size(); idx++) {
              bool lastSlot = (slot == AGENDA_SLOTS - 1);
              if (items[idx].isHeader && lastSlot) {
                pageStarts.push_back(idx);
                slot = 0;
              }
              slot++;
              if (slot == AGENDA_SLOTS) {
                if (idx + 1 < (int)items.size()) pageStarts.push_back(idx + 1);
                slot = 0;
              }
            }
            int pages = (int)pageStarts.size();
            if (id(g_calendar_page) >= pages) id(g_calendar_page) = 0;
            if (id(g_calendar_page) < 0)      id(g_calendar_page) = 0;
            int page = id(g_calendar_page);
            int start = pageStarts[page];
            int end = (page + 1 < pages) ? pageStarts[page + 1] : (int)items.size();

            for (int i = 0; i < AGENDA_SLOTS; i++) {
              int idx = start + i;
              if (idx < end) {
                const AgendaItem& it = items[idx];
                lv_label_set_text(labels[i], it.text.c_str());
                if (it.isHeader) {
                  lv_obj_set_style_bg_opa(rows[i], LV_OPA_30, 0);
                  lv_obj_set_style_bg_color(rows[i], lv_color_hex(id(g_theme_accent_bg)), 0);
                  lv_obj_set_style_text_color(labels[i], lv_color_hex(id(g_theme_accent)), 0);
                  lv_obj_set_style_text_font(labels[i], &lv_font_montserrat_18, 0);
                  lv_obj_set_x(labels[i], 4);
                } else {
                  lv_obj_set_style_bg_opa(rows[i], LV_OPA_TRANSP, 0);
                  lv_obj_set_style_text_color(labels[i], lv_color_hex(id(g_theme_text_secondary)), 0);
                  lv_obj_set_style_text_font(labels[i], &lv_font_montserrat_16, 0);
                  lv_obj_set_x(labels[i], 16);
                }
                lv_obj_clear_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_label_set_text(labels[i], "");
                lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
              }
            }
            if (pages > 1) snprintf(pagebuf, sizeof(pagebuf), "%d/%d", page + 1, pages);
            lv_obj_clear_flag(id(cal_agenda_box), LV_OBJ_FLAG_HIDDEN);
          }

          lv_label_set_text(id(cal_page_lbl), pagebuf);

  # Re-fetch the current live camera frame (manual refresh only).
  - id: refresh_camera_live
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(g_camera_live_entity).empty();'
          then:
            - online_image.set_url:
                id: camera_live_img
                url: !lambda |-
                  char t[16];
                  snprintf(t, sizeof(t), "%lu", (unsigned long) millis());
                  return id(immich_base_url) + "/camera/" + id(g_camera_live_entity) +
                         "?size=full&t=" + t;
                update: true

  # Refresh a single camera thumbnail slot. URLs come from the g_camN_entity
  # globals (runtime overridable via /panel/config); empty slots are skipped.
  - id: refresh_cam_slot
    mode: queued
    max_runs: 5
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot > 3) return;
          online_image::OnlineImage *imgs[4] = {
            id(cam1_thumb), id(cam2_thumb), id(cam3_thumb), id(cam4_thumb),
          };
          std::string ents[4] = {
            id(g_cam1_entity), id(g_cam2_entity),
            id(g_cam3_entity), id(g_cam4_entity),
          };
          if (ents[slot].empty()) return;
          char t[16];
          snprintf(t, sizeof(t), "%lu", (unsigned long) millis());
          imgs[slot]->set_url(id(immich_base_url) + "/camera/" + ents[slot] +
                              "?size=thumb&t=" + t);
          imgs[slot]->update();

  # Camera thumbs only when HA is up — background polling while HA is offline
  # was blocking the single online_image HTTP slot and starving the slideshow.
  # Polls stay strictly sequential (400 ms apart) — parallel HTTP requests
  # crash the panel (see CLAUDE.md gotchas).
  - id: refresh_camera_thumbs
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(g_ha_connected);'
          then:
            - script.execute: { id: refresh_cam_slot, slot: 0 }
            - delay: 400ms
            - script.execute: { id: refresh_cam_slot, slot: 1 }
            - delay: 400ms
            - script.execute: { id: refresh_cam_slot, slot: 2 }
            - delay: 400ms
            - script.execute: { id: refresh_cam_slot, slot: 3 }

  # Open the live view for a camera slot: swaps the shared camera_live_img
  # URL, retitles the page, and navigates. Entity comes from the runtime
  # globals so a hub config change needs no reflash.
  - id: open_camera_live
    mode: restart
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot > 3) return;
          std::string ents[4] = {
            id(g_cam1_entity), id(g_cam2_entity),
            id(g_cam3_entity), id(g_cam4_entity),
          };
          static const char *names[4] = {
            "${cam1_name}", "${cam2_name}", "${cam3_name}", "${cam4_name}",
          };
          if (ents[slot].empty()) return;
          id(g_camera_live_entity) = ents[slot];
          lv_label_set_text(id(camera_view_title), names[slot]);
          id(camera_live_img).set_url(id(immich_base_url) + "/camera/" +
                                      ents[slot] + "?size=full");
          id(camera_live_img).update();
      - globals.set: { id: g_on_camera_view, value: 'true' }
      - lvgl.page.show: camera_view_page

  # Fetches a random baseline JPEG from the local proxy and displays it.
  # The proxy (immich-proxy.service on the Docker host) handles Immich API calls
  # and re-encodes all images as guaranteed SOF0 baseline JPEG before serving.
  - id: refresh_immich_slideshow
    mode: restart
    then:
      - globals.set:
          id: g_using_fallback
          value: 'false'
      # Double-buffered slideshow: kick off the download into the slot
      # that's currently NOT on screen. The visible slot keeps painting
      # at full opacity throughout the fetch+decode (no exit animation
      # here). When the new buffer finishes, on_download_finished triggers
      # crossfade_to_active_slot, which runs the slide/fade/zoom on both
      # widgets simultaneously so the previous image overlaps the new
      # one mid-transition.
      - if:
          condition:
            lambda: 'return id(g_slideshow_slot) == 0;'
          then:
            - online_image.set_url:
                id: immich_photo_b
                url: !lambda |-
                  char t[16];
                  snprintf(t, sizeof(t), "%lu", (unsigned long) millis());
                  // Match the decode buffer (slideshow_canvas_w/h), not
                  // main_display.get_width()/get_height() which give the
                  // pre-rotation physical size — see refresh_immich_slideshow.
                  return id(immich_base_url) + "/random-photo?t=" + t +
                      "&w=${slideshow_canvas_w}&h=${slideshow_canvas_h}";
                update: true
          else:
            - online_image.set_url:
                id: immich_photo
                url: !lambda |-
                  char t[16];
                  snprintf(t, sizeof(t), "%lu", (unsigned long) millis());
                  // Match the decode buffer (slideshow_canvas_w/h), not
                  // main_display.get_width()/get_height() which give the
                  // pre-rotation physical size — see refresh_immich_slideshow.
                  return id(immich_base_url) + "/random-photo?t=" + t +
                      "&w=${slideshow_canvas_w}&h=${slideshow_canvas_h}";
                update: true

  # Crossfade the just-loaded slot in while the previously-visible slot
  # transitions out, with both animations running simultaneously so the
  # images overlap. g_slideshow_slot must already be set to the *new*
  # active slot before this script is executed. Effect (fade / slide /
  # zoom) is chosen via g_transition_effect from the settings cycler.
  - id: crossfade_to_active_slot
    mode: restart
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          bool a_active = (id(g_slideshow_slot) == 0);
          lv_obj_t* in  = a_active ? id(slideshow_img)   : id(slideshow_img_b);
          lv_obj_t* out = a_active ? id(slideshow_img_b) : id(slideshow_img);
          auto dsc = a_active ? id(immich_photo).get_lv_img_dsc()
                              : id(immich_photo_b).get_lv_img_dsc();
          // Repoint the incoming widget at the freshly decoded buffer
          // (LVGL 9: compile-time src binding doesn't re-resolve).
          lv_img_set_src(in, dsc);
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          const int H = lv_disp_get_ver_res(lv_disp_get_default());
          int final_x = 0, final_y = 0;
          if (dsc != nullptr && dsc->header.w > 0 && dsc->header.h > 0) {
            // Photo is full-bleed edge-to-edge; the calendar sidebar sits
            // on top of it as a translucent overlay (see stock_fallback_img
            // below for the same pattern), so center across the full
            // screen, not just the area to the right of the sidebar.
            final_x = (W - (int)dsc->header.w) / 2;
            final_y = (H - (int)dsc->header.h) / 2;
          }
          if (id(g_layout_edit_mode)) {
            lv_obj_clear_flag(in, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(out, LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_pos(in, final_x, final_y);
            lv_img_set_zoom(in, 256);
            lv_obj_set_style_opa(in, LV_OPA_COVER, 0);
            lv_obj_move_background(in);
            lv_obj_move_background(out);
            lv_obj_move_foreground(id(layout_edit_scrim));
            lv_obj_move_foreground(id(calendar_panel));
            lv_obj_move_foreground(id(weather_widget));
            lv_obj_move_foreground(id(clock_pill_obj));
            lv_obj_move_foreground(id(va_state_pill));
            lv_obj_move_foreground(id(layout_edit_bar));
            return;
          }
          // Both widgets must be visible during the transition. Use
          // move_background so they sit at the bottom of the slideshow
          // page's child stack — *behind* calendar_panel, clock_pill,
          // weather_widget, etc. The two background calls in this order
          // park 'out' at index 0 and 'in' at index 1, so 'in' still
          // renders on top of 'out' during the crossfade but both are
          // below every overlay widget.
          lv_obj_clear_flag(in,  LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(out, LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_background(in);
          lv_obj_move_background(out);

          const int T = 1500;
          int e = id(g_transition_effect);
          switch (e) {
            case 0: {  // Crossfade — new fades up while old fades out
              lv_obj_set_pos(in, final_x, final_y);
              lv_img_set_zoom(in, 256);
              lv_obj_set_style_opa(in, 0, 0);
              lv_obj_fade_in(in, T, 0);
              lv_obj_fade_out(out, T, 0);
              break;
            }
            case 1: case 2: case 3: case 4: {  // Slides — both translate
              // Slides cover the full 1024px width including the calendar area.
              // Temporarily make the calendar fully opaque so the image moving
              // under its 70% transparency doesn't make the whole screen appear
              // to slide. Restored after the animation by the ESPHome action below.
              lv_obj_set_style_opa(id(calendar_panel), LV_OPA_COVER, 0);
              int in_start_x = final_x, in_start_y = final_y;
              int out_start_x = lv_obj_get_x(out), out_start_y = lv_obj_get_y(out);
              int out_end_x = out_start_x, out_end_y = out_start_y;
              if (e == 1)      { in_start_x = W;  out_end_x = -W; }
              else if (e == 2) { in_start_x = -W; out_end_x = W;  }
              else if (e == 3) { in_start_y = H;  out_end_y = -H; }
              else             { in_start_y = -H; out_end_y = H;  }
              lv_obj_set_pos(in, in_start_x, in_start_y);
              lv_img_set_zoom(in, 256);
              lv_obj_set_style_opa(in, 255, 0);
              lv_obj_set_style_opa(out, 255, 0);
              // Animate incoming → final
              lv_anim_t ai;
              lv_anim_init(&ai);
              lv_anim_set_var(&ai, in);
              lv_anim_set_time(&ai, T);
              lv_anim_set_path_cb(&ai, lv_anim_path_ease_in_out);
              if (e == 1 || e == 2) {
                lv_anim_set_values(&ai, in_start_x, final_x);
                lv_anim_set_exec_cb(&ai, (lv_anim_exec_xcb_t)lv_obj_set_x);
              } else {
                lv_anim_set_values(&ai, in_start_y, final_y);
                lv_anim_set_exec_cb(&ai, (lv_anim_exec_xcb_t)lv_obj_set_y);
              }
              lv_anim_start(&ai);
              // Animate outgoing → off-screen
              lv_anim_t ao;
              lv_anim_init(&ao);
              lv_anim_set_var(&ao, out);
              lv_anim_set_time(&ao, T);
              lv_anim_set_path_cb(&ao, lv_anim_path_ease_in_out);
              if (e == 1 || e == 2) {
                lv_anim_set_values(&ao, out_start_x, out_end_x);
                lv_anim_set_exec_cb(&ao, (lv_anim_exec_xcb_t)lv_obj_set_x);
              } else {
                lv_anim_set_values(&ao, out_start_y, out_end_y);
                lv_anim_set_exec_cb(&ao, (lv_anim_exec_xcb_t)lv_obj_set_y);
              }
              lv_anim_start(&ao);
              break;
            }
            case 5: {  // Zoom — new grows + fades in, old shrinks + fades out
              lv_obj_set_pos(in, final_x, final_y);
              lv_img_set_zoom(in, 64);
              lv_obj_set_style_opa(in, 0, 0);
              lv_obj_fade_in(in, T, 0);
              lv_anim_t ai;
              lv_anim_init(&ai);
              lv_anim_set_var(&ai, in);
              lv_anim_set_time(&ai, T);
              lv_anim_set_path_cb(&ai, lv_anim_path_ease_in_out);
              lv_anim_set_values(&ai, 64, 256);
              lv_anim_set_exec_cb(&ai, (lv_anim_exec_xcb_t)lv_img_set_zoom);
              lv_anim_start(&ai);
              lv_obj_fade_out(out, T, 0);
              lv_anim_t ao;
              lv_anim_init(&ao);
              lv_anim_set_var(&ao, out);
              lv_anim_set_time(&ao, T);
              lv_anim_set_path_cb(&ao, lv_anim_path_ease_in_out);
              lv_anim_set_values(&ao, 256, 64);
              lv_anim_set_exec_cb(&ao, (lv_anim_exec_xcb_t)lv_img_set_zoom);
              lv_anim_start(&ao);
              break;
            }
          }
          // The lv_anim_t callbacks invalidate dirty rects per frame; an
          // extra explicit invalidate here would force a second full
          // redraw on top of every step and contributes to flicker.
      # Wait for the slide animation to finish, then restore the calendar's
      # configured opacity. Only runs for slide effects (1-4); crossfade/zoom
      # leave the calendar at its configured opacity throughout.
      - if:
          condition:
            lambda: 'return id(g_transition_effect) >= 1 && id(g_transition_effect) <= 4;'
          then:
            - delay: 1600ms
            - lambda: |-
                if (!id(g_lvgl_ready)) return;
                int pct = id(g_calendar_opa_pct);
                if (pct < 0) pct = 0;
                if (pct > 100) pct = 100;
                lv_obj_set_style_opa(id(calendar_panel), (uint32_t)((pct * 255) / 100), 0);

  # Shows the next embedded stock image (cycles through 2 pre-downloaded images).
  # No internet required — images are stored in device flash at build time.
  - id: try_fallback_image
    mode: single
    then:
      - globals.set:
          id: g_using_fallback
          value: 'true'
      - lambda: |-
          id(g_stock_idx) = (id(g_stock_idx) + 1) % 2;
          lv_obj_t* stock_imgs[2] = {
            id(stock_fallback_img_0), id(stock_fallback_img_1),
          };
          for (int i = 0; i < 2; i++) {
            if (i == id(g_stock_idx))
              lv_obj_clear_flag(stock_imgs[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(stock_imgs[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_clear_flag(id(stock_fallback_img), LV_OBJ_FLAG_HIDDEN);
          // Hide both slideshow slots so the stock image is unobstructed.
          lv_obj_add_flag(id(slideshow_img),   LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slideshow_img_b), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(slideshow_placeholder_obj), LV_OBJ_FLAG_HIDDEN);

interval:
  # Retry Immich when the slideshow previously failed (e.g. HTTP slot was busy).
  - interval: 2min
    then:
      - if:
          condition:
            lambda: 'return !id(g_immich_ok) && !id(g_using_fallback);'
          then:
            - script.execute: refresh_immich_slideshow

  # Camera grid thumbs — only when HA is connected (needs camera_proxy).
  - interval: 90s
    then:
      - if:
          condition:
            lambda: 'return id(g_ha_connected);'
          then:
            - script.execute: refresh_camera_thumbs

  # Slideshow refresh — fires every minute, only executes the refresh
  # script once the per-minute counter reaches the configured interval
  # (g_slideshow_interval_min). The interval is sourced from HA's
  # input_number.panel_slideshow_interval helper so it's runtime-tunable.
  - interval: 1min
    then:
      - lambda: |-
          id(g_slideshow_counter_min)++;
          if (id(g_slideshow_counter_min) >= id(g_slideshow_interval_min)) {
            id(g_slideshow_counter_min) = 0;
            id(refresh_immich_slideshow).execute();
          }

  # Calendar pagination — every 30 s the page index advances; the script
  # wraps it to 0 once we run out of events, and resets cal_page_lbl to
  # "" automatically when there's only one page so the indicator just
  # disappears if nothing's overflowing.
  - interval: 30s
    then:
      - lambda: 'id(g_calendar_page)++;'
      - script.execute: render_calendar

  # (Removed) Live-view auto-refresh — the 3-second interval kept
  # g_on_camera_view stuck true after the page closed and hammered the
  # panel with 800×500 JPEG decodes, eventually crashing it with
  # "Instruction address misaligned". Live view now refreshes only when
  # the user taps a camera tile.

  - interval: 1s
    then:
      - lambda: |-
          if (id(g_lvgl_ready) && id(g_va_indicator_pulse)) {
            id(g_va_indicator_phase) = !id(g_va_indicator_phase);
            lv_obj_set_style_bg_opa(
              id(va_state_dot),
              id(g_va_indicator_phase) ? LV_OPA_COVER : LV_OPA_40,
              0
            );
          }
      - lambda: |-
          // Pulse the energy-flow arrows so the diagram reads as live
          // movement rather than a static schematic. Style-only writes on
          // three labels — negligible even when the page isn't visible.
          if (!id(g_lvgl_ready)) return;
          static bool flow_phase = false;
          flow_phase = !flow_phase;
          lv_opa_t o = flow_phase ? LV_OPA_COVER : LV_OPA_30;
          lv_obj_set_style_opa(id(energy_arrow_grid), o, 0);
          lv_obj_set_style_opa(id(energy_arrow_solar), o, 0);
          lv_obj_set_style_opa(id(energy_arrow_battery), o, 0);
      - lvgl.label.update:
          id: slideshow_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[6];
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);
      - lvgl.label.update:
          id: slideshow_date_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("---");
            static const char *wd[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
            static const char *mo[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
            // ESPTime::day_of_week is 1..7 (Sunday=1) — must subtract 1 to index a
            // 0-based 7-element array. wd[7] is out-of-bounds → crash on Saturdays.
            int wi = (int)t.day_of_week - 1;
            int mi = (int)t.month - 1;
            if (wi < 0 || wi > 6) wi = 0;
            if (mi < 0 || mi > 11) mi = 0;
            char b[20];
            snprintf(b, sizeof(b), "%s %02d %s", wd[wi], t.day_of_month, mo[mi]);
            return std::string(b);
      - lvgl.label.update:
          id: cal_today_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("---");
            static const char *wd[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
            static const char *mo[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
            int wi = (int)t.day_of_week - 1;
            int mi = (int)t.month - 1;
            if (wi < 0 || wi > 6) wi = 0;
            if (mi < 0 || mi > 11) mi = 0;
            char b[24];
            snprintf(b, sizeof(b), "%s %02d %s %04d", wd[wi], t.day_of_month, mo[mi], t.year);
            return std::string(b);
      - lvgl.label.update:
          id: dash_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[6];
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);
      - lvgl.label.update:
          id: dash_date
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("---");
            static const char *wd[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
            static const char *mo[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
            int wi = (int)t.day_of_week - 1;
            int mi = (int)t.month - 1;
            if (wi < 0 || wi > 6) wi = 0;
            if (mi < 0 || mi > 11) mi = 0;
            char b[24];
            snprintf(b, sizeof(b), "%s %02d %s %04d", wd[wi], t.day_of_month, mo[mi], t.year);
            return std::string(b);
      - lvgl.label.update:
          id: dash_rssi
          text: !lambda |-
            char b[12];
            snprintf(b, sizeof(b), "%.0f dBm", id(panel_wifi_rssi).state);
            return std::string(b);
      - lvgl.label.update:
          id: settings_ha_lbl
          text: !lambda |-
            return id(g_ha_connected) ? std::string("Home Assistant: Connected") : std::string("Home Assistant: Disconnected");
      - lvgl.label.update:
          id: settings_immich_lbl
          text: !lambda |-
            return id(g_immich_ok) ? std::string("Immich: Online") : std::string("Immich: Offline");
      - lvgl.label.update:
          id: settings_ip_lbl
          text: !lambda |-
            auto ip = id(wifi_ip_addr).state;
            return std::string("Device IP: ") + (ip.empty() ? "--" : ip);
      - lvgl.label.update:
          id: settings_rssi_lbl
          text: !lambda |-
            char b[24];
            snprintf(b, sizeof(b), "Signal: %.0f dBm", id(panel_wifi_rssi).state);
            return std::string(b);
      - lvgl.label.update:
          id: settings_battery_lbl
          text: !lambda |-
            char b[32];
            snprintf(b, sizeof(b), "Battery: %.2f V", id(panel_battery_voltage).state);
            return std::string(b);
      - lvgl.label.update:
          id: settings_uptime_lbl
          text: !lambda |-
            int s = (int)id(panel_uptime).state;
            int h = s / 3600;
            int m = (s % 3600) / 60;
            char b[32];
            snprintf(b, sizeof(b), "Uptime: %dh %02dm", h, m);
            return std::string(b);
      - lvgl.label.update:
          id: settings_firmware_lbl
          text: "Firmware: v${firmware_version}"
      - lvgl.label.update:
          id: settings_tuya_lbl
          text: !lambda |-
            return id(g_tuya_bridge_ok) ? std::string("Tuya bridge: Online")
                                         : std::string("Tuya bridge: Offline");
      - lvgl.label.update:
          id: settings_immich_url_val
          text: !lambda |-
            return id(immich_base_url).empty() ? std::string("--") : id(immich_base_url);

display:
  - platform: mipi_dsi
    id: main_display
    model: ${lcd_model}
    reset_pin:
      number: ${lcd_reset_pin}
    hsync_pulse_width: 20
    rotation: "${rotate_display}"

touchscreen:
  - platform: ${touch_platform}
    id: main_touch
    display: main_display
    i2c_id: bus_a
    interrupt_pin: GPIO21
    reset_pin: GPIO22
    transform:
      swap_xy: ${ts_swap_xy}
      mirror_x: ${ts_mirror_x}
      mirror_y: ${ts_mirror_y}
    on_touch:
      then:
        - binary_sensor.template.publish:
            id: panel_touch_input
            state: ON
        # TEMPORARY touch-jitter diagnostic — see globals block above.
        - lambda: |-
            if (!id(g_touch_active)) {
              id(g_touch_active) = true;
              id(g_touch_start_x) = touch.x;
              id(g_touch_start_y) = touch.y;
              id(g_touch_max_delta) = 0;
              id(g_touch_samples) = 0;
            }
            id(g_touch_samples) += 1;
            int dx = touch.x - id(g_touch_start_x);
            int dy = touch.y - id(g_touch_start_y);
            int dist2 = dx * dx + dy * dy;
            if (dist2 > id(g_touch_max_delta)) id(g_touch_max_delta) = dist2;
            ESP_LOGW("touch_jitter", "sample=%d x=%d y=%d dx=%d dy=%d",
                     id(g_touch_samples), touch.x, touch.y, dx, dy);
    on_update:
      then:
        # TEMPORARY touch-jitter diagnostic — on_touch only fires once, at the
        # start of a gesture. on_update fires on every real coordinate change
        # while held, AND once more at the moment of release — this is the
        # only way to see the actual release-time coordinate and detect any
        # movement between press and release.
        - lambda: |-
            if (touches.empty()) return;
            auto &tp = touches[0];
            int dx = tp.x - id(g_touch_start_x);
            int dy = tp.y - id(g_touch_start_y);
            ESP_LOGW("touch_jitter", "UPDATE state=%d x=%d y=%d dx=%d dy=%d",
                     tp.state, tp.x, tp.y, dx, dy);
    on_release:
      then:
        - binary_sensor.template.publish:
            id: panel_touch_input
            state: OFF
        # TEMPORARY touch-jitter diagnostic — see globals block above.
        - lambda: |-
            ESP_LOGW("touch_jitter", "RELEASE samples=%d max_dist=%.1fpx",
                     id(g_touch_samples), sqrt((double) id(g_touch_max_delta)));
            id(g_touch_active) = false;

binary_sensor:
  - platform: template
    name: "Panel Touch Input"
    id: panel_touch_input

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23
    frequency: 100Hz
    min_power: 0.0
    max_power: 0.8

light:
  - platform: monochromatic
    id: panel_backlight
    name: "Panel Backlight"
    icon: mdi:television
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  color_depth: 16
  byte_order: little_endian
  bg_color: 0x000000
  # Full-screen render buffer (default is 25 % of screen). Without this
  # LVGL splits each frame into 4 partial sub-frames and dispatches them
  # to the MIPI DSI driver as the LCD is mid-scan — visible as tearing
  # during the slideshow transitions. Full buffer = LVGL composes the
  # whole frame before flushing, so the panel reads a coherent image.
  # Costs ~1.2 MB PSRAM (1024 × 600 × RGB565), easily affordable.
  buffer_size: 100%
  # Touch feedback on every button: 2 px push-down while pressed.
  theme:
    button:
      pressed:
        translate_y: 2
  on_idle:
    timeout: "${idle_timeout}"
    then:
      - lvgl.page.show: slideshow_page

  # ── Top layer — overlays that must float above every page ──────
  top_layer:
    widgets:
      # ── Status toast — single error/status surface for the whole panel.
      # Shown via the panel_toast script (auto-hides after 8 s, tap to
      # dismiss). Lives on the LVGL top layer so it floats over any page.
      - obj:
          id: error_bar
          align: BOTTOM_MID
          y: -14
          width: 560
          height: 46
          radius: 23
          bg_color: ${c_error_bg}
          bg_opa: 92%
          border_width: 0
          hidden: true
          on_click:
            - lvgl.widget.hide: error_bar
          widgets:
            - label:
                id: error_lbl
                align: CENTER
                text: ""
                text_font: montserrat_16
                text_color: ${c_error_text}
      # ── Crash-recovery overlay (full screen, dismissible by tap).
      # The on_boot lambda checks esp_reset_reason() and unhides this
      # if the previous reset was a real software fault. Tap or 20-s
      # auto-dismiss clears it. Hidden by default so a clean boot
      # never sees it.
      - obj:
          id: crash_overlay
          width: 100%
          height: 100%
          align: TOP_LEFT
          bg_color: "${c_crash_bg}"
          bg_opa: 90%
          border_width: 0
          pad_all: 0
          hidden: true
          on_click:
            - lvgl.widget.hide: crash_overlay
          widgets:
            - label:
                id: crash_title_lbl
                align: CENTER
                y: -160
                text: "Panel Recovered From Crash"
                text_font: montserrat_28
                text_color: "${c_crash_title}"
            - label:
                id: crash_reason_lbl
                align: CENTER
                y: -100
                width: 880
                text: "Reason: --"
                text_font: montserrat_18
                text_color: "${c_error_text}"
                long_mode: WRAP
            - label:
                id: crash_body_lbl
                align: CENTER
                y: -40
                text: "The firmware caught the fault and rebooted itself.\nNothing is permanently damaged."
                text_font: montserrat_16
                text_color: "${c_text_2}"
                long_mode: WRAP
            - label:
                id: crash_steps_lbl
                align: CENTER
                y: 50
                width: 880
                text: "If this keeps happening:\n1. Tap to dismiss this banner.\n2. Note what you were doing when it happened.\n3. Re-flash the panel from the ESPHome dashboard, or unplug power for 5 s and plug it back in to fully reset."
                text_font: montserrat_16
                text_color: "${c_text_2}"
                long_mode: WRAP
            - label:
                id: crash_dismiss_lbl
                align: BOTTOM_MID
                y: -30
                text: "Tap anywhere on this banner to dismiss"
                text_font: montserrat_16
                text_color: 0xFFAAAA
      # ── HA disconnected pill (top-centre, visible at boot) ──
      # Was a full-screen overlay, but that blocked the whole panel while
      # the Tuya/Jellyfin/iHost pages work fine without HA. Now a compact
      # pill: everything local keeps working, HA-dependent actions just
      # no-op until reconnect. Same widget ids kept so core_ha.yaml
      # show/hide actions and the theme walker don't need changing.
      - obj:
          id: ha_disconnected_overlay
          align: TOP_MID
          y: 12
          width: 320
          height: 44
          bg_color: "${c_overlay_bg}"
          bg_opa: 88%
          radius: 22
          border_width: 1
          border_color: "${c_error}"
          pad_all: 0
          widgets:
            # Kept (hidden) so the theme walker's reference stays valid.
            - label:
                id: ha_disc_title_lbl
                hidden: true
                text: "Home Assistant"
                text_font: montserrat_18
                text_color: "${c_text}"
            - label:
                id: ha_disc_status_lbl
                align: LEFT_MID
                x: 18
                text: "HA offline"
                text_font: montserrat_18
                text_color: "${c_error}"
            - label:
                id: ha_disc_hint_lbl
                align: LEFT_MID
                x: 126
                text: "reconnecting..."
                text_font: montserrat_16
                text_color: 0x777777
      # ── Voice assistant state pill — hidden until wake word fires ──
      # Floats over the photo area bottom-centre. Color shifts per state:
      # green=Listening  amber=Thinking  blue=Responding.
      # Sits after tap_zone_btn so it renders on top of everything.
      - obj:
          id: va_mic_overlay
          align: BOTTOM_MID
          x: 170
          y: -50
          width: 210
          height: 52
          bg_color: 0x003300
          bg_opa: 88%
          radius: 26
          border_width: 2
          border_color: 0x00EE00
          hidden: true
          widgets:
            - image:
                id: va_mic_icon
                src: img_mic
                align: LEFT_MID
                x: 10
            - label:
                id: va_mic_label
                align: LEFT_MID
                x: 50
                text: "Listening..."
                text_font: montserrat_18
                text_color: 0x00EE00

  pages:
    # ═══════════════════════════════════════════════════════════
    # PAGE 1 — SLIDESHOW  (idle / lock screen)
    # Layout: full ${screen_w}x${screen_h}, full-bleed photo edge-to-edge.
    # The calendar panel sits on top of it (0 to its own width) as a
    # translucent (70% opaque) overlay, same pattern as stock_fallback_img
    # below — it doesn't reserve exclusive screen space from the photo.
    # ═══════════════════════════════════════════════════════════
    - id: slideshow_page
      bg_color: 0x000000
      widgets:
        # ── Background image (Immich or stock) ─────────────────
        # No explicit width/height — the widget auto-sizes to the actual
        # decoded image buffer. With explicit dimensions LVGL reads with
        # the WIDGET's stride (684×2 bytes/row) instead of the BUFFER's
        # stride, producing vertical-stripe corruption if they differ.
        # Position is updated to the slideshow area in the lambda below.
        - image:
            id: slideshow_img
            src: immich_photo
            x: 0
            y: 0
            hidden: true
        # Slot B of the double-buffered slideshow. Initially hidden — the
        # first download lands in slot B (because g_slideshow_slot starts
        # at 0, refresh_immich_slideshow targets the *inactive* slot), so
        # B becomes visible and slot A's empty buffer stays hidden until
        # the next refresh swaps them.
        - image:
            id: slideshow_img_b
            src: immich_photo_b
            x: 0
            y: 0
            hidden: true

        # ── Stock fallback images — container + 2 full-screen children ──
        # Container toggled by on_download_finished/on_error; inner images cycled via try_fallback_image.
        # Images are 1024x600 (full screen). Calendar panel sits on top with
        # bg_opa: 70% so the image shows through behind the text.
        - obj:
            id: stock_fallback_img
            width: 100%
            height: 100%
            align: TOP_LEFT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            hidden: true
            widgets:
              - image:
                  id: stock_fallback_img_0
                  src: stock_img_0
                  align: TOP_LEFT
                  x: 0
                  y: 0
              - image:
                  id: stock_fallback_img_1
                  src: stock_img_1
                  align: TOP_LEFT
                  x: 0
                  y: 0
                  hidden: true

        # Dim overlay during layout edit — sits above photos, below draggable widgets.
        - obj:
            id: layout_edit_scrim
            width: 100%
            height: 100%
            align: TOP_LEFT
            bg_color: 0x000000
            bg_opa: 40%
            border_width: 0
            pad_all: 0
            clickable: false
            hidden: true

        # ── Static placeholder (shown when all image sources fail) ──
        - obj:
            id: slideshow_placeholder_obj
            width: 100%
            height: 100%
            align: TOP_LEFT
            bg_color: 0x0D0D2B
            border_width: 0
            pad_all: 0
            widgets:
              - image:
                  src: img_no_photo
                  align: CENTER
                  y: -30
              - label:
                  align: CENTER
                  y: 72
                  text: "Photos Unavailable"
                  text_font: montserrat_24
                  text_color: 0x444466
              - label:
                  align: CENTER
                  y: 108
                  text: "Check Immich connection"
                  text_font: montserrat_18
                  text_color: 0x333355

        # ── Weather widget (top-right, transparent) ────────────
        # Stack of 9 mdi:weather-* icons at the same coordinates; the
        # weather_state on_value lambda reveals exactly one at a time and
        # recolours it by condition. Temperature + condition labels live
        # alongside. Background is fully transparent so the slideshow
        # photo shows through.
        - obj:
            id: weather_widget
            align: BOTTOM_RIGHT
            x: -14
            y: -14
            width: 210
            height: 224
            bg_color: "${c_overlay_bg}"
            bg_opa: 55%
            radius: 12
            border_width: 0
            pad_all: 0
            widgets:
              # Location label at the very top of the widget.
              - label:
                  id: wx_location_lbl
                  align: TOP_MID
                  y: 0
                  text: "${weather_location}"
                  text_font: montserrat_16
                  text_color: "${c_text_2}"
              # Stack of 9 condition icons; only the one matching state stays visible.
              - image: { id: wx_sunny,       src: img_wx_sunny,       align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_night,       src: img_wx_night,       align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_cloudy,      src: img_wx_cloudy,      align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_partlycloudy, src: img_wx_partlycloudy, align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_rainy,       src: img_wx_rainy,       align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_snowy,       src: img_wx_snowy,       align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_fog,         src: img_wx_fog,         align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_lightning,   src: img_wx_lightning,   align: TOP_MID, y: 22, hidden: true }
              - image: { id: wx_windy,       src: img_wx_windy,       align: TOP_MID, y: 22, hidden: true }
              - label:
                  id: wx_temp_lbl
                  align: TOP_MID
                  y: 122
                  text: "--°"
                  text_font: montserrat_36
                  text_color: "${c_text}"
              - label:
                  id: wx_cond_lbl
                  align: TOP_MID
                  y: 174
                  text: "-"
                  text_font: montserrat_16
                  text_color: "${c_text_soft}"
              # Humidity sits below the condition. Cyan tint so it doesn't
              # compete with the condition-coloured label above it.
              - label:
                  id: wx_humidity_lbl
                  align: TOP_MID
                  y: 198
                  text: "--% RH"
                  text_font: montserrat_16
                  text_color: "${c_info}"

        # ── Calendar panel (left side, 70% opaque) ─────────────
        - obj:
            id: calendar_panel
            x: 0
            y: 0
            width: 33%
            height: 100%
            align: TOP_LEFT
            bg_color: "${c_overlay_bg}"
            bg_opa: 70%
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              # Title row (centered)
              - label:
                  id: cal_title_lbl
                  align: TOP_MID
                  y: 10
                  text: "CALENDAR"
                  text_font: montserrat_20
                  text_color: "${c_accent}"
              # Today's date — centered just below the title
              - label:
                  id: cal_today_lbl
                  align: TOP_MID
                  y: 36
                  text: "---"
                  text_font: montserrat_16
                  text_color: "${c_footer_text}"
              # Page indicator at the bottom of the calendar panel.
              # Empty when the events fit on one page; otherwise "N/M".
              - label:
                  id: cal_page_lbl
                  align: BOTTOM_MID
                  y: -8
                  text: ""
                  text_font: montserrat_14
                  text_color: "${c_accent}"
              # Header divider
              - obj:
                  id: cal_header_div
                  x: 0
                  y: 60
                  width: 100%
                  height: 2
                  bg_color: "${c_divider}"
                  border_width: 0
                  radius: 0
              # ── Event rows (8 slots, 66px each, alternating ribbon colour) ──
              # Row 0 visible from boot with "No events this week"; on_value lambda
              # overwrites it when HA publishes the panel_calendar_events entity.
              # ── Event rows — flex column so hidden rows compact upward ──
              - obj:
