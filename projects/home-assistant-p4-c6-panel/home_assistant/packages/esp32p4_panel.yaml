homeassistant:
  customize:
    sensor.guition_p4_7inch_ha_panel_uptime:
      friendly_name: Panel Uptime
    sensor.guition_p4_7inch_ha_panel_wi_fi_rssi:
      friendly_name: Panel Wi-Fi RSSI
    binary_sensor.guition_p4_7inch_ha_panel_online:
      friendly_name: Panel Online
    light.guition_p4_7inch_ha_panel_backlight:
      friendly_name: Panel Backlight

# Allows changing Immich URL from HA UI without reflashing the device.
# The panel reads this at startup and whenever the value changes.
input_text:
  panel_immich_url:
    name: Panel Immich URL
    initial: ""
    max: 120
    icon: mdi:image-multiple

  panel_calendar_events:
    name: Panel Calendar Events
    initial: ""
    max: 255
    icon: mdi:calendar-week

automation:
  - alias: ESP32-P4 Panel Touch Log
    mode: queued
    trigger:
      - platform: mqtt
        topic: home/panel/esp32p4/touch
    action:
      - service: logbook.log
        data:
          name: ESP32-P4 Panel
          message: "Touch: {{ trigger.payload }}"

  - alias: Refresh Panel Calendar Events
    mode: single
    trigger:
      - platform: time_pattern
        hours: "/1"
      - platform: homeassistant
        event: start
    action:
      - variables:
          week_start: "{{ now().date().isoformat() }}"
          week_end: "{{ (now().date() + timedelta(days=7)).isoformat() + 'T23:59:59' }}"
      - service: calendar.get_events
        target:
          entity_id: >
            {{ states.calendar | map(attribute='entity_id') | list | join(', ') }}
        data:
          start_date_time: "{{ week_start + 'T00:00:00' }}"
          end_date_time: "{{ week_end }}"
        response_variable: cal_response
      - variables:
          lines: >
            {% set ns = namespace(out=[]) %}
            {% for cal_id, cal_data in cal_response.items() %}
              {% for event in cal_data.get('events', []) %}
                {% set start = event.start %}
                {% if 'T' in start %}
                  {% set dt = strptime(start[:16], '%Y-%m-%dT%H:%M') %}
                  {% set day = dt.strftime('%a') %}
                  {% set time = dt.strftime('%H:%M') %}
                  {% set line = day ~ ' ' ~ time ~ ' ' ~ event.summary %}
                {% else %}
                  {% set dt = strptime(start, '%Y-%m-%d') %}
                  {% set day = dt.strftime('%a') %}
                  {% set line = day ~ ' All Day: ' ~ event.summary %}
                {% endif %}
                {% set ns.out = ns.out + [{'dt': dt, 'line': line[:40]}] %}
              {% endfor %}
            {% endfor %}
            {{ (ns.out | sort(attribute='dt') | map(attribute='line') | list) | join('\n') }}
      - service: input_text.set_value
        target:
          entity_id: input_text.panel_calendar_events
        data:
          value: "{{ lines[:254] if lines else 'No events' }}"

rest_command:
  jellyfin_hub_cast:
    url: "http://192.168.55.59:8768/jellyfin/cast/{{ item_id }}"
    method: POST
    content_type: "application/json"
    payload: "{}"
    timeout: 30

script:
  # Panel Jellyfin page: pick a movie, choose cast target with < >, tap Cast Play.
  # LG webOS: launches the Jellyfin webOS app at the selected item via webostv.command.
  # Fire TV Cube: ADB opens the Jellyfin app, then the panel-hub uses the Jellyfin
  #   Sessions API to push the specific movie to the active Fire TV session.
  #   Requires the Android TV (ADB) integration in HA pointed at 192.168.55.77.
  jellyfin_play_on_panel:
    alias: Jellyfin cast play from panel
    mode: queued
    fields:
      item_id:
        description: Jellyfin item UUID from the panel
        example: "f1234567890abcdef1234567890ab"
      item_name:
        description: Movie title shown on the panel
        example: "Inception"
      media_player:
        description: Target media_player entity_id selected on the panel
        example: "media_player.lg_webos_tv_58b2"
    sequence:
      - service: logbook.log
        data:
          name: ESP32-P4 Panel
          message: >-
            Jellyfin cast: {{ item_name }} → {{ media_player }}
            ({{ item_id }})
      - choose:
          - conditions: "{{ media_player == 'media_player.lg_webos_tv_58b2' }}"
            sequence:
              - service: webostv.command
                target:
                  entity_id: media_player.lg_webos_tv_58b2
                data:
                  command: request
                  payload:
                    uri: "ssap://system.launcher/launch"
                    payload:
                      id: "org.jellyfin.webos"
                      params:
                        contentId: "{{ item_id }}"
                        contentTargetUrl: "jellyfin://jellyfin/play?itemid={{ item_id }}&serverId=cde23bef4a1c413185304272f50478c0"
          - conditions: "{{ media_player == 'media_player.fire_tv_192_168_55_77' }}"
            sequence:
              - service: rest_command.jellyfin_hub_cast
                data:
                  item_id: "{{ item_id }}"
        default:
          - service: logbook.log
            data:
              name: ESP32-P4 Panel
              message: "Invalid cast target: {{ media_player }}"

  # Spoken feedback for panel actions (room-light toggles etc.). The panel
  # firmware calls this as ${announce_script}. Originally a UI-created script
  # (deleted 2026-07-03 during the token-leak cleanup, which silently broke
  # all panel announcements) — now version-controlled here.
  #
  # MUST go through assist_satellite.announce, not tts.speak: the panel
  # streams its mic to HA continuously for wake word detection, and only the
  # voice assistant's own announce path releases the shared I2S bus before
  # playback. A direct tts.speak to the media_player deadlocks against the
  # mic ("Parent I2S bus not free" retry loop).
  panel_announce:
    alias: Panel Room Announcement
    mode: queued
    fields:
      message:
        description: Text to speak on the panel
        example: "Drawing room lights on"
    sequence:
      - service: assist_satellite.announce
        target:
          entity_id: assist_satellite.guition_p4_7inch_ha_panel_assist_satellite
        data:
          message: "{{ message }}"

template:
  - trigger:
      - platform: mqtt
        topic: home/panel/esp32p4/touch
    sensor:
      - name: esp32p4_panel_last_touch
        state: "{{ trigger.payload }}"

# Hypontech Cloud — full data via hypon-proxy (see hypon-proxy/ in the repo).
# HA's own "Hypontech Cloud" integration only exposes power/today/lifetime
# energy from 2 of the API's 5 endpoints; this pulls everything else the
# cloud reports (grid power, home load, battery, faults, CO2/trees, earnings)
# from the account's single plant via a local proxy on the Docker host.
rest:
  - resource: http://192.168.55.59:8769/hypon/status
    scan_interval: 60
    sensor:
      - name: "Hypon Capacity"
        unique_id: hypon_capacity
        value_template: "{{ value_json.overview.capacity_kw }}"
        unit_of_measurement: "kW"
        icon: mdi:solar-power-variant
      - name: "Hypon Devices Normal"
        unique_id: hypon_devices_normal
        value_template: "{{ value_json.overview.devices_normal }}"
        icon: mdi:check-circle
      - name: "Hypon Devices Fault"
        unique_id: hypon_devices_fault
        value_template: "{{ value_json.overview.devices_fault }}"
        icon: mdi:alert-circle
      - name: "Hypon Devices Offline"
        unique_id: hypon_devices_offline
        value_template: "{{ value_json.overview.devices_offline }}"
        icon: mdi:lan-disconnect
      - name: "Hypon Total CO2 Saved"
        unique_id: hypon_total_co2
        value_template: "{{ value_json.overview.total_co2_kg }}"
        unit_of_measurement: "kg"
        icon: mdi:molecule-co2
      - name: "Hypon Total Trees Equivalent"
        unique_id: hypon_total_trees
        value_template: "{{ value_json.overview.total_trees }}"
        icon: mdi:tree
      - name: "Hypon Earning Today"
        unique_id: hypon_earning_today
        value_template: "{{ value_json.overview.earning_today }}"
        unit_of_measurement: "{{ value_json.overview.earning_currency }}"
        icon: mdi:cash
      - name: "Hypon Earning Total"
        unique_id: hypon_earning_total
        value_template: "{{ value_json.overview.earning_total }}"
        unit_of_measurement: "{{ value_json.overview.earning_currency }}"
        icon: mdi:cash-multiple
      - name: "Hypon Grid Power"
        unique_id: hypon_grid_power
        value_template: "{{ (value_json.plants.values() | list | first).monitor.grid_power_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Hypon Home Load"
        unique_id: hypon_home_load
        value_template: "{{ (value_json.plants.values() | list | first).monitor.home_load_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Hypon PV Power"
        unique_id: hypon_pv_power
        value_template: "{{ (value_json.plants.values() | list | first).monitor.pv_power_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Hypon Battery Power"
        unique_id: hypon_battery_power
        value_template: "{{ (value_json.plants.values() | list | first).monitor.battery_power_w }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Hypon Battery SOC"
        unique_id: hypon_battery_soc
        value_template: "{{ (value_json.plants.values() | list | first).monitor.battery_soc_pct }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: "Hypon Energy This Month"
        unique_id: hypon_energy_month
        value_template: "{{ (value_json.plants.values() | list | first).monitor.e_month_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Hypon Energy This Year"
        unique_id: hypon_energy_year
        value_template: "{{ (value_json.plants.values() | list | first).monitor.e_year_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Hypon Inverter Status"
        unique_id: hypon_inverter_status
        value_template: "{{ (value_json.plants.values() | list | first).inverters[0].status }}"
        icon: mdi:current-ac
      - name: "Hypon Inverter Fault Count"
        unique_id: hypon_inverter_fault_count
        value_template: "{{ (value_json.plants.values() | list | first).fault_count }}"
        icon: mdi:alert
      - name: "Hypon Inverter Warning Count"
        unique_id: hypon_inverter_warning_count
        value_template: "{{ (value_json.plants.values() | list | first).warning_count }}"
        icon: mdi:alert-outline
      - name: "Hypon Gateway Status"
        unique_id: hypon_gateway_status
        value_template: "{{ (value_json.plants.values() | list | first).inverters[0].gateway_status }}"
        icon: mdi:wifi

