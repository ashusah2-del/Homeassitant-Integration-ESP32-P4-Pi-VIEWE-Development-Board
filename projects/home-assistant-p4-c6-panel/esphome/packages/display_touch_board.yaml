          lv_obj_clear_flag(id(tado1_card), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(tado2_card), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(tado3_card), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(tado4_card), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(tado5_card), LV_OBJ_FLAG_SCROLLABLE);
          lv_obj_clear_flag(id(tado6_card), LV_OBJ_FLAG_SCROLLABLE);

