# ─── iHost / eWeLink HA integration ──────────────────────────────────────────
# Creates sensor and switch entities in Home Assistant backed by the panel-hub
# service (port 8768, /ihost/ prefix). Drop into HA packages folder and reload.
#
# Prerequisites:
#   1. panel-hub running: docker compose up -d  (in panel-hub/)
#   2. IHOST_URL and IHOST_TOKEN set in hub.env
#
# GET  /ihost/device/<serial>  → {"serial":…,"name":…,"online":…,"on":null,"temperature":…,"humidity":…}
# POST /ihost/device/<serial>  with {"on":true/false} → controls switches

# ── Temperature / humidity sensors (6 Zigbee TH sensors) ──────────────────────
sensor:
  - platform: rest
    name: "iHost Office Temperature"
    unique_id: ihost_office_temperature
    resource: "http://192.168.55.59:8768/ihost/device/00124b00292aea32"
    value_template: "{{ value_json.temperature }}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 60
    icon: mdi:thermometer

  - platform: rest
    name: "iHost Office Humidity"
    unique_id: ihost_office_humidity
    resource: "http://192.168.55.59:8768/ihost/device/00124b00292aea32"
    value_template: "{{ value_json.humidity }}"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    scan_interval: 60
    icon: mdi:water-percent

