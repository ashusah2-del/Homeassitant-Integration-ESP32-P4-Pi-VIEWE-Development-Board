# ─── Latest Movies page (YTS browse → Radarr grab) ────────────────────────────
# Browses the YTS "latest movies" feed via panel-hub (:8768) and, on Download,
# hands the movie to Radarr by IMDb id (Radarr → Prowlarr → qBittorrent → import
# into Jellyfin). The hub cross-references the Jellyfin library + Radarr queue so
# each row shows a status dot: green = already in library, amber = downloading,
# grey = available to grab.
#
# Reuses the hub base URL (id(immich_base_url)) and the jf_* layout substitutions
# that both panel profiles already define. Posters come back as baseline JPEG
# from the hub (JPEGDEC-safe — never fetch YTS covers directly, see CLAUDE.md).
# Parallel online_image downloads are unreliable on the P4, so row thumbnails are
# lazy-loaded one at a time; the big detail poster loads only for the selection.

globals:
  - id: g_yts_bridge_ok
    type: bool
    restore_value: false
  - id: g_yts_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_yts_page_active
    type: bool
    restore_value: false
  - id: g_yts_page
    type: int
    restore_value: false
    initial_value: '1'
  - id: g_yts_total
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_yts_sort
    type: int
    restore_value: true
    initial_value: '0'   # 0 = latest added to YTS, 1 = newest release (year)
  - id: g_yts_selected_row
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_yts_movies_json
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_yts_selected_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_yts_selected_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_yts_selected_year
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_yts_selected_status
    type: std::string
    restore_value: no
    initial_value: '""'

online_image:
  - id: yts_poster
    url: "${jellyfin_proxy_url}/yts/poster/0"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 280x400
    buffer_size: 65536
    update_interval: never
    request_headers:
      Accept: image/jpeg
    on_download_finished:
      - lambda: |-
          if (id(g_yts_page_active) && id(g_lvgl_ready)) {
            lv_img_set_src(id(yts_poster_widget), id(yts_poster).get_lv_img_dsc());
