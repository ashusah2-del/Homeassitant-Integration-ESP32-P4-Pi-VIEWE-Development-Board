      - script.execute: va_apply_current

  - id: va_ui_set_error
    mode: restart
    then:
      - lambda: |-
          id(g_va_ui_state) = 5;
          id(g_va_indicator_pulse) = false;
      - script.execute: va_apply_current


  - id: sync_panel_theme_to_ha
    mode: restart
    then:
      - lambda: 'id(g_theme_push_to_ha) = true;'
      - homeassistant.service:
          service: input_select.select_option
          data:
            entity_id: input_select.panel_theme
            option: !lambda |-
              static const char *names[] = {
                "Midnight", "Graphite", "Warm Home", "Nord", "High Contrast",
                "Home Assistant"
              };
              int i = id(g_panel_theme);
              if (i < 0) i = 0;
              if (i > 5) i = 5;
              return std::string(names[i]);
      - lambda: 'id(g_theme_push_to_ha) = false;'

  - id: panel_theme_from_ha
    mode: restart
    then:
      - lambda: |-
          if (!id(ha_panel_theme).has_state()) return;
          std::string x = id(ha_panel_theme).get_state();
          static const char *names[] = {
            "Midnight", "Graphite", "Warm Home", "Nord", "High Contrast",
            "Home Assistant"
          };
          int idx = 0;
          for (int i = 0; i < 6; i++) {
            if (x == names[i]) { idx = i; break; }
          }
          id(g_panel_theme) = idx;
      - script.execute: apply_panel_theme

  - id: panel_theme_prev
    mode: restart
    then:
      - lambda: |-
          int v = id(g_panel_theme) - 1;
          if (v < 0) v = 5;
          id(g_panel_theme) = v;
      - script.execute: apply_panel_theme
      - script.execute: sync_panel_theme_to_ha

  - id: panel_theme_next
    mode: restart
    then:
      - lambda: |-
          int v = id(g_panel_theme) + 1;
          if (v > 5) v = 0;
          id(g_panel_theme) = v;
      - script.execute: apply_panel_theme
      - script.execute: sync_panel_theme_to_ha
