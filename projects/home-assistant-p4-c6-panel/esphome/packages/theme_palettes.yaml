          lv_obj_set_style_bg_color(id(slideshow_layout_btn), lv_color_hex(t.accent_bg), 0);
          lv_obj_set_style_border_color(id(slideshow_layout_btn), lv_color_hex(t.accent_border), 0);
          uint32_t lbn = lv_obj_get_child_cnt(id(slideshow_layout_btn));
          for (uint32_t i = 0; i < lbn; i++) {
            lv_obj_t *ch = lv_obj_get_child(id(slideshow_layout_btn), i);
            if (lv_obj_check_type(ch, &lv_label_class)) {
              lv_obj_set_style_text_color(ch, lv_color_hex(t.text_primary), 0);
