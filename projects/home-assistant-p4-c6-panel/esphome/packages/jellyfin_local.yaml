# ─── Jellyfin browse page ─────────────────────────────────────────────────────
# Movie list + posters: LAN jellyfin-proxy (:8767). Direct Jellyfin API calls from
# the panel were unreliable (auth headers / concurrent http_request); the proxy
# talks to Jellyfin on the server and returns panel-friendly JSON + JPEG posters.

globals:
  - id: g_jf_bridge_ok
    type: bool
    restore_value: false
  - id: g_jf_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_jf_page_active
    type: bool
    restore_value: false
  - id: g_jf_start_index
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_jf_total
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_jf_selected_row
    type: int
    restore_value: false
    initial_value: '-1'
  - id: g_jf_movies_json
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_jf_selected_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_jf_selected_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_jf_selected_year
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_jf_user_id
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_jf_cast_idx
    type: int
    restore_value: true
    initial_value: '0'

online_image:
  - id: jf_poster
    url: "${jellyfin_proxy_url}/poster/none"
    format: JPEG
    type: RGB565
    byte_order: LITTLE_ENDIAN
    resize: 280x400
    buffer_size: 65536
    update_interval: never
    request_headers:
      Accept: image/jpeg
    on_download_finished:
      - lambda: |-
          if (id(g_jf_page_active) && id(g_lvgl_ready)) {
            lv_img_set_src(id(jf_poster_widget), id(jf_poster).get_lv_img_dsc());
            lv_obj_invalidate(id(jf_poster_widget));
          }
