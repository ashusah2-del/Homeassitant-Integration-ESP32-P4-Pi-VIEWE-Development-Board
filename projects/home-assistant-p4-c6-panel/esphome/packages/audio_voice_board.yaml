i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

switch:
  - platform: gpio
    name: "Speaker Enable"
    icon: mdi:speaker
    pin: GPIO11
    restore_mode: ALWAYS_ON

microphone:
  - platform: i2s_audio
    id: panel_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO48
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: panel_spk
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO9
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000

media_player:
  - platform: speaker
    name: "Speaker"
    id: panel_media_player
    announcement_pipeline:
      speaker: panel_spk
      format: FLAC

# Start local Okay Nabu detection whenever HA API is up. Voice assistant
# (use_wake_word: true) owns the wake→Assist handoff — do NOT call
# voice_assistant.start from micro_wake_word.on_wake_word_detected.
script:
  - id: ensure_wake_word_running
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(g_ha_connected);'
          then:
            - micro_wake_word.enable_model: okay_nabu_model
            - micro_wake_word.start:
                id: panel_mww
            - logger.log:
                level: INFO
                tag: wake_word
                format: "Okay Nabu engine armed"

micro_wake_word:
  id: panel_mww
  microphone: panel_mic
  models:
    - id: okay_nabu_model
      model: okay_nabu

voice_assistant:
  id: panel_va
  microphone: panel_mic
  media_player: panel_media_player
  micro_wake_word: panel_mww
  use_wake_word: true
  on_client_connected:
    - script.execute: ensure_wake_word_running
    - script.execute: va_ui_set_ready
  on_client_disconnected:
    # Assist pipeline can reconnect independently of the ESPHome API. Do not
    # stop local wake-word detection while HA is still connected — that left
    # the panel permanently deaf until a full reboot.
    - if:
        condition:
          lambda: 'return id(g_ha_connected);'
        then:
          - script.execute: ensure_wake_word_running
          - script.execute: va_ui_set_ready
        else:
          - micro_wake_word.stop:
              id: panel_mww
          - script.execute: va_ui_set_offline
  on_wake_word_detected:
    - logger.log:
        level: INFO
        tag: wake_word
        format: "Okay Nabu heard — Assist listening"
    - script.execute: va_ui_set_listening
  on_stt_end:
    - script.execute: va_ui_set_thinking
  on_tts_start:
    - script.execute: va_ui_set_speaking
    - homeassistant.service:
        service: "${announce_script}"
        variables:
          msg: "return x;"
        data_template:
          message: "{{ msg }}"
  on_end:
    - script.execute: va_ui_set_ready
    - script.execute: ensure_wake_word_running
  on_error:
    - script.execute: va_ui_set_error
    - delay: 3s
    - script.execute: ensure_wake_word_running
    - script.execute: va_ui_set_ready

# Safety net: if wake-word detection stops while HA is up and Assist is idle,
# restart it (e.g. after a failed voice session or Assist pipeline reconnect).
interval:
  - interval: 15s
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(g_ha_connected);'
              - not:
                  voice_assistant.is_running:
                    id: panel_va
              - not:
                  micro_wake_word.is_running:
                    id: panel_mww
          then:
            - logger.log:
                level: WARN
                tag: wake_word
                format: "MWW idle while HA up — restarting"
            - script.execute: ensure_wake_word_running
            - script.execute: va_ui_set_ready

sensor:
  - platform: adc
    pin: GPIO53
    name: "Battery Voltage"
    id: panel_battery_voltage
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 15s
    unit_of_measurement: "V"
    filters:
      - multiply: 2.0
